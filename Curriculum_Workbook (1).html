<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Workbook</title>
<style>
  :root{
    --navy:#1c2b4a; --navy-deep:#12203b; --gold:#c9a227; --gold-light:#e8d9a8;
    --paper:#faf9f6; --line:#d9d5cb; --ink:#22262e; --muted:#6b7280;
    --ok:#3a6b52; --danger:#8a3b3b;
    font-family:'Georgia',serif;
  }
  *{box-sizing:border-box;}
  body,.root{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;}
  .app{display:flex;min-height:100vh;background:var(--paper);}
  .rail{width:280px;background:var(--navy-deep);color:#ffffff;flex-shrink:0;padding:20px 16px;position:relative;transition:width .15s;}
  .rail-toggle{position:absolute;top:18px;right:10px;width:28px;height:28px;border-radius:5px;border:1px solid #3a4a75;background:#233459;color:#fff;cursor:pointer;font-size:15px;line-height:24px;padding:0;}
  .rail-toggle:hover{background:#3a4a75;}
  .app.rail-collapsed .rail{width:44px;padding:20px 8px;overflow:hidden;}
  .app.rail-collapsed .rail > *:not(.rail-toggle){display:none;}
  .app.rail-collapsed .rail-toggle{right:8px;}
  .main.seq-wide{padding:20px 18px;}
  .main.seq-wide .card.seq-card{padding:18px 14px;}
  .rail h1{font-family:Georgia,serif;font-size:21px;letter-spacing:.03em;margin:0 0 14px;color:#fff;font-weight:700;}
  .rail .sub{font-size:13px;color:#c7d1ea;margin-bottom:18px;letter-spacing:.05em;text-transform:uppercase;}
  .prog-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .prog-btn{text-align:left;background:#233459;border:1px solid #3a4a75;color:#ffffff;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:15.5px;font-weight:600;font-family:inherit;}
  .prog-btn:hover{background:#2d4270;border-color:var(--gold);}
  .prog-btn.active{background:var(--gold);color:#241d04;font-weight:700;border-color:var(--gold);}
  .add-prog{display:flex;gap:6px;margin-top:8px;}
  .add-prog input{flex:1;min-width:0;background:#233459;border:1px solid #3a4a75;color:#fff;padding:8px 10px;border-radius:5px;font-size:14.5px;}
  .add-prog button{background:var(--gold);border:none;color:#241d04;padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:700;font-size:14.5px;}
  .main{flex:1;padding:30px 38px;max-width:1900px;}
  .prog-title{font-family:Georgia,serif;font-size:29px;color:var(--navy);margin:0 0 3px;}
  .prog-meta{font-size:14px;color:var(--muted);margin-bottom:20px;}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;border-bottom:2px solid var(--line);padding-bottom:14px;}
  .tab{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:16px;cursor:pointer;font-size:14.5px;color:var(--navy);}
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 28px;margin-bottom:18px;}
  .card h2{font-family:Georgia,serif;color:var(--navy);font-size:22px;margin:0 0 5px;border-bottom:2px solid var(--gold);padding-bottom:9px;}
  .card .desc{font-size:14.5px;color:var(--muted);margin:7px 0 18px;line-height:1.55;}
  label{display:block;font-size:14px;font-weight:700;color:var(--navy);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.03em;}
  textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:15.5px;font-family:inherit;background:#fffdf8;}
  textarea{min-height:78px;resize:vertical;}
  table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px;}
  th{background:var(--navy);color:#fff;padding:8px 8px;text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;}
  td{border:1px solid var(--line);padding:6px;vertical-align:top;}
  td input,td textarea,td select{border:none;width:100%;background:transparent;font-size:14.5px;padding:4px;}
  td input:focus,td textarea:focus,td select:focus{background:#fff8e0;outline:1px solid var(--gold);}
  .row-actions{margin-top:10px;display:flex;gap:8px;}
  .btn{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:14.5px;font-weight:600;}
  .btn.gold{background:var(--gold);color:#2a2205;}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);}
  .btn.small{padding:5px 11px;font-size:13.5px;}
  .btn.danger{background:#8a3b3b;color:#fff;}
  .ui-modal-backdrop{position:fixed;inset:0;background:rgba(20,28,48,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;}
  .ui-modal{background:#fff;border-radius:8px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25);color:var(--ink);}
  .ui-modal h3{margin:0 0 8px;font-family:Georgia,serif;color:var(--navy);font-size:19px;}
  .ui-modal p{margin:0 0 12px;font-size:14.5px;line-height:1.45;}
  .ui-field{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:0 0 10px;}
  .ui-field input,.ui-field select{margin-top:4px;}
  .ui-field select{width:100%;border:1px solid var(--line);border-radius:5px;padding:9px 10px;font-size:15px;background:#fffdf8;}
  .ui-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .oc-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
  .oc-num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:6px;}
  .oc-main{flex:1;}
  .oc-main textarea{margin-bottom:4px;}
  .oc-pillar{display:flex;gap:8px;align-items:center;font-size:13px;color:#5b6478;}
  .oc-pillar select{flex:1;max-width:420px;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fffdf8;}
  .oc-x{background:transparent;border:1px solid var(--line);color:#8a3b3b;border-radius:50%;width:26px;height:26px;cursor:pointer;margin-top:6px;font-size:15px;}
  .sow-note{background:#fff4e5;border:1px solid #e0a96d;border-left:4px solid #c9822b;color:#5a3a10;border-radius:0 6px 6px 0;padding:10px 14px;font-size:14px;line-height:1.45;margin:0 0 14px;}
  .ref-box{background:#f4f6fa;border:1px solid #d6dce8;border-radius:6px;padding:12px 14px;margin:0 0 16px;}
  .ref-box h4{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#5b6478;}
  .ref-box table.sf-auto{background:#fff;}
  .ac-pillar{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 14px;background:#fffdf8;}
  .ac-pillar-head{font-family:Georgia,serif;color:var(--navy);font-size:18px;font-weight:700;}
  .ac-def{font-size:14px;color:#5b6478;margin:2px 0 10px;}
  .ac-row{display:grid;grid-template-columns:2fr 1.4fr 1.2fr 30px;gap:10px;align-items:start;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line);}
  .ac-col span{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
  .ac-col select{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px;background:#fff;}
  .ac-row .oc-x{margin-top:20px;}
  .sample-banner{background:#eef4fb;border:1px solid #c9d8ec;border-left:4px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 16px;font-size:14.5px;line-height:1.5;color:#23405f;margin:0 0 16px;}
  .sample-flow{margin-top:8px;font-size:13.5px;color:#3a4f6b;}
  .cc-box{border:1px solid #d9d5cb;border-radius:6px;padding:12px 14px;margin-bottom:12px;background:#fffdf8;}
  .cc-title{font-weight:700;color:var(--navy);font-size:16px;margin-bottom:6px;}
  h3.cc-section{font-family:Georgia,serif;color:var(--navy);font-size:18px;margin:18px 0 8px;}
  table.sf-auto{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:14px;}
  table.sf-auto th{background:#eef1f6;color:var(--navy);text-align:left;padding:6px 8px;border:1px solid var(--line);font-size:13px;}
  table.sf-edit textarea{width:100%;min-height:44px;font-size:13.5px;padding:6px 8px;}
  table.sf-auto td{padding:6px 8px;border:1px solid var(--line);vertical-align:top;}
  .sf-q{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 10px;background:#fffdf8;}
  .sf-q-title{font-weight:700;color:var(--navy);margin-bottom:4px;}
  .sf-tag{display:inline-block;font-size:11.5px;font-weight:600;background:#eef1f6;color:var(--navy);border-radius:10px;padding:1px 8px;margin-left:6px;}
  .sf-row{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
  .sf-row input[type=text]{flex:1;}
  .sf-none{font-size:13px;white-space:nowrap;display:flex;gap:4px;align-items:center;margin:0;}
  .copy-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 14px;}
  .copy-card h3{margin:0 0 4px;font-family:Georgia,serif;color:var(--navy);font-size:18px;}
  .copy-card .hint{font-size:13.5px;color:#5b6478;margin:0 0 10px;}
  .copy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;margin:8px 0 12px;}
  .copy-grid label{font-size:14px;display:flex;gap:6px;align-items:flex-start;}
  .copy-grid label.empty{color:#9aa1b0;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .status{font-size:13.5px;color:var(--ok);}
  .pill{display:inline-block;background:var(--gold-light);color:#5a4a0f;border-radius:10px;padding:3px 10px;font-size:13px;margin-left:6px;}
  .empty{color:var(--muted);font-style:italic;font-size:15px;padding:10px 0;}
  .flowhint{background:#f2f6f2;border-left:3px solid var(--ok);padding:9px 13px;font-size:13.5px;color:#2f4d3d;margin-bottom:14px;border-radius:0 5px 5px 0;}
  /* higher-specificity fix: rail inputs must stay dark-background/white-text
     even though the generic input[type=text] rule above sets a light background */
  .rail input[type=text]{background:#233459;color:#fff;}
  .rail input[type=text]::placeholder{color:#c7d1ea;}
  .family-group{margin-bottom:16px;}
  .family-name{font-size:17px;color:#ffffff;font-weight:800;letter-spacing:.01em;padding:4px 2px;margin-top:8px;font-family:Georgia,serif;}
  .fam-edit-btn{font-size:12px;color:#9aa5c0;cursor:pointer;font-weight:400;margin-left:4px;}
  .fam-edit-btn:hover{color:#fff;}
  .track-chip-wrap{position:relative;display:inline-flex;}
  .track-x-btn{position:absolute;top:-6px;right:-6px;background:#8a3b3b;color:#fff;border-radius:50%;width:16px;height:16px;font-size:11px;line-height:16px;text-align:center;cursor:pointer;display:none;}
  .track-chip-wrap:hover .track-x-btn{display:block;}
  .track-edit-btn{position:absolute;top:-6px;left:-6px;background:#3a4a75;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;cursor:pointer;display:none;}
  .track-chip-wrap:hover .track-edit-btn{display:block;}
  .track-row{display:flex;flex-wrap:wrap;gap:6px;}
  .track-row .prog-btn.track-btn{flex:0 0 auto;min-width:90px;text-align:center;}
  .add-track-btn{background:transparent;border:1px dashed #5a6c99;color:#c7d1ea;font-size:12.5px;padding:5px 9px;border-radius:5px;cursor:pointer;margin:4px 0 6px;font-weight:600;}
  .bulk-toggle{background:none;border:none;color:#c7d1ea;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px 0 0;font-weight:600;}
  .bulk-wrap textarea{width:100%;background:#233459;color:#fff;border:1px solid #3a4a75;border-radius:5px;font-size:13.5px;padding:7px 9px;min-height:70px;}
  .stepper{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0;margin-bottom:6px;}
  .step{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;padding:0 10px 10px;min-width:80px;}
  .step .circle{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:5px;}
  .step .lbl{font-size:12px;text-align:center;color:var(--muted);line-height:1.3;max-width:88px;}
  .step.active .circle{background:var(--navy);border-color:var(--navy);color:#fff;}
  .step.active .lbl{color:var(--navy);font-weight:700;}
  .step.done .circle{background:var(--gold);border-color:var(--gold);color:#2a2205;}
  .step:hover .circle{border-color:var(--gold);}
  .step:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 22px);width:calc(100% - 22px);height:2px;background:var(--line);}
  .nav-hint{font-size:13.5px;color:var(--muted);margin-bottom:10px;}
  .back-link{display:inline-block;font-size:14px;color:var(--navy);text-decoration:none;margin-bottom:14px;cursor:pointer;font-weight:600;}
  .back-link:hover{text-decoration:underline;}
  .landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .site-landing-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start;}
  @media (max-width:1000px){.site-landing-grid{grid-template-columns:1fr;}}
  .announce-form textarea{min-height:70px;}
  .announce-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:14px 16px;margin-bottom:12px;}
  .announce-meta{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .announce-body{font-size:14.5px;color:var(--ink);white-space:pre-line;line-height:1.5;}
  .announce-delete{background:none;border:none;color:#b04a4a;font-size:12px;cursor:pointer;text-decoration:underline;}
  .landing-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;cursor:pointer;transition:border-color .15s;}
  .landing-card:hover{border-color:var(--gold);}
  .landing-card .num{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.05em;}
  .landing-card h3{margin:5px 0 7px;font-size:17px;color:var(--navy);font-family:Georgia,serif;}
  .landing-card p{margin:0;font-size:14px;color:var(--muted);line-height:1.45;}
  .landing-card .badge{float:right;font-size:11.5px;padding:3px 9px;border-radius:9px;background:#eee;color:#777;}
  .landing-card .badge.done{background:#dff0e6;color:var(--ok);}
  .instr{margin:8px 0 16px;border:1px solid var(--gold-light);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;background:#fdfaf0;padding:12px 16px;}
  .instr .instr-label{font-size:12px;font-weight:700;color:#8a6d1a;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .instr .instr-body{font-size:14.5px;color:#3a3f4a;line-height:1.6;white-space:pre-line;}
  details.instr summary.instr-label{cursor:pointer;margin-bottom:0;list-style:none;}
  details.instr summary.instr-label::-webkit-details-marker{display:none;}
  details.instr summary.instr-label::before{content:'▸ ';}
  details.instr[open] summary.instr-label::before{content:'▾ ';}
  details.instr[open] summary.instr-label{margin-bottom:8px;}
  details.instr .instr-body{margin-top:4px;}
  .fhint{font-size:13.5px;color:#8a6d1a;font-style:italic;margin:-2px 0 6px;line-height:1.45;}
  .shint{font-size:14px;color:#6b7280;background:#f7f5ee;border-left:3px solid var(--gold-light);padding:9px 12px;margin:7px 0 11px;border-radius:0 5px 5px 0;line-height:1.55;white-space:pre-line;}
  .quick-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f2f6fb;border:1px solid #cddaf0;border-radius:5px;padding:8px 10px;margin-bottom:12px;}
  .quick-edit .qe-lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:#5a6c8f;font-weight:700;}
  .quick-edit input{width:auto;flex:1;min-width:80px;padding:6px 8px;font-size:14.5px;border:1px solid #cddaf0;background:#fff;}
  .quick-edit .qe-title{flex:2;min-width:150px;}

  .wb-prog{font-size:17px;font-weight:800;font-family:Georgia,serif;color:#fff;margin:2px 0 4px;line-height:1.3;}
  .wb-nav-list{margin-top:14px;gap:5px;}
  .prog-btn.wb-nav{font-size:14.5px;padding:8px 10px;display:flex;gap:8px;align-items:baseline;}
  .wb-num{display:inline-block;min-width:30px;color:var(--gold);font-family:Georgia,serif;font-weight:700;font-size:13px;}
  .prog-btn.wb-nav.active .wb-num{color:#241d04;}
  .wb-save{border-top:1px solid #3a4a75;margin-top:16px;padding-top:12px;}
  .wb-save-note{font-size:12.5px;line-height:1.45;color:#c7d1ea;margin-bottom:8px;}
  .add-track-btn.wb-full{display:block;width:100%;text-align:left;margin:5px 0;}
  .add-track-btn.wb-danger{border-color:#7a4a4a;color:#e7b9b9;margin-top:12px;}
  .wb-setup{max-width:720px;margin:20px auto;}
  .wb-privacy{font-size:13.5px;color:var(--muted);line-height:1.5;padding:4px 4px 20px;}
  .wb-how{margin:6px 0 0;padding-left:20px;line-height:1.55;font-size:15px;}
  .wb-how li{margin-bottom:8px;}
  details.wb-process > summary{cursor:pointer;list-style:revert;}
  .wb-dept{font-size:17px;font-weight:800;font-family:Georgia,serif;color:#fff;margin:2px 0 10px;line-height:1.3;}
  .wb-rail-label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#c7d1ea;margin:16px 0 0;font-weight:700;}
  .prog-btn.wb-prog-btn{font-size:14.5px;padding:8px 10px;}
  .wb-check{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:500;font-size:14.5px;margin-top:12px;color:var(--ink);}
  .wb-check input{width:auto;margin:0;}
  .wb-gate-msg{color:var(--danger);font-size:14px;margin-top:8px;min-height:1em;}
  .wb-prog-actions{margin-left:10px;white-space:nowrap;}
  .btn.wb-danger-btn{color:var(--danger);border-color:#d9b4b4;}
  .wb-setup input[type=password]{width:100%;border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:15.5px;font-family:inherit;background:#fffdf8;}
  .wb-admin-link{text-align:center;font-size:13.5px;margin:4px 0 30px;}
  .wb-admin-link a{color:var(--muted);}
  .wb-adm-table{width:100%;border-collapse:collapse;margin-top:10px;}
  .wb-adm-table th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#fff;padding:7px 10px;}
  .wb-adm-table td{padding:4px 6px;}
  .wb-adm-msg{font-size:14px;margin-top:10px;line-height:1.6;}
  .wb-adm-msg .ok{color:var(--ok);} .wb-adm-msg .bad{color:var(--danger);}
  .wb-adm-list{list-style:none;padding:0;margin:8px 0 0;}
  .wb-adm-list li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
  .wb-mine .wb-check{display:block;margin-top:10px;}
  .wb-mine .wb-check input{margin-right:8px;vertical-align:-1px;}
  .wb-built{font-size:12px;color:var(--ok);font-weight:600;margin-left:4px;}
  .wb-setup select{width:100%;padding:10px 12px;font-size:15.5px;border:1px solid var(--line);border-radius:6px;background:#fffdf7;color:var(--ink);font-family:inherit;}
</style>
</head>

// browser before it is sent, so the database only ever holds unreadable
// text. Without the exact department name and passcode the workspace can't
// be found or read, and a lost passcode can't be recovered.

const SUPABASE_KEY = 'sb_publishable_Dm3G5t5tmiydMThQx60TDg_J1L_zzbG';
const SB_TABLE = 'workbook_records';
const WB_PREFIX = 'wb1::';
const SAMPLE_PROGRAM_ID = '__no_sample__';
const SAMPLE_RECORDS = {};

const _enc = new TextEncoder(), _dec = new TextDecoder();
function normDept(s){ return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
function toB64(buf){ const a = new Uint8Array(buf); let s = ''; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(s){ const b = atob(s); const a = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function deriveWorkspace(dept, pass){
  // Passcodes ignore capitalization and extra spaces ("snds" opens "SNDS").
  const base = await crypto.subtle.importKey('raw', _enc.encode(String(pass || '').trim().replace(/\s+/g, ' ').toUpperCase()), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt: _enc.encode('curriculum-workbook|' + normDept(dept)), iterations: 310000 }, base, 512));
  return { id: [...bits.slice(32, 48)].map(b => b.toString(16).padStart(2, '0')).join(''), raw: bits.slice(0, 32) };
}
async function useWorkspace(id, raw, name){
  WS.id = id; WS.name = name || '';
  WS.key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
}
function closeWorkspace(){ WS.id = null; WS.key = null; WS.name = ''; }
async function encryptWith(key, t){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, _enc.encode(t));
  return 'v1:' + toB64(iv) + ':' + toB64(c);
}
async function decryptWith(key, v){
  const parts = String(v).split(':');
  if(parts[0] !== 'v1' || parts.length !== 3) throw new Error('This record is not readable with this passcode.');
  const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(parts[1]) }, key, fromB64(parts[2]));
  return _dec.decode(p);
}
const _sbHeaders = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };
const DIRECTORY_KEY = WB_PREFIX + 'directory';
async function _sbGet(fullKey){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + SB_TABLE + '?key=eq.' + encodeURIComponent(fullKey) + '&select=value', { headers: _sbHeaders });
  if(!res.ok) throw new Error('storage.get failed: ' + res.status);
  const rows = await res.json();
  return (!rows.length || rows[0].value === null || rows[0].value === undefined) ? null : rows[0].value;
}
async function _sbSet(fullKey, value){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + SB_TABLE + '?on_conflict=key', {
    method: 'POST', headers: Object.assign({}, _sbHeaders, { Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify({ key: fullKey, value, updated_at: new Date().toISOString() }) });
  if(!res.ok) throw new Error('storage.set failed: ' + res.status);
}
async function _sbDelete(fullKey){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + SB_TABLE + '?key=eq.' + encodeURIComponent(fullKey), { method: 'DELETE', headers: _sbHeaders });
  if(!res.ok) throw new Error('storage.delete failed: ' + res.status);
}
async function _sbList(fullPrefix){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + SB_TABLE + '?select=key&key=like.' + encodeURIComponent(fullPrefix) + '*', { headers: _sbHeaders });
  if(!res.ok) throw new Error('storage.list failed: ' + res.status);
  return (await res.json()).map(r => r.key).filter(k => k.startsWith(fullPrefix));
}
// A workspace context ({id, key}) lets set-up tasks work on a workspace other
// than the one open on screen (creating workspaces, changing a passcode).
async function wsContext(dept, pass){
  const d = await deriveWorkspace(dept, pass);
  return { id: d.id, raw: d.raw, key: await crypto.subtle.importKey('raw', d.raw, 'AES-GCM', false, ['encrypt', 'decrypt']) };
}
function _ctxKey(ctx, k){ return WB_PREFIX + ctx.id + '::' + k; }
async function ctxGet(ctx, k){ const v = await _sbGet(_ctxKey(ctx, k)); return v === null ? null : await decryptWith(ctx.key, v); }
async function ctxSet(ctx, k, value){ await _sbSet(_ctxKey(ctx, k), await encryptWith(ctx.key, String(value))); }
async function ctxDelete(ctx, k){ await _sbDelete(_ctxKey(ctx, k)); }
async function ctxList(ctx, prefix){ const head = _ctxKey(ctx, ''); return (await _sbList(_ctxKey(ctx, prefix || ''))).map(k => k.slice(head.length)); }
// Department names only (never any work), so the sign-in screen can list them.
async function readDirectory(){ const v = await _sbGet(DIRECTORY_KEY); try{ const a = JSON.parse(v); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
async function writeDirectory(list){ await _sbSet(DIRECTORY_KEY, JSON.stringify(list)); }
function _need(){ if(!WS.id || !WS.key) throw new Error('No workspace is open.'); }
window.storage = {
  async get(key){ _need(); const v = await ctxGet(WS, key); return v === null ? null : { key, value: v }; },
  async set(key, value){ _need(); await ctxSet(WS, key, value); return { key, value }; },
  async delete(key){ _need(); await ctxDelete(WS, key); return { key, deleted: true }; },
  async list(prefix){ _need(); return { keys: await ctxList(WS, prefix), prefix }; }
};
async function allRecords(){
  const r = await window.storage.list('');
  const out = {};
  for(const k of r.keys){ const g = await window.storage.get(k); if(g) out[k] = g.value; }
  return out;
}
function storageBackendName(){ return 'the department workspace'; }

const FULL_INSTRUCTIONS = {
  story: `The goal is to describe the finished experience for a student and family, in plain language, before getting into mechanics. Use past tense throughout, as if the change has already launched.

Write a short announcement for admission (250 to 400 words) as if this program has already launched. Write it for the audience who will actually hear it: a prospective student, a parent, or an industry partner.

Include: a headline (one sentence, the hook); the problem this solves for students or the field; what is different about the student experience; a quote from a student or graduate describing the outcome; a quote from a faculty lead or department chair on why this matters; and how a student gets started.`,
  research: `You must conduct thoughtful research to ensure your program delivers the best possible degree for students. This research foundation will inform every decision you make and ensure your program maintains relevance, competitiveness, and student success.

Our commitment to excellence requires understanding three critical areas: industry demands, current student needs, and competitive positioning. If you have any of this information from your intake process, feel free to copy and paste it in.

Level Up Score Interpretation: find language from the previous prospectus.

Higher Education Research Interpretation / Competitive Position: paste links to at least three other higher-education programs similar to SCAD's offering, then in 2–3 sentences explain how these peer programs shaped your thinking, or how your enhancement distinguishes SCAD from them.

Market Trend Data Interpretation / Industry Trend Interpretation: what key industry and market trends are you observing that impact your academic program? Describe significant developments, disruptions, or shifts in your field/industry that have implications for your curriculum. Interpretation should include impacts of AI on the field (utilize the SCADask AI State of Design and Industry Outlook documents).

The ROI Test — address: target jobs (what positions will graduates be qualified for); is there enough demand for these jobs to support the major long-term; and return on investment (do starting salaries justify the cost of the degree)?

Industry Connection: list at least three industry contacts who would provide input on your revision and serve as future mentors of your program.`,
  pillars: `Identify 3–5 core pillars of knowledge/skill that define your program. These pillars should represent the essential competencies that students must develop to be workforce-ready upon program completion.

Note: if your department already has established program outcomes, you may refine them to better align with the pillar structure, or start fresh with new pillars if the current outcomes don't capture the essence of your program.

For each pillar, define: what the pillar means for your program; how it directly prepares students for industry expectations; and what kind of work artifact demonstrates mastery of it.`,
  stickfigure: `This is not for the first iteration of your program, maybe not even the fifth. Create many, think about market fit, feasibility, and innovation, then dig deeper and make another.

Complete the course table for each required course in your planned curriculum. This table showcases the courses all students will be required to take. If it is a directed elective option, display the number of selections students will take, to distinguish that they will not be taking every course in the list.

Now that you have mapped your courses to your program pillars, you understand what skills and knowledge students need to succeed in each class. The next step is to create a logical sequence that ensures students can progress smoothly through their degree while building the necessary foundation for success in each course. If you are incorporating courses owned by other majors, consult their sequence for when the course(s) are typically offered — see catalog.scad.edu.

Assign prerequisites strategically: for each course, ask what specific skills from your pillar mapping a student needs to succeed in it, which previous courses develop those exact skills, and what the minimum prerequisite requirement is that ensures success without creating barriers.

Once sequencing is complete: test the sequence with sample student scenarios; identify any scheduling conflicts or impossible pathways; refine prerequisites based on your analysis. The goal is a pathway that supports student success while ensuring students graduate workforce-ready with all program pillars fully developed.`,
  pillarmap: `The Pillar Mapping deliverable helps you think through skill and knowledge development for your entire program of study. By mapping where students are introduced to new knowledge and skills, where you reinforce that knowledge and skill, and where they showcase synthesis, you scaffold your curriculum, progress rigor throughout, and reveal a proper sequence for traversing the program.

For undergraduate curricula, add your foundation studies and general education courses along with your major curriculum.

For each course, indicate the level of pillar development: I = Introduced (students first encounter this pillar concept); R = Reinforced (students practice and build upon previous pillar knowledge); S = Synthesized (students integrate this pillar with others at an advanced level).

Quality Assurance Check: each pillar is introduced in at least one foundational course; each pillar is reinforced across multiple courses; each pillar reaches mastery level before program completion; all pillars are synthesized together in capstone experience(s); no courses are unmapped; progression is logical (Introduction → Reinforcement → Mastery → Synthesis).

Balance Check: pillars are evenly distributed across the program; no single pillar dominates excessively; synthesis opportunities exist throughout the program, not just at the end.

Industry Alignment Verification: all pillars directly connect to industry expectations; pillar definitions reflect current workforce needs; mastery levels align with entry-level professional competencies.`,
  coursecontent: `Use this template to document all course content for programs currently in development or revision. For each course, complete the Proposed/New columns in full; if the course is a revision of an existing course, also complete the Original columns with the current course information so changes can be clearly tracked.

Each entry should include the course description, proposed learning outcomes, sample session topics, and sample grading opportunities — all information necessary for Curriculum Council review and Banner entry.

Also indicate which pillar each course's outcomes map to (pillars must be defined in Deliverable III first).

If anything changes in one of these entries after the fact, it should inform the rest of the site and prompt a reconciliation — treat this as a decision log: every change gets saved along the way, and a check can be run to see what hasn't yet been reconciled, giving a running log of decisions made.`,
  assessment: `You've created the pillars and defined them. You've created your course outcomes that align to your pillars. You've mapped your pillars across the program. Now you need to draft the criteria to measure them and select the courses/artifacts used for measurement.`,
  transition: `This document will be shared with advising staff alongside the Curriculum Transition Plan. It provides the context and escalation guidance advisers need before supporting students through the change.

Section 1 — What This Is and Why It's Happening: in 2–3 sentences, explain the change or launch in plain language. What is driving this? What will be different for students?

Section 2 — The Three Things Every Adviser Must Know: the most critical facts about this change. Every adviser should be able to confirm these before speaking with a student. If a student question cannot be answered using these three points or the Transition Plan, use the escalation path.

Section 3 — Student Impact by Cohort: what this change means for students currently in the program, students entering under the new curriculum, students mid-sequence in affected courses, and transfer students.

Section 4 — Edge Cases to Watch For: student situations that are not straightforward and should not be advised without checking with Curriculum & Assessment or the department first (e.g. a retired course whose downstream prerequisite hasn't been fulfilled; a returning student under a prior catalog year; double-majors with overlapping old/new coursework).

Section 5 — Questions + Escalation Contacts: primary Curriculum & Assessment contact, Degree Planner contact, and Banner/enrollment contact.`,
  resources: `Use the following tables to analyze your additional faculty, training, hardware, software, space, and major equipment needs. All programs complete the top section on existing faculty. The remaining sections only need to be completed if resources are being requested.

1. Existing Faculty Analysis: list current faculty with the courses they will teach in the new curriculum (go by the new stick figure), their area/specialization, how many classes they're contracted to teach each year, and what capacity they have for additional classes. The aim is to ensure you have the faculty needed to transition seamlessly. Don't forget the number of sections you may need to satisfy demand.

2. Additional Faculty Needs: for each new position — full-time or part-time, course(s) they'd teach, required expertise/specialization, industry experience and educational requirements, and justification (why can't current faculty cover this, how many students would it serve, student-to-faculty ratio impact).

3. Faculty Training Needs: for each training type — expertise/skills needed, number of faculty needing it, and justification (what new content/skills, why essential, how it aligns with revised pillars). Training types include industry certification, software/technology training, conferences/workshops, graduate coursework, industry internships/fellowships, and vendor training.

4. Additional Hardware Needs: type, quantity, program integration (which courses, which outcomes, how many students per quarter), industry alignment (what standard it represents, what certifications it enables), space/special requirements, and timeline.

5. Additional Software Needs: title, license type, quantity/users, program integration, industry alignment, technical requirements, and timeline.

function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

const PROGRAM_INDEX_KEY = 'program-index';

// ---------- Program list: safe reads, self-repair, guarded writes ----------
// Why programs kept migrating out of their major/degree pairing (all fixed
// below and in the embedded Stick Figure tool):
//  1. The embedded Stick Figure tool (Deliverable IV) rewrote this program's
//     entry in the shared program-index on EVERY render (every course edit,
//     and simply opening the tab), replacing it with a summary that had no
//     familyId, familyName or trackLabel. The rail groups by familyId, so
//     every stripped program landed together under "(unnamed major)", showing
//     its full name instead of its degree. Their shared familyId (undefined)
//     also made them share one Scope of Work record and offer each other's
//     courses as "sibling" copies.
//  2. That same write was a stale read-modify-write of the whole index, so it
//     could also undo rail edits made in the meantime (renames, removals,
//     newly added degree levels) and bring removed programs back.
//  3. "Edit Program Info" inside the Stick Figure could change a program's
//     name or degree, which then overwrote the rail's name.
//  4. If a storage read failed, the rail treated it as an empty list; the
//     starter-list seed then wrote a fresh list with new ids over everything.
//  5. Programs added with the Add box or bulk add ("Animation BFA") became a
//     brand-new major instead of joining the existing one.
//  6. Earlier bugs left some majors split under two different familyIds.
// repairProgramList() heals 1, 5 and 6 on every load and before every write,
// so even an entry damaged by an old copy of this file still open somewhere
// is put back the next time anyone loads this version.
const DEGREE_TOKENS = ['BA','BFA','BDES','MA','MFA','MBI','MARCH'];
function str(v){ return (v===undefined || v===null) ? '' : String(v); }
function normKey(s){ return str(s).trim().replace(/\s+/g,' ').toLowerCase(); }
function splitProgramName(name){
  const clean = str(name).trim().replace(/\s+/g,' ');
  const m = clean.match(/^(.*\S)\s+([A-Za-z.]+)$/);
  if(m){
    const tok = m[2].replace(/\./g,'').toUpperCase();
    if(DEGREE_TOKENS.includes(tok)) return {familyName: m[1].trim(), trackLabel: tok};
  }
  return {familyName: clean, trackLabel: ''};
}
function isRealFamilyId(id){ return !!id && id !== 'undefined' && id !== 'null'; }

// Pure function: returns {list, changed, moves}. `moves` lists programs whose
// familyId changed from one real id to another (a split major being merged),
// so their Scope of Work record can follow them.
function repairProgramList(input){
  const original = JSON.stringify(input || []);
  const moves = [];
  // a. drop junk, de-duplicate ids (keep the copy that still has its pairing)
  const byId = new Map(); const order = [];
  (Array.isArray(input) ? input : []).forEach(raw=>{
    if(!raw || typeof raw !== 'object' || Array.isArray(raw) || !raw.id) return;
    raw = Object.assign({}, raw, {id: str(raw.id)});
    const p = Object.assign({}, raw);
    const prev = byId.get(p.id);
    if(!prev){ byId.set(p.id, p); order.push(p.id); return; }
    if(!isRealFamilyId(prev.familyId) && isRealFamilyId(p.familyId)) byId.set(p.id, Object.assign({}, prev, p));
  });
  const list = order.map(id=>byId.get(id));

  // b. recover familyName / trackLabel from the program name and degree
  list.forEach(p=>{
    p.programName = (str(p.programName).trim() || [str(p.familyName).trim(), str(p.trackLabel).trim()].filter(Boolean).join(' ') || 'Untitled program');
    let track = str(p.trackLabel).trim();
    let fam = str(p.familyName).trim();
    const dt = str(p.degreeType).trim().toUpperCase();
    const wasStripped = !track && !str(p.familyId).trim();
    const split = splitProgramName(p.programName);
    if(!track){
      if(split.trackLabel) track = split.trackLabel;
      else if(DEGREE_TOKENS.includes(dt)) track = dt;
      // a stand-alone program whose "major" was its whole name ("Acting BFA")
      if(track && (!fam || normKey(fam) === normKey(p.programName))) fam = split.trackLabel ? split.familyName : p.programName;
    }
    if(!fam){
      if(track && normKey(p.programName).endsWith(' ' + normKey(track))) fam = p.programName.slice(0, p.programName.length - track.length).trim();
      else fam = split.familyName || p.programName;
    }
    // One-time data fix, limited to entries the old Stick Figure damaged:
    // Fashion Marketing and Management was mislabeled MFA there, and it is a
    // BFA. A deliberately added FMM MFA keeps its label (it has a trackLabel).
    if(wasStripped && normKey(fam)===normKey('Fashion Marketing and Management') && track==='MFA') track = 'BFA';
    p.trackLabel = track;
    p.familyName = fam;
  });

  // c. one familyId per major name (merges split majors, re-pairs stripped ones)
  const groups = new Map();
  list.forEach(p=>{
    const k = normKey(p.familyName);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  });
  groups.forEach(members=>{
    const counts = new Map();
    members.forEach(p=>{ if(isRealFamilyId(p.familyId)) counts.set(p.familyId, (counts.get(p.familyId)||0) + 1); });
    let winner = null, best = 0;
    counts.forEach((n,id)=>{ if(n > best){ best = n; winner = id; } });
    if(!winner) winner = uid();
    const namer = members.find(p=>p.familyId === winner) || members[0];
    const displayName = namer.familyName;
    members.forEach(p=>{
      if(p.familyId !== winner){
        if(isRealFamilyId(p.familyId)) moves.push({from: p.familyId, to: winner, level: degreeLevelOf(p)});
        p.familyId = winner;
      }
      p.familyName = displayName;
      p.programName = `${displayName} ${p.trackLabel}`.trim();
    });
  });

  return {list, changed: JSON.stringify(list) !== original, moves};
}

// Distinguishes "no list saved yet" from "couldn't read it". Only the first
// is ever allowed to lead to a write.
// Stored values are JSON text; tolerate values that come back already parsed
// or double-encoded.
function parseStoredList(v){
  let x = v;
  for(let i=0; i<2 && typeof x === 'string'; i++) x = JSON.parse(x);
  if(!Array.isArray(x)) throw new Error('Saved program list is not a list (got ' + (x===null ? 'null' : typeof x) + ')');
  return x;
}
async function readIndexFrom(store){
  let res;
  try{ res = await store.get(PROGRAM_INDEX_KEY, true); }
  catch(e){
    // Claude's built-in artifact storage throws "Key not found" for a key
    // that has never been saved. That means empty, not broken.
    if(/not found/i.test((e && e.message) || String(e))) return {status:'missing', list:[]};
    // Some storage backends throw for a key that doesn't exist yet; confirm
    // with list() before treating it as missing rather than broken.
    let listed = null;
    try{ listed = await store.list(PROGRAM_INDEX_KEY, true); }catch(e2){}
    if(listed && Array.isArray(listed.keys) && !listed.keys.map(String).includes(PROGRAM_INDEX_KEY)) return {status:'missing', list:[]};
    return {status:'error', list:null, error: (e && e.message) || String(e)};
  }
  if(!res || res.value === undefined || res.value === null) return {status:'missing', list:[]};
  try{ return {status:'ok', list: parseStoredList(res.value)}; }
  catch(e){ return {status:'error', list:null, error: 'Could not read the saved list: ' + ((e && e.message) || e)}; }
}
const sleep = ms => new Promise(r=>setTimeout(r, ms));

// Distinguishes "no list saved yet" from "couldn't read it". Only the first
// is ever allowed to lead to a write. Retries a few times (a busy or rate-
// limited backend often succeeds a moment later), then, if the host's own
// storage keeps failing, tries Supabase directly and switches to it.
async function readProgramIndex(){
  let r;
  for(let attempt=0; attempt<3; attempt++){
    r = await readIndexFrom(window.storage);
    if(r.status !== 'error') return r;
    console.error('[Curriculum Studio] program list read failed (' + storageBackendName() + '), attempt ' + (attempt+1) + ':', r.error);
    await sleep(500 * (attempt+1));
  }
  const firstError = storageBackendName() + ': ' + r.error;
  if(window.storage !== window.__supabaseStorage && window.__supabaseStorage){
    const alt = await readIndexFrom(window.__supabaseStorage);
    if(alt.status === 'ok'){
      console.warn('[Curriculum Studio] switched to Supabase storage after: ' + firstError);
      window.storage = window.__supabaseStorage;
      state.storageNote = 'Loaded from Supabase because the built-in storage failed.';
      return alt;
    }
    return {status:'error', list:null, error: firstError + ' | Supabase: ' + (alt.error || alt.status)};
  }
  return {status:'error', list:null, error: firstError};
}

// Carries a merged major's Scope of Work record to its surviving familyId
// (only when the destination doesn't already have one).
async function migrateSowRecords(moves){
  const seen = new Set();
  for(const m of moves){
    const key = m.from + '>' + m.to + '>' + m.level;
    if(seen.has(key)) continue; seen.add(key);
    try{
      const src = await loadDeliverable('family:' + m.from + ':' + m.level, 'sow');
      if(!src) continue;
      const dest = await loadDeliverable('family:' + m.to + ':' + m.level, 'sow');
      if(dest) continue;
      await window.storage.set(`prog:family:${m.to}:${m.level}:sow`, JSON.stringify(src), true);
    }catch(e){}
  }
}

// ---------- Recovery: rebuild missing programs from what's still in storage ----------
// Removing a program (or any accident that shortens program-index) never
// deletes its deliverables: they stay under prog:<id>:..., and the Stick
// Figure keeps its own program:<id> record with the program's name and
// degree. This scans for those and puts back any program the list is
// missing, keeping its original id so all of its saved work reconnects.
const PROGRAM_INDEX_BACKUP_KEY = 'program-index-backup';
const PROGRAM_REMOVED_KEY = 'program-index-removed';


async function safeList(prefix){
  try{ const r = await window.storage.list(prefix, true); return (r && Array.isArray(r.keys)) ? r.keys.map(str).filter(k=>k.startsWith(prefix)) : null; }
  catch(e){ return null; }
}
async function safeGetJSON(key){
  try{ const r = await window.storage.get(key, true); return (r && r.value) ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}

// Returns {candidates:[entries], dataIds:Set, removed:Set} or null if storage can't be listed.
async function gatherRecoveryInfo(){
  const progKeys = await safeList('prog:');
  const recKeys = await safeList('program:');
  if(progKeys === null && recKeys === null) return null;
  const dataIds = new Set();
  (progKeys||[]).forEach(k=>{
    const id = k.split(':')[1] || '';
    if(id && id !== 'family' && id !== 'solo') dataIds.add(id);
  });
  const candidates = [];
  const named = new Set();
  const backup = await safeGetJSON(PROGRAM_INDEX_BACKUP_KEY);
  (Array.isArray(backup) ? backup : []).forEach(p=>{ if(p && p.id){ candidates.push(Object.assign({}, p)); named.add(str(p.id)); } });
  for(const k of (recKeys||[])){
    const id = k.slice('program:'.length);
    if(!id) continue;
    dataIds.add(id);
    if(named.has(id)) continue;
    const rec = await safeGetJSON(k);
    if(!rec || !str(rec.programName).trim()) continue;
    candidates.push({id, programName: str(rec.programName).trim(), degreeType: str(rec.degreeType), degreeLevel: str(rec.degreeLevel), updatedAt: Date.now()});
    named.add(id);
  }
  // Programs with saved deliverables but no name anywhere: keep them visible
  // rather than lose them. Each gets its own placeholder major to rename.
  let n = 0;
  dataIds.forEach(id=>{
    if(named.has(id)) return;
    n++;
    candidates.push({id, programName: `Recovered program ${n}`, familyName: `Recovered program ${n}`, trackLabel:'', recovered:true, updatedAt: Date.now()});
  });
  const removedList = await safeGetJSON(PROGRAM_REMOVED_KEY);
  const removed = new Set((Array.isArray(removedList) ? removedList : []).map(str));
  return {candidates, dataIds, removed};
}

// Pure: merges recovery candidates into `list`.
function applyRecovery(list, info){
  if(!info) return list;
  const hasData = id => info.dataIds.has(id);
  const present = new Set(list.map(p=>p.id));
  // Repair candidates on their own first so they carry familyName/trackLabel.
  const cands = repairProgramList(info.candidates).list;
  cands.forEach(c=>{
    if(present.has(c.id) || info.removed.has(c.id)) return;
    // If a same-name, same-degree entry exists with NO saved work (e.g. one
    // re-created by the starter list), the recovered original replaces it.
    const blankTwin = list.findIndex(p=>!hasData(p.id) && normKey(p.familyName)===normKey(c.familyName) && normKey(p.trackLabel)===normKey(c.trackLabel));
    const entry = {id:c.id, programName:c.programName, familyName:c.familyName, trackLabel:c.trackLabel, degreeType:'', degreeLevel:'', updatedAt: Date.now()};
    if(blankTwin >= 0){ entry.familyId = list[blankTwin].familyId; list.splice(blankTwin, 1, entry); }
    else list.push(entry);
    present.add(c.id);
  });
  return list;
}

  const f = BUILT_IN_PROGRAMS.find(f=>normKey(f.familyName)===normKey(p.familyName));
  return !!(f && f.tracks.some(t=>normKey(t)===normKey(p.trackLabel)));
}
// Majors replaced by others (Animation became 2D Animation and 3D Animation).
// Hidden from the menu; any saved work under them stays in storage.
const RETIRED_MAJORS = ['Animation'];
// Removes from the saved program list: entries for built-in programs (the
// file supplies those), retired majors, "Recovered program" placeholders, and
// extra degrees under a built-in major that weren't added in the Studio
// (they came in through the old recovery step, not from a person). Saved
// work under any removed entry is not deleted.
function cleanupStoredList(list){
  return (list || []).filter(p=>{
    if(!p || !p.id) return false;
    if(String(p.id).startsWith('bi-')) return false;
    if(RETIRED_MAJORS.some(r=>normKey(r)===normKey(p.familyName))) return false;
    if(/^recovered program \d+$/.test(normKey(p.familyName))) return false;
    if(isBuiltInFamilyName(p.familyName) && !isBuiltInTrack(p) && !p.addedInStudio) return false;
    return true;
  });
}

// Stored list + any built-in program it doesn't already have, in a stable
// order (built-in majors first, in the order above). Display only: the
// built-ins are never written into the stored list.
function withBuiltIns(stored){
  const out = cleanupStoredList(Array.isArray(stored) ? stored : []).map(p=>Object.assign({}, p));
  builtInEntries().forEach(b=>{
    if(out.some(p=>normKey(p.familyName)===normKey(b.familyName) && normKey(p.trackLabel)===normKey(b.trackLabel))) return;
    const fam = out.find(p=>normKey(p.familyName)===normKey(b.familyName));
    out.push(Object.assign({}, b, fam ? {familyId: fam.familyId, familyName: fam.familyName, programName: `${fam.familyName} ${b.trackLabel}`} : {}));
  });
  out.forEach(p=>{ p.builtIn = isBuiltInTrack(p); });
  const famRank = p=>{ const i = BUILT_IN_PROGRAMS.findIndex(f=>normKey(f.familyName)===normKey(p.familyName)); return i<0 ? 1000 : i; };
  const trackRank = p=>{ const f = BUILT_IN_PROGRAMS.find(f=>normKey(f.familyName)===normKey(p.familyName)); const i = f ? f.tracks.findIndex(t=>normKey(t)===normKey(p.trackLabel)) : -1; return i<0 ? 1000 : i; };
  return out.map((p,i)=>({p,i})).sort((a,b)=> (famRank(a.p)-famRank(b.p)) || (famRank(a.p)===1000 ? 0 : (trackRank(a.p)-trackRank(b.p))) || (a.i-b.i)).map(x=>x.p);
}

// Every mutation to the program list (add, rename, remove, seed, repair)
// goes through here. It re-reads the shared list right before writing,
// repairs it, applies the change to THAT copy, repairs again (so new entries
// join their major), and writes once. If the re-read fails, nothing is
// written: saving a stale or empty local copy is what used to wipe or
// revert other people's changes.
async function mutateProgramList(mutator){
  const r = await readProgramIndex();
  if(r.status === 'error'){
    state.status = "Couldn't reach shared storage. That change wasn't saved, please try again.";
    render();
    return false;
  }
  const before = repairProgramList(r.list);
  let updated = before.list;
  if(mutator) updated = mutator(updated) || updated;
  const after = repairProgramList(updated);
  const prevJSON = JSON.stringify(r.list);
  const nextJSON = JSON.stringify(after.list);
  if(nextJSON === prevJSON){
    state.indexStatus = 'ok'; state.programs = withBuiltIns(after.list); render(); return true;
  }
  try{
    // Keep the previous version so any bad change can be undone.
    if(Array.isArray(r.list) && r.list.length) await window.storage.set(PROGRAM_INDEX_BACKUP_KEY, prevJSON, true);
    await window.storage.set(PROGRAM_INDEX_KEY, nextJSON, true);
  }catch(e){
    state.status = "Couldn't save to shared storage. That change wasn't saved, please try again.";
    render();
    return false;
  }
  state.indexStatus = 'ok';
  state.programs = withBuiltIns(after.list);
  const moves = before.moves.concat(after.moves);
  if(moves.length) await migrateSowRecords(moves);
  render();
  return true;
}

// Fetch the canonical course list from the Sequenced Stick Figure tool's
// own storage record, so every downstream deliverable stays in sync with it.
async function getCourses(progId){
  const prog = state.programs.find(p=>p.id===progId);
  await ensurePreloadedCourses(prog);
  // If the saved list isn't there (e.g. storage refused the save), use the
  // catalog requirements so every deliverable still sees the courses.
  const r = await readCourseRecordStrict(progId);
  if(r.status==='missing' && prog && hasPreloadedCourses(prog)){
    return buildPreloadedCourses(prog).map(c=>({
      id: c.id, subject: c.subject||'', number: c.number||'', title: c.title||'',
      prereqs: c.prereqs||'', status: c.status||'', group: c.group||'', ownership: c.ownership||'',
      summary: c.summary||'', original: c.original||null, originalNumber: '', numberChangeReason: '', requirementArea: c.requirementArea||''
    }));
  }
  try{
    const res = await window.storage.get('program:'+progId, true);
    if(!res) return [];
    const data = JSON.parse(res.value);
    return (data.courses||[]).map(c=>({
      id: c.id, subject: c.subject||'', number: c.number||'', title: c.title||'',
      prereqs: Array.isArray(c.prereqs)? c.prereqs.join(', ') : (c.prereqs||''),
      status: c.status||'', group: c.group||'', ownership: c.ownership||'',
      summary: c.summary||'', original: c.original||null, originalNumber: c.originalNumber||'',
      numberChangeReason: c.numberChangeReason||'', requirementArea: c.requirementArea||''
    }));
  }catch(e){ return []; }
}
// Keyed by the course's stable internal id (assigned once by the sequencing
// tool and never changed), NOT by subject/number/title — so editing a
// course's name or number later doesn't disconnect its Pillar Mapping,
// Course Content, or Syllabus Planning data. Falls back to the old
// composite key only for courses saved before this id existed.
function courseKeyOf(c){ return (c.id!==undefined && c.id!==null) ? 'c'+c.id : `${c.subject}_${c.number}_${c.title}`; }
function courseLabelOf(c){ return `${c.subject} ${c.number}${c.title? ' — '+c.title:''}`.trim(); }

// Lets any deliverable (not just the Stick Figure) edit a course's subject/
// number/title and have it stick everywhere, since it writes straight back
// to the same canonical record the sequencing tool reads and saves.
async function updateCourseCore(progId, courseId, patch){
  try{
    const res = await window.storage.get('program:'+progId, true);
    if(!res) return false;
    const data = JSON.parse(res.value);
    const c = (data.courses||[]).find(c=>c.id===courseId);
    if(!c) return false;
    Object.assign(c, patch);
    await window.storage.set('program:'+progId, JSON.stringify(data), true);
    return true;
  }catch(e){ return false; }
}

// Work that couldn't be saved (e.g. Claude's preview refusing saves) is kept
// for this session so the page still behaves correctly until it's closed.
const sessionOnly = {};
async function loadDeliverable(progId, key){
  const k = progId + '|' + key;
  if(sessionOnly[k] !== undefined) return sessionOnly[k];
  try{
    const res = await window.storage.get(`prog:${progId}:${key}`, true);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}

// Saving never rebuilds the page (that replaced the box being typed in after
// every letter). Only the status note and the rail's save warning update.
// Rapid saves of the same deliverable are combined: one save at a time, then
// one more with the latest content if anything changed meanwhile.
const saveQueue = {};
function updateSaveIndicators(){
  const pill = document.getElementById('saveStatusPill');
  if(pill){ pill.textContent = state.status || ''; pill.style.display = state.status ? '' : 'none'; }
  const warn = document.getElementById('railSaveWarning');
  if(warn) warn.style.display = state.saveFailed ? '' : 'none';
}
async function writeDeliverable(progId, key, payload){
  const k = progId + '|' + key;
  try{
    await window.storage.set(`prog:${progId}:${key}`, JSON.stringify(payload), true);
    delete sessionOnly[k];
    state.status = 'Saved ' + new Date().toLocaleTimeString();
    state.saveFailed = false;
  }catch(e){
    sessionOnly[k] = JSON.parse(JSON.stringify(payload));
    state.status = 'Not saved: storage refused the save. Changes last only until this page is closed.';
    state.saveFailed = true;
  }
  updateSaveIndicators();
  return !state.saveFailed;
}
function saveDeliverable(progId, key, payload){
  const k = progId + '|' + key;
  const q = saveQueue[k] || (saveQueue[k] = {running:null, pending:null});
  if(q.running){
    q.pending = payload;
    return q.running.then(()=>q.next);
  }
  const run = async ()=>{
    let ok = await writeDeliverable(progId, key, payload);
    while(q.pending){ const p = q.pending; q.pending = null; ok = await writeDeliverable(progId, key, p); }
    q.running = null;
    return ok;
  };
  q.running = run();
  q.next = q.running;
  return q.running;
}

function ensureCache(progId){
  if(!state.data[progId]) state.data[progId] = {};
}

async function getData(progId, key, fallback){
  ensureCache(progId);
  if(state.data[progId][key] !== undefined) return state.data[progId][key];
  const loaded = await loadDeliverable(progId, key);
  state.data[progId][key] = loaded || fallback;
  return state.data[progId][key];
}

// "Animation BFA" typed in the Add box becomes the BFA degree level under the
// existing Animation major (matched by name), not a new major of its own.
function newProgramEntry(name){
  const split = splitProgramName(name);
  const existing = state.programs.find(p=>normKey(p.familyName)===normKey(split.familyName));
  const id = uid();
  const familyName = existing ? existing.familyName : split.familyName;
  return {id, programName: `${familyName} ${split.trackLabel}`.trim(),
    familyId: existing ? existing.familyId : uid(), familyName, trackLabel: split.trackLabel,
    degreeType:'', degreeLevel:'', updatedAt: Date.now(), addedInStudio: true};
}
function findDuplicateTrack(p){
  if(!p.trackLabel) return null;
  return state.programs.find(x=>normKey(x.familyName)===normKey(p.familyName) && normKey(x.trackLabel)===normKey(p.trackLabel)) || null;
}

async function addProgram(name){
  if(!name.trim()) return;
  const p = newProgramEntry(name);
  const dup = findDuplicateTrack(p);
  if(dup){ state.activeProgram = dup.id; state.activeTab = null; render(); return; }
  state.activeProgram = p.id;
  state.activeTab = null;
  await mutateProgramList(list=>{ list.push(p); return list; });
}

async function bulkAddPrograms(text){
  const names = text.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length) return;
  const newPrograms = names.map(newProgramEntry).filter(p=>!findDuplicateTrack(p));
  if(!newPrograms.length){ state.showBulkAdd = false; render(); return; }
  state.activeProgram = newPrograms[0].id;
  state.activeTab = null;
  state.showBulkAdd = false;
  await mutateProgramList(list=>{ list.push(...newPrograms); return list; });
}

// Add another degree level to an existing major (e.g. MFA under Animation).
// It starts blank; content can be copied afterward from a same-level degree.
async function addTrack(familyId, trackLabel, copyFromId){
  trackLabel = (trackLabel||'').trim();
  if(DEGREE_TOKENS.includes(trackLabel.replace(/\./g,'').toUpperCase())) trackLabel = trackLabel.replace(/\./g,'').toUpperCase();
  const clash = state.programs.find(p=>p.familyId===familyId && normKey(p.trackLabel)===normKey(trackLabel));
  if(clash){ state.activeProgram = clash.id; state.activeTab = null; render(); return; }
  const sibling = state.programs.find(p=>p.id===copyFromId);
  const familyName = sibling ? sibling.familyName : (state.programs.find(p=>p.familyId===familyId)||{}).familyName || 'Program';
  const id = uid();
  const p = {id, programName: `${familyName} ${trackLabel}`.trim(), familyId, familyName, trackLabel, degreeType:'', degreeLevel:'', updatedAt: Date.now(), addedInStudio: true};

  // New degrees start blank. Content is copied afterward with "Copy content
  // from another degree" on the overview page (same level only).
  state.activeProgram = id;
  state.activeTab = null;
  await mutateProgramList(list=>{ list.push(p); return list; });
}

// Other degree-level tracks under the same major (e.g. the MA when you're
// looking at the MFA), for offering a retroactive copy — this is separate
// from the one-time copy offered when a track is first created, since
// programs that already existed before that flow ran (like the seeded
// starter list) never had a chance to copy from each other.
function getSiblingTracks(prog){
  if(!isRealFamilyId(prog.familyId)) return [];
  return state.programs.filter(p=>p.familyId===prog.familyId && p.id!==prog.id);
}
// Copying runs one way, from the degree departments build first (it has
// more required courses) down to its shorter sibling in the same major:
// MFA content copies into the MA, BFA content into the BA.
const COPY_FROM = {MA:['MFA'], BA:['BFA']};
function copySourcesFor(prog){
  const from = COPY_FROM[str(prog.trackLabel).trim().toUpperCase()] || [];
  return getSiblingTracks(prog).filter(p=>from.includes(str(p.trackLabel).trim().toUpperCase()));
}

// ---------- SOW grouping: one agreement per degree level, not per track ----------
// A family can have several tracks at the same level (e.g. Service Design's
// MA and MBI are both graduate) — those share one Scope of Work Agreement.
// Undergrad and grad each get their own, per department. This only affects
// which SOW record a program points to; deliverables I-X still stay
// separate per individual program/track as before.
const UNDERGRAD_TRACK_LABELS = ['BA','BFA','BDES','MINOR'];
const GRAD_TRACK_LABELS = ['MA','MFA','MBI','MARCH'];
function degreeLevelOf(prog){
  const t = (prog.trackLabel || '').trim().toUpperCase();
  if(GRAD_TRACK_LABELS.includes(t)) return 'grad';
  if(UNDERGRAD_TRACK_LABELS.includes(t)) return 'undergrad';
  // Anything typed differently than the standard abbreviations: SCAD's
  // graduate tracks are consistently M-prefixed (MA/MFA/MBI/MARCH/etc.),
  // so lead with that; otherwise default to undergraduate.
  return t.startsWith('M') ? 'grad' : 'undergrad';
}
function sowGroupTracks(prog){
  // Every program in this family at the same degree level, including prog
  // itself — the set of tracks this one Scope of Work Agreement covers.
  if(!isRealFamilyId(prog.familyId)) return [prog];
  return state.programs.filter(p=>p.familyId===prog.familyId && degreeLevelOf(p)===degreeLevelOf(prog));
}
function sowStorageId(prog){
  // Passed as the "progId" argument to loadDeliverable/saveDeliverable so
  // it reuses their existing prog:{id}:{key} storage pattern, just scoped
  // to family+level instead of one program. uid()-generated program ids
  // never start with "family:", so this can't collide with a real one.
  // No familyId: scope to the program itself rather than a shared
  // "family:undefined:..." record that unrelated programs would all see.
  if(!isRealFamilyId(prog.familyId)) return 'solo:' + prog.id + ':' + degreeLevelOf(prog);
  return 'family:' + prog.familyId + ':' + degreeLevelOf(prog);
}

// 3D Animation are being split out of Animation and share many courses, so
// each begins with the current Animation MA or MFA requirements.
const PROGRAM_DATA_SOURCE = {
  '2d animation|ma': 'animation|ma', '2d animation|mfa': 'animation|mfa',
  '3d animation|ma': 'animation|ma', '3d animation|mfa': 'animation|mfa',
  'business management|minor': 'business management and entrepreneurship|minor',
  'entrepreneurship|minor': 'business management and entrepreneurship|minor',
  'production design (costume design)|bfa': 'production design, costume design|bfa',
  'production design (lighting design)|bfa': 'production design, lighting design|bfa',
  'production design (set design and art direction)|bfa': 'production design, set design and art direction|bfa',
  'advertising|ba': 'advertising and branding|ba', 'advertising|bfa': 'advertising and branding|bfa',
  'graphic design|ma': 'graphic design and visual experience|ma', 'graphic design|mfa': 'graphic design and visual experience|mfa',
  'luxury and fashion management|ma': 'luxury and brand management|ma', 'luxury and fashion management|mfa': 'luxury and brand management|mfa'
};
function programDataKey(prog){
  const k = normKey(prog.familyName) + '|' + normKey(prog.trackLabel);
  return PROGRAM_DATA_SOURCE[k] || k;
}
function hasPreloadedCourses(prog){ return !!PROGRAM_COURSE_DATA.programs[programDataKey(prog)]; }
// A placeholder (an elective slot) belongs to the department only when it
// names the department's own subject code ("700-level ANIM elective" for
// Animation); otherwise it is owned elsewhere, by the subjects it names
// ("700-level ARTH elective" -> ARTH) or, for generic slots like Free
// elective, by no single program.
function placeholderOwnership(title, ownSubject){
  const codes = (str(title).match(/\b[A-Z]{2,5}\b/g) || []).filter(c=>!['OR','AND'].includes(c));
  if(ownSubject && codes.includes(ownSubject)) return {ownership:'owned', owningProgram:''};
  return {ownership:'owned_elsewhere', owningProgram: codes.join(', ')};
}
function buildPreloadedCourses(prog){
  const entry = PROGRAM_COURSE_DATA.programs[programDataKey(prog)];
  if(!entry) return null;
  const own = entry.own, rows = entry.rows;
  return rows.map((r,i)=>Object.assign({
    id: i+1, year:'', quarter:'',
    subject:r[0], number:r[1], title:r[2], prereqs:r[3], summary:r[4],
    status: r[5] ? 'placeholder_elective' : 'existing_not_revising',
    ownership: r[6] ? 'owned_elsewhere' : 'owned', owningProgram: r[6] || '',
    owningYear:'', owningQuarter:'', owningNotes:'', isShared:false, sharedNotes:'',
    prereqRationale:'', needsRevision:false, revisionProgram:'', revisionNotes:'',
    group: r[8] || '', groupSelectCount: r[9] || 1,
    requirementArea: PROGRAM_COURSE_DATA.areas[r[7]] || '', hours: r[10] || 5,
    catalogPreloaded: CATALOG_EDITION,
    // The catalog values, so a course counts as revised only when its title,
    // number, prerequisites or summary differ from these.
    original: {title:r[2], number:r[1], prereqs:r[3], summary:r[4]}
  }, r[5] ? placeholderOwnership(r[2], own) : {}));
}
// Programs loaded before this rule existed had every placeholder marked as
// owned by the department. Correct those once, leaving any placeholder a
// department has already edited alone.
// Earlier versions stored a "select two/three/four" option's hours as the
// whole row's hours (10/15/20). Correct pre-loaded courses to the catalog's
// per-course hours, matched by their position in the catalog list.
function fixPreloadedHours(rec, prog){
  if(!rec || rec.hoursRule) return false;
  const seed = buildPreloadedCourses(prog);
  if(!seed) return false;
  const byId = {}; seed.forEach(c=>{ byId[c.id] = c; });
  (rec.courses||[]).forEach(c=>{
    const sc = byId[c.id];
    if(c.catalogPreloaded && sc && normKey((c.original||{}).title || sc.title)===normKey(sc.title)) c.hours = sc.hours;
  });
  rec.hoursRule = 1;
  return true;
}
function fixPreloadedPlaceholderOwnership(rec, prog){
  const entry = PROGRAM_COURSE_DATA.programs[programDataKey(prog)];
  if(!entry || !rec || rec.placeholderOwnershipRule) return false;
  (rec.courses||[]).forEach(c=>{
    if(c.status==='placeholder_elective' && c.catalogPreloaded && c.ownership==='owned' && !c.owningNotes){
      Object.assign(c, placeholderOwnership(c.title, entry.own));
    }
  });
  rec.placeholderOwnershipRule = 1;
  return true;
}
// Reads a program's Stick Figure record, telling "not saved yet" apart from
// "couldn't read it" so a failed read never leads to overwriting real work.
async function readCourseRecordStrict(progId){
  try{
    const r = await window.storage.get('program:'+progId, true);
    if(!r || r.value===undefined || r.value===null) return {status:'missing', rec:null};
    return {status:'ok', rec: JSON.parse(r.value)};
  }catch(e){
    if(/not found/i.test((e && e.message) || String(e))) return {status:'missing', rec:null};
    return {status:'error', rec:null};
  }
}
// Loads the catalog requirements into a program the first time its course
// list is needed. Never touches a program that already has courses, or one
// that was already loaded once (so a department that deliberately cleared
// its list isn't refilled).
async function ensurePreloadedCourses(prog){
  if(!prog || !hasPreloadedCourses(prog)) return;
  const r = await readCourseRecordStrict(prog.id);
  if(r.status==='error') return;
  const rec = r.rec || {};
  if((rec.courses||[]).length || rec.catalogPreloaded){
    // Records saved by older versions may have lost the record-level marker;
    // the per-course marker still identifies catalog courses.
    const fromCatalog = rec.catalogPreloaded || (rec.courses||[]).some(c=>c.catalogPreloaded);
    if(fromCatalog){
      const a = fixPreloadedPlaceholderOwnership(rec, prog);
      const b = fixPreloadedHours(rec, prog);
      if(a || b){ if(!rec.catalogPreloaded) rec.catalogPreloaded = CATALOG_EDITION; try{ await window.storage.set('program:'+prog.id, JSON.stringify(rec), true); }catch(e){} }
    }
    return;
  }
  const seeded = buildPreloadedCourses(prog);
  const lvl = degreeLevelOf(prog);
  const data = Object.assign({}, rec, {
    id: prog.id, programName: prog.programName,
    degreeLevel: lvl, degreeType: str(prog.trackLabel).toUpperCase(),
    programYears: str(prog.trackLabel).trim().toUpperCase()==='MA' ? 1 : (lvl==='undergrad' ? 4 : 2),
    courses: seeded, nextId: seeded.length + 1,
    electiveShells: rec.electiveShells || [],
    catalogPreloaded: CATALOG_EDITION,
    placeholderOwnershipRule: 1, hoursRule: 1
  });
  try{ await window.storage.set('program:'+prog.id, JSON.stringify(data), true); }catch(e){}
}

const COPYABLE = [
  {key:'story', label:'I. The Story'},
  {key:'research', label:'II. Research'},
  {key:'pillars', label:'III. Pillars'},
  {key:'pillarmap', label:'V. Pillar Mapping', courseLinked:true},
  {key:'coursecontent', label:'VI. Course Content', courseLinked:true},
  {key:'assessment', label:'VII. Assessment Planning'},
  {key:'transition', label:'VIII. Transition Planning'},
  {key:'resources', label:'IX. Resource Needs'},
  {key:'syllabus', label:'X. Syllabus Planning', courseLinked:true},
];
async function readCourseRecord(progId){
  const r = await readCourseRecordStrict(progId);
  return r.rec;
}
async function sourceHasContent(srcId, key){
  return !!(await loadDeliverable(srcId, key));
}
function courseMatchKey(c){
  return (c.subject || c.number) ? (str(c.subject).trim().toUpperCase() + ' ' + str(c.number).trim().toUpperCase()) : ('~' + normKey(c.title));
}
// Course-linked deliverables store entries per course. The same course has
// a different internal id in each degree, so entries are matched by subject
// and number and merged in; entries for courses the destination doesn't
// have are skipped, and the destination's other entries are left alone.
function remapCourseLinked(payload, srcCourses, destCourses, destExisting){
  const srcKeyToMatch = {};
  srcCourses.forEach(c=>{ srcKeyToMatch['c'+c.id] = courseMatchKey(c); });
  const matchToDestKey = {};
  destCourses.forEach(c=>{ matchToDestKey[courseMatchKey(c)] = 'c'+c.id; });
  const translate = k=>{ const m = srcKeyToMatch[k]; return m ? matchToDestKey[m] : null; };
  const out = JSON.parse(JSON.stringify(destExisting || {}));
  Object.keys(payload).forEach(field=>{
    const v = payload[field];
    if(v && typeof v==='object' && !Array.isArray(v) && (field==='levels' || field==='entries')){
      out[field] = out[field] || {};
      Object.keys(v).forEach(k=>{ const dk = translate(k); if(dk) out[field][dk] = JSON.parse(JSON.stringify(v[k])); });
    } else if(field==='selected'){
      const dk = translate(v); if(dk && !out.selected) out.selected = dk;
    } else if(out[field]===undefined){
      out[field] = JSON.parse(JSON.stringify(v));
    }
  });
  return out;
}
async function copyDeliverables(dest, src, keys){
  const copied = [];
  const srcRec = await readCourseRecord(src.id);
  const destRec = await readCourseRecord(dest.id);
  for(const key of keys){
    const payload = await loadDeliverable(src.id, key);
    if(!payload) continue;
    const def = COPYABLE.find(c=>c.key===key) || {};
    let next = JSON.parse(JSON.stringify(payload));
    if(def.courseLinked){
      next = remapCourseLinked(payload, (srcRec && srcRec.courses) || [], (destRec && destRec.courses) || [], await loadDeliverable(dest.id, key));
    }
    await window.storage.set(`prog:${dest.id}:${key}`, JSON.stringify(next), true);
    copied.push(key);
  }
  delete state.data[dest.id]; // drop cached copies so the new content shows
  return copied;
}
// Stick Figure courses are never copied wholesale (each degree has its own
// pre-loaded requirements). Only courses a department PROPOSED in the source
// (New Course or Course Restoration) that the destination doesn't already
// have can be added, one by one. Nothing already in the destination changes.
function proposedCoursesToOffer(srcRec, destRec){
  const have = new Set(((destRec && destRec.courses) || []).map(courseMatchKey));
  return ((srcRec && srcRec.courses) || []).filter(c=>(c.status==='new' || c.status==='restoration') && !have.has(courseMatchKey(c)));
}
async function addProposedCourses(dest, src, srcIds){
  const r = await readCourseRecordStrict(dest.id);
  if(r.status==='error') throw new Error('storage');
  await ensurePreloadedCourses(dest);
  const destRec = (await readCourseRecord(dest.id)) || {id: dest.id, programName: dest.programName, courses: [], electiveShells: [], nextId: 1};
  const srcRec = await readCourseRecord(src.id);
  const offer = proposedCoursesToOffer(srcRec, destRec).filter(c=>srcIds.includes(c.id));
  let nextId = Math.max(destRec.nextId || 1, ...((destRec.courses||[]).map(c=>(+c.id||0)+1)), 1);
  const added = offer.map(c=>Object.assign(JSON.parse(JSON.stringify(c)), {id: nextId++, year:'', quarter:'', group:'', groupSelectCount:1}));
  destRec.courses = (destRec.courses || []).concat(added);
  destRec.nextId = nextId;
  await window.storage.set('program:'+dest.id, JSON.stringify(destRec), true);
  delete state.data[dest.id];
  return added.length;
}

// ---------- Word export (HTML->.doc trick, opens natively in Word) ----------
function downloadWordDoc(title, bodyHtml){
  {
    const p = state.profile || {};
    const bits = [];
    if(p.preparedBy) bits.push('Prepared by ' + esc(p.preparedBy));
    bits.push('Downloaded ' + new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}));
    const line = `<p class="meta">${bits.join('. ')}.</p>`;
    bodyHtml = bodyHtml.includes('</h1>') ? bodyHtml.replace('</h1>', '</h1>' + line) : line + bodyHtml;
  }
  const html = `<!DOCTYPE html><html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset='utf-8'><title>${title}</title>
  <style>
    body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000;}
    h1{font-size:18pt;color:#1c2b4a;border-bottom:2px solid #c9a227;padding-bottom:4px;}
    h2{font-size:13pt;color:#1c2b4a;margin-top:18px;}
    table{border-collapse:collapse;width:100%;margin-top:8px;}
    td,th{border:1px solid #999;padding:5px;font-size:10pt;vertical-align:top;}
    th{background:#1c2b4a;color:#fff;}
    .meta{color:#666;font-size:9pt;margin-bottom:14px;}
  </style></head>
  <body>${bodyHtml}</body></html>`;
  const blob = new Blob(['\ufeff', html], {type: 'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title.replace(/[^a-z0-9\-_ ]/gi,'').replace(/\s+/g,'_') + '.doc';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br/>'); }
function escAttr(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- In-page dialogs ----------
// Native prompt(), confirm() and alert() can be silently blocked inside Claude's
// preview, which made buttons like "+ add another degree level" do nothing.
// These render inside the page instead and always work.
function uiDialog({title, message, fields, okLabel, cancelLabel, danger}){
  return new Promise(resolve=>{
    const hasFields = !!(fields && fields.length);
    const wrap = document.createElement('div');
    wrap.className = 'ui-modal-backdrop';
    wrap.innerHTML = `<div class="ui-modal" role="dialog" aria-modal="true">
      ${title ? `<h3>${esc(title)}</h3>` : ''}
      ${message ? `<p>${esc(message)}</p>` : ''}
      ${(fields||[]).map((f,i)=> f.options
        ? `<label class="ui-field">${esc(f.label||'')}<select data-i="${i}">${f.options.map(o=>`<option value="${escAttr(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`
        : `<label class="ui-field">${esc(f.label||'')}<input type="text" data-i="${i}" value="${escAttr(f.value||'')}" placeholder="${escAttr(f.placeholder||'')}"/></label>`).join('')}
      <div class="ui-actions">
        ${cancelLabel===null ? '' : `<button class="btn small ghost" data-act="cancel">${esc(cancelLabel||'Cancel')}</button>`}
        <button class="btn small ${danger?'danger':'gold'}" data-act="ok">${esc(okLabel||'OK')}</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const inputs = [...wrap.querySelectorAll('input,select')];
    (inputs[0] || wrap.querySelector('[data-act="ok"]')).focus();
    let done = false;
    const close = ok=>{
      if(done) return; done = true;
      const vals = inputs.map(x=>x.value);
      wrap.remove();
      resolve(ok ? (hasFields ? vals : true) : (hasFields ? null : false));
    };
    wrap.querySelector('[data-act="ok"]').addEventListener('click', ()=>close(true));
    wrap.querySelector('[data-act="cancel"]')?.addEventListener('click', ()=>close(false));
    wrap.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.tagName!=='SELECT') close(true); if(e.key==='Escape') close(false); });
    wrap.addEventListener('mousedown', e=>{ if(e.target===wrap) close(false); });
  });
}
function uiAlert(message){ return uiDialog({message, okLabel:'OK', cancelLabel:null}); }
function uiConfirm(message, okLabel, danger){ return uiDialog({message, okLabel: okLabel||'OK', danger}); }
async function uiPrompt(message, value, placeholder){
  const r = await uiDialog({message, fields:[{value, placeholder}], okLabel:'Save'});
  return r ? r[0] : null;
}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function progFromEntry(e){

async function readProgramList(){
