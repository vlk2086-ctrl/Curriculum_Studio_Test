// ---------- Opening and creating a workspace ----------
async function openWorkspace(dept, pass, remember, creating){
  const d = await deriveWorkspace(dept, pass);
  await useWorkspace(d.id, d.raw, dept.trim());
  let existing = null;
  try{ existing = await window.storage.get(WORKSPACE_KEY); }
  catch(e){
    closeWorkspace();
    if(/not readable/i.test((e && e.message) || '')) throw new Error('That passcode doesn\'t open this workspace.');
    throw new Error("Couldn't reach the workspace storage. Check your internet connection and try again.");
  }
  let meta = null;
  if(existing){ try{ meta = JSON.parse(existing.value); }catch(e){ meta = {}; } }
  if(meta && meta.moved){ closeWorkspace(); throw new Error("This major's passcode has been changed. Ask Curriculum and Assessment for the new one."); }
  if(!existing){
    // A department on the built-in list gets its workspace the first time
    // someone signs in with its passcode.
    const builtIn = builtInDepartment(dept);
    if(!creating && !(builtIn && builtIn.v === d.id)){ closeWorkspace(); throw new Error("That passcode doesn't match this major. Check it and try again, or ask Curriculum and Assessment for the passcode."); }
    const name = builtIn ? builtIn.name : dept.trim();
    await window.storage.set(WORKSPACE_KEY, JSON.stringify({department: name, createdAt: Date.now()}));
    await writeProgramList([]);
    WS.name = name;
  } else {
    WS.name = (meta && meta.department) || WS.name;
  }
  lsSet(SESSION_KEY, remember ? JSON.stringify({id: d.id, raw: toB64(d.raw), name: WS.name}) : null);
  await loadPrograms();
  const last = lsGet('cw-active::' + WS.id);
  if(last && state.programs.some(p=>p.id===last)) setActiveProgram(last);
  else setActiveProgram(state.programs.length === 1 ? state.programs[0].id : null);
  return !existing;
}
async function resumeSession(){
  const s = lsGet(SESSION_KEY);
  if(!s) return false;
  try{
    const o = JSON.parse(s);
    await useWorkspace(o.id, fromB64(o.raw), o.name);
    const w = await window.storage.get(WORKSPACE_KEY);
    if(!w || JSON.parse(w.value).moved) throw new Error('gone');
    await loadPrograms();
    const last = lsGet('cw-active::' + WS.id);
    if(last && state.programs.some(p=>p.id===last)) setActiveProgram(last); else setActiveProgram(null);
    return true;
  }catch(e){ closeWorkspace(); return false; }
}
function signOut(){
  lsSet(SESSION_KEY, null); closeWorkspace();
  state.programs = []; state.programEntries = []; state.data = {}; state.activeProgram = null; state.activeTab = null; state.view = 'home';
  render();
}

// ---------- Set-up page for Curriculum and Assessment ----------
// Creates department workspaces (one or many at once), changes a department's
// passcode, and keeps the list of department names shown on the sign-in
// screen. Only names are listed; no one can open a workspace without its
// passcode.
async function createDepartmentWorkspace(dept, pass){
  const ctx = await wsContext(dept, pass);
  const exists = !!(await ctxGet(ctx, WORKSPACE_KEY));
  if(!exists){
    await ctxSet(ctx, WORKSPACE_KEY, JSON.stringify({department: dept, createdAt: Date.now()}));
    await ctxSet(ctx, PROGRAMS_KEY, '[]');
  }
  const dir = await readDirectory();
  if(!dir.some(n=>normKey(n)===normKey(dept))){ dir.push(dept); await writeDirectory(dir); }
  return exists ? 'exists' : 'created';
}
async function changeDepartmentPasscode(dept, oldPass, newPass, onProgress){
  const from = await wsContext(dept, oldPass);
  let meta;
  try{ meta = await ctxGet(from, WORKSPACE_KEY); }catch(e){ meta = null; }
  if(!meta && builtInDepartment(dept) && builtInDepartment(dept).v === from.id){
    meta = JSON.stringify({department: builtInDepartment(dept).name, createdAt: Date.now()});   // never opened yet
  }
  if(!meta || JSON.parse(meta).moved) throw new Error("The current passcode doesn't open this department's workspace.");
  const to = await wsContext(dept, newPass);
  if(await ctxGet(to, WORKSPACE_KEY)) throw new Error('That new passcode is already in use for this department. Choose a different one.');
  const keys = await ctxList(from, '');
  const others = keys.filter(k=>k!==WORKSPACE_KEY);
  let n = 0;
  for(const k of others){ const v = await ctxGet(from, k); if(v !== null) await ctxSet(to, k, v); n++; if(onProgress) onProgress(n, others.length); }
  await ctxSet(to, WORKSPACE_KEY, meta);
  for(const k of others){ try{ await ctxDelete(from, k); }catch(e){} }
  await ctxSet(from, WORKSPACE_KEY, JSON.stringify({moved: true, movedAt: Date.now()}));
  return others.length;
}

      <div id="admCreateMsg" class="wb-adm-msg"></div>
    </div>
    <div class="card">
      <h2>Change a department's passcode</h2>
      <div class="desc">Moves the major's work to the new passcode. The old passcode stops working, and anyone signed in with it will need the new one. Update your passcode list too.</div>
      <label>Major</label>
      ${depts.length ? `<select id="chgDept"><option value="">Choose a major</option>${deptOptions(depts)}</select>` : `<input type="text" id="chgDept"/>`}
      <label>Current passcode</label><input type="password" id="chgOld" autocomplete="off"/>
      <label>New passcode</label><input type="text" id="chgNew" autocomplete="off"/>
      <div class="row-actions"><button class="btn gold" id="chgGo">Change passcode</button></div>
      <div id="chgMsg" class="wb-adm-msg"></div>
    </div>
    <div class="card">
      <h2>Majors added here (${listed.length})</h2>
      <div class="desc">Majors added on this page, beyond the built-in list. Removing a name only takes it off the list chairs see. Its work is not deleted; add it again with the same name and passcode to put it back.</div>
      ${listed.length ? `<ul class="wb-adm-list">${listed.map(n=>`<li><span>${esc(n)}</span> <button class="btn small ghost" data-unlist="${escAttr(n)}">Remove from list</button></li>`).join('')}</ul>` : '<div class="empty">None yet.</div>'}
    </div>
  </div>`;
  el.querySelector('#adminBack').addEventListener('click', e=>{ e.preventDefault(); state.gateView = null; renderGate(); });
  el.querySelector('#admAddRow').addEventListener('click', ()=>el.querySelector('#admRows').insertAdjacentHTML('beforeend', row()));
  el.querySelector('#admCreate').addEventListener('click', async ()=>{
    const out = el.querySelector('#admCreateMsg');
    const rows = [...el.querySelectorAll('#admRows tr')].map(tr=>({dept: tr.querySelector('.adm-dept').value.trim(), pass: tr.querySelector('.adm-pass').value})).filter(r=>r.dept || r.pass);
    if(!rows.length){ out.textContent = 'Fill in at least one department and passcode.'; return; }
    const bad = rows.find(r=>!r.dept || !r.pass);
    if(bad){ out.textContent = 'Each row needs both a department name and a passcode.'; return; }
    const lines = [];
    for(const r of rows){
      out.innerHTML = `Creating ${esc(r.dept)}…`;
      try{
        const res = await createDepartmentWorkspace(r.dept, r.pass);
        lines.push(`<div class="ok">${esc(r.dept)}: ${res === 'created' ? 'created' : 'already set up with this passcode (on the list)'}</div>`);
      }catch(e){ lines.push(`<div class="bad">${esc(r.dept)}: couldn't be created (${esc((e && e.message) || String(e))})</div>`); }
    }
    await renderAdmin(el);
    el.querySelector('#admCreateMsg').innerHTML = lines.join('');
  });
  el.querySelector('#chgGo').addEventListener('click', async ()=>{
    const out = el.querySelector('#chgMsg');
    const dept = el.querySelector('#chgDept').value.trim(), oldP = el.querySelector('#chgOld').value, newP = el.querySelector('#chgNew').value;
    if(!dept || !oldP || !newP){ out.textContent = 'Fill in the department, current passcode, and new passcode.'; return; }

    try{
      const n = await changeDepartmentPasscode(dept, oldP, newP, (i, t)=>{ out.textContent = `Moving work… ${i} of ${t}`; });

    if(!(await uiConfirm(`Remove ${name} from the sign-in list? Its work is not deleted.`, 'Remove from list'))) return;
    await writeDirectory((await readDirectory()).filter(n=>normKey(n)!==normKey(name)));
    await renderAdmin(el);
  }));
}

function renderAddProgram(){
  const el = document.getElementById('mainBody');
  const list = catalogPrograms();
  const dep = builtInDepartment(WS.name);
  const haveKeys = new Set(state.programs.map(p=>normKey(p.familyName) + '|' + p.trackLabel));
  const mine = dep ? dep.programs.filter(([m, d])=>!haveKeys.has(normKey(m) + '|' + d)) : [];
  el.innerHTML = `<div class="wb-setup" style="margin-top:0;">
    <div class="prog-title">${state.programs.length ? 'Add a program' : 'Welcome to the ' + esc(WS.name) + ' workspace'}</div>
    <div class="prog-meta">${state.programs.length ? esc(WS.name) + ' workspace' : 'Start by choosing the programs you are revising. You can add more later.'}</div>
    ${mine.length ? `<div class="card">
      <h2>${esc(WS.name)} programs</h2>
      <div class="desc">Check each program you're revising. Each degree is its own program with its own ten deliverables.</div>
      <div class="wb-mine">${mine.map(([m, d], i)=>{
        const built = hasPreloadedCourses({familyName: m, trackLabel: d});
        return `<label class="wb-check"><input type="checkbox" data-mine="${i}"/> ${esc(progFromEntry({id:'', major:m, degree:d}).programName)}${built ? ' <span class="wb-built">current requirements built in</span>' : ''}</label>`;
      }).join('')}</div>
      <div class="row-actions"><button class="btn gold" id="mineGo">Add checked programs</button></div>
    </div>` : ''}
    <div class="card">
      <h2>${mine.length ? 'Another program' : 'Which program are you revising?'}</h2>
      <div class="desc">Its current required courses load into its Sequenced Stick Figure (IV), ready to sequence and revise. Add each degree separately (for example, the MA and the MFA).</div>
      <label>Program</label>
      <select id="setupProgram">
        <option value="">Choose a program</option>
        ${list.map((p,i)=>`<option value="${i}">${esc(p.major)}, ${esc(degreeLabel(p.degree))}</option>`).join('')}
        <option value="other">My program isn't listed</option>
      </select>
      <div class="fhint" id="setupCatalogNote" style="font-style:normal;margin-top:8px;"></div>
      <div id="setupOther" style="display:none;">
        <label>Program (major)</label>
        <input type="text" id="setupMajor" placeholder="e.g. Illustration" autocomplete="off"/>
        <label>Degree</label>
        <select id="setupDegree"><option value="">Choose a degree</option>${WB_DEGREES.map(d=>`<option value="${d.value}">${d.label}</option>`).join('')}</select>
      </div>
      <div class="row-actions"><button class="btn gold" id="setupGo">Add program</button> ${state.programs.length ? '<button class="btn ghost" id="setupCancel">Cancel</button>' : ''}</div>
    </div>
  </div>`;
  const pick = el.querySelector('#setupProgram'), other = el.querySelector('#setupOther'), note = el.querySelector('#setupCatalogNote');
  pick.addEventListener('change', ()=>{
    other.style.display = pick.value === 'other' ? '' : 'none';
    if(pick.value === 'other') note.textContent = "Enter the program below. Its courses aren't built in yet, so you'll add its current courses yourself in the Sequenced Stick Figure (IV).";
    else if(pick.value !== ''){ const p = list[+pick.value]; note.innerHTML = `<span style="color:var(--ok);font-weight:600;">${p.count} required courses and elective slots</span> from the ${esc(CATALOG_EDITION)} catalog will load into its Sequenced Stick Figure (IV).`; }
    else note.textContent = '';
  });
  el.querySelector('#mineGo')?.addEventListener('click', async ()=>{
    const picked = [...el.querySelectorAll('[data-mine]:checked')].map(cb=>mine[+cb.dataset.mine]);
    if(!picked.length){ await uiAlert('Check at least one program.'); return; }
    try{
      const current = await readProgramList();
      let first = null;
      for(const [m, d] of picked){
        if(current.some(x=>normKey(x.major)===normKey(m) && str(x.degree).toUpperCase()===d)) continue;
        const entry = {id: uid(), major: m, degree: d, createdAt: Date.now()};
        current.push(entry); first = first || entry;
      }
      await writeProgramList(current);
      await loadPrograms();
      if(picked.length === 1 && first) setActiveProgram(first.id); else setActiveProgram(null);
      render();
    }catch(e){ await uiAlert("Couldn't save to the workspace. Check your internet connection and try again."); }
  });
  el.querySelector('#setupCancel')?.addEventListener('click', ()=>{ state.view = state.activeProgram ? 'program' : 'home'; render(); });
  el.querySelector('#setupGo').addEventListener('click', async ()=>{
    let m, d;
    if(pick.value === ''){ await uiAlert('Choose a program.'); return; }
    if(pick.value === 'other'){
      m = el.querySelector('#setupMajor').value.trim(); d = el.querySelector('#setupDegree').value;
      if(!m){ await uiAlert('Enter the program (major).'); return; }
      if(!d){ await uiAlert('Choose a degree.'); return; }
    } else { const p = list[+pick.value]; m = p.major; d = p.degree; }
    try{
      const current = await readProgramList();
      if(current.some(x=>normKey(x.major)===normKey(m) && str(x.degree).toUpperCase()===d)){
        await uiAlert(`${m} ${degreeLabel(d)} is already in this workspace.`); return;
      }
      const entry = {id: uid(), major: m, degree: d, createdAt: Date.now()};
      current.push(entry);
      await writeProgramList(current);
      await loadPrograms();
      setActiveProgram(entry.id);
      render();
    }catch(e){ await uiAlert("Couldn't save to the workspace. Check your internet connection and try again."); }
  });
}
async function editProgram(prog){
  const entry = (state.programEntries || []).find(e=>e.id===prog.id) || {};
  const r = await uiDialog({title:'Program details', fields:[
    {label:'Program (major)', value: entry.major || ''},
    {label:'Degree', value: entry.degree || '', options: WB_DEGREES}
  ], okLabel:'Save'});
  if(!r) return;
  const [major, degree] = r.map(x=>str(x).trim());
  if(!major){ await uiAlert("The program name can't be blank."); return; }
  if(degree !== entry.degree && !(await uiConfirm(`Change the degree from ${degreeLabel(entry.degree)} to ${degreeLabel(degree)}? The Sequenced Stick Figure's length and hour checks follow the degree. Courses already entered stay as they are.`, 'Change degree'))) return;
  const list = await readProgramList();
  const e = list.find(x=>x.id===prog.id); if(!e) return;
  e.major = major; e.degree = degree;
  await writeProgramList(list);
  await loadPrograms(); render();
}
async function removeProgram(prog){
  const typed = await uiDialog({title:'Remove ' + prog.programName + '?',
    message:`This permanently deletes all of ${prog.programName}'s deliverables for everyone using this workspace. Download a backup file first if you might need any of it. Type the program name to confirm.`,
    fields:[{label:'', value:'', placeholder: prog.programName}], okLabel:'Remove program', danger:true});
  if(!typed) return;
  if(normKey(typed[0]) !== normKey(prog.programName)){ await uiAlert('The name didn\'t match, so nothing was removed.'); return; }
  const keys = (await window.storage.list('prog:' + prog.id + ':')).keys.concat(['program:' + prog.id]);
  for(const k of keys){ try{ await window.storage.delete(k); }catch(e){} }
  const list = (await readProgramList()).filter(x=>x.id!==prog.id);
  await writeProgramList(list);
  delete state.data[prog.id];
  await loadPrograms(); setActiveProgram(null); render();
}

// ---------- Backup files ----------
function todayStamp(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
async function downloadBackup(){
  let records;
  try{ records = await allRecords(); }catch(e){ await uiAlert("Couldn't read the workspace to make a backup. Check your internet connection and try again."); return; }
  delete records[WORKSPACE_KEY];
  const payload = {app:'curriculum-workbook', version:2, exportedAt:new Date().toISOString(), department: WS.name, records};
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = ((WS.name || 'Department') + ' Workbook Backup ' + todayStamp()).replace(/[^a-z0-9\-_ ]/gi,'').replace(/\s+/g,'_') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
// Backups from the one-program workbook (version 1) hold a single program
// under the id "my-program"; it comes in as a new program in this workspace.
async function openBackupFile(file){
  let payload = null;
  try{ payload = JSON.parse(await file.text()); }catch(e){}
  if(!payload || payload.app !== 'curriculum-workbook' || !payload.records || typeof payload.records !== 'object'){
    await uiAlert("That file isn't a Curriculum Workbook backup. Choose the .json file made with \"Download a backup file\".");
    return;
  }
  const rec = Object.assign({}, payload.records); delete rec[WORKSPACE_KEY];
  let incoming = [];
  if(rec[PROGRAMS_KEY]){ try{ incoming = JSON.parse(rec[PROGRAMS_KEY]) || []; }catch(e){} delete rec[PROGRAMS_KEY]; }
  else if(rec['workbook-profile']){
    let prof = {}; try{ prof = JSON.parse(rec['workbook-profile']); }catch(e){}
    const newId = uid();
    incoming = [{id: newId, major: prof.major || 'Program', degree: prof.degree || 'BFA', createdAt: Date.now()}];
    Object.keys(rec).forEach(k=>{
      if(k === 'workbook-profile'){ delete rec[k]; return; }
      if(k.includes('my-program')){
        let v = rec[k];
        if(k === 'program:my-program'){ try{ const o = JSON.parse(v); o.id = newId; v = JSON.stringify(o); }catch(e){} }
        rec[k.replace('my-program', newId)] = v; delete rec[k];
      }
    });
  }
  if(!incoming.length){ await uiAlert('That backup has no programs in it.'); return; }
  const current = await readProgramList();
  const names = incoming.map(e=>progFromEntry(e).programName).join(', ');
  const replacing = incoming.filter(e=>current.some(c=>c.id===e.id));
  const when = payload.exportedAt ? new Date(payload.exportedAt).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}) : 'an earlier date';
  const msg = `Bring in ${names} from the backup saved ${when}?` + (replacing.length ? ` ${replacing.map(e=>progFromEntry(e).programName).join(', ')} already in this workspace will be replaced by the backup version.` : '') + ' Other programs in the workspace are not changed.';
  if(!(await uiConfirm(msg, 'Bring in programs', !!replacing.length))) return;
  try{
    for(const e of replacing){
      const keys = (await window.storage.list('prog:' + e.id + ':')).keys.concat(['program:' + e.id]);
      for(const k of keys){ try{ await window.storage.delete(k); }catch(x){} }
    }
    for(const [k, v] of Object.entries(rec)) await window.storage.set(k, v);
    const merged = current.filter(c=>!incoming.some(e=>e.id===c.id)).concat(incoming);
    await writeProgramList(merged);
  }catch(e){ await uiAlert("The backup couldn't be saved to the workspace: " + ((e && e.message) || e)); return; }
  state.data = {};
  await loadPrograms(); setActiveProgram(incoming[0].id); render();
}
function wireBackupControls(root){
  root.querySelector('#backupBtn')?.addEventListener('click', downloadBackup);
  const inp = root.querySelector('#restoreInput');
  root.querySelector('#restoreBtn')?.addEventListener('click', ()=>inp && inp.click());
  inp?.addEventListener('change', async ()=>{ const f = inp.files && inp.files[0]; inp.value = ''; if(f) await openBackupFile(f); });
}

// ---------- rendering ----------
function render(){
  const app = document.getElementById('app');
  if(!WS.id){
    app.classList.remove('rail-collapsed');
    if(app.querySelector('#gateBody')) return;
    app.innerHTML = `<div class="main"><div id="gateBody"></div></div>`;
    renderGate();
    return;
  }
  if(!state.programs.length && !state.loadError) state.view = 'add';
  const prog = state.view === 'program' ? state.programs.find(p=>p.id===state.activeProgram) : null;
  const rail = `<div class="rail">
    <button class="rail-toggle" id="railToggle" title="${state.railCollapsed ? 'Show the menu' : 'Hide the menu for more room'}">${state.railCollapsed ? '&#8250;' : '&#8249;'}</button>
    <h1 id="homeLink" style="cursor:pointer;padding-right:30px;">Curriculum Workbook</h1>
    <div class="wb-dept">${esc(WS.name)}</div>
    <div id="railSaveWarning" style="color:#ffd9a8;font-size:12.5px;line-height:1.4;margin:8px 0;${state.saveFailed ? '' : 'display:none;'}">Changes aren't being saved right now. Check your internet connection.</div>
    ${state.loadError ? `<div style="color:#ffd9a8;font-size:12.5px;line-height:1.4;margin:8px 0;">Couldn't reach the workspace. <button class="add-track-btn" id="retryLoad">Try again</button></div>` : ''}
    <div class="wb-rail-label">Programs</div>
    <div class="prog-list wb-nav-list" style="margin-top:4px;">
      ${state.programs.map(p=>`<button class="prog-btn wb-prog-btn ${prog && p.id===prog.id?'active':''}" data-progsel="${p.id}">${esc(p.programName)}</button>`).join('')}
      <button class="add-track-btn" id="addProgBtn">+ Add a program</button>
    </div>
    ${prog ? `<div class="wb-rail-label">${esc(prog.programName)}</div>
    <div class="prog-list wb-nav-list" style="margin-top:4px;">
      <button class="prog-btn wb-nav ${state.activeTab===null?'active':''}" data-nav="overview">Overview</button>
      ${DELIVERABLES.map((d,i)=>`<button class="prog-btn wb-nav ${state.activeTab===d.id?'active':''}" data-nav="${d.id}"><span class="wb-num">${WB_NUMERALS[i]}</span>${esc(d.label)}</button>`).join('')}
    </div>` : ''}
    <div class="wb-save">
      <div class="wb-save-note">Saved to the shared workspace for this major and locked with its passcode. Anyone with the passcode can see and edit it.</div>
      <button class="add-track-btn wb-full" id="nameBtn">${state.profile.preparedBy ? 'Your name: ' + esc(state.profile.preparedBy) : 'Add your name for downloads'}</button>

      <button class="add-track-btn wb-full" id="restoreBtn">Open a backup file</button>
      <input type="file" id="restoreInput" accept=".json,application/json" style="display:none">
      <button class="add-track-btn wb-full" id="signOutBtn">Sign out</button>
    </div>
  </div>`;

  let main = `<div class="main${prog && state.activeTab===4 ? ' seq-wide' : ''}">`;
  if(state.view === 'add') main += `<div id="mainBody"></div>`;
  else if(!prog) main += `<div id="homeBody"></div>`;
  else if(state.activeTab === null) main += `<div id="landingBody">Loading…</div>`;
  else {
    main += `<a class="back-link" id="backToLanding">← Back to ${esc(prog.programName)} overview</a>
    <div class="prog-title">${esc(prog.programName)}</div>
    <div class="prog-meta">Changes save automatically to the ${esc(WS.name)} workspace. <span class="pill" id="saveStatusPill" style="${state.status ? '' : 'display:none;'}">${esc(state.status)}</span></div>
    <div class="nav-hint">Click a number to jump to that deliverable. They don't have to be done in order, but this is the intended sequence. Each one has a Download as Word button for your OneNote form.</div>
    <div class="stepper">
      ${DELIVERABLES.map(d=>`<div class="step ${d.id===state.activeTab?'active':''}" data-tab="${d.id}">
        <div class="circle">${d.id}</div>
        <div class="lbl">${esc(d.label)}</div>
      </div>`).join('')}
    </div>
    <div id="tabBody">Loading…</div>`;
  }
  main += `</div>`;

  app.innerHTML = rail + main;
  app.classList.toggle('rail-collapsed', !!state.railCollapsed);
  document.getElementById('railToggle')?.addEventListener('click', ()=>{
    state.railCollapsed = !state.railCollapsed;

// helper to build editable table
function buildTable(container, rows, columns, onChange, opts={}){
  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join('')}${opts.removable!==false?'<th></th>':''}</tr></thead>`;
  const tbody = document.createElement('tbody');
  rows.forEach((row,ri)=>{
    const tr = document.createElement('tr');
    columns.forEach(c=>{
      const td = document.createElement('td');
      if(c.type==='select'){
        const sel = document.createElement('select');
        (c.options(row)||[]).forEach(optVal=>{
          const o = document.createElement('option');
          o.value = optVal; o.textContent = c.optionLabel ? c.optionLabel(optVal) : (optVal || '—');
          if(row[c.key]===optVal) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener('change', ()=>{ row[c.key]=sel.value; onChange(); });
        td.appendChild(sel);
      } else if(c.type==='textarea'){
        const ta = document.createElement('textarea');
        ta.rows=2; ta.value = row[c.key]||'';
        ta.addEventListener('input', ()=>{ row[c.key]=ta.value; onChange(); });
        td.appendChild(ta);
      } else {
        const inp = document.createElement('input');
        inp.type='text'; inp.value = row[c.key]||'';
        inp.readOnly = !!c.readonly;
        inp.addEventListener('input', ()=>{ row[c.key]=inp.value; onChange(); });
        td.appendChild(inp);
      }
      tr.appendChild(td);
    });
    if(opts.removable!==false){
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.className='btn small ghost'; btn.textContent='Remove';
      btn.addEventListener('click', ()=>{ rows.splice(ri,1); onChange(); container._rerender(); });
      td.appendChild(btn); tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  container.appendChild(tbl);
}

// IV. Sequenced Stick Figure — embeds the dedicated sequencing tool (bundled
// into this same file, see SEQ_TOOL_B64), scoped to the current program.
// That tool owns the canonical course list; every downstream deliverable
// below reads directly from its saved data.
function buildSeqToolSrcdoc(prog){
  // Plain atob() only correctly reconstructs ASCII bytes — any multi-byte
  // UTF-8 character in the source (em dashes, curly quotes, etc.) comes back
  // as garbled characters unless it's run through a proper UTF-8 decode.
  const html = decodeURIComponent(atob(SEQ_TOOL_B64).split('').map(function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  // window.storage (the persistence API) is only injected by the host into
  // this top-level artifact page — a nested srcdoc iframe does NOT get its
  // own copy. So every call the embedded tool makes to window.storage.get/
  // set/delete/list is bridged here via postMessage to the parent, which
  // does have a working window.storage, and the result is sent back.
  const inject = `<script>
    window.__EMBED_PID__=${JSON.stringify(prog.id)};
    window.__EMBED_PNAME__=${JSON.stringify(prog.familyName || prog.programName)};
    window.__EMBED_TRACK__=${JSON.stringify(prog.trackLabel || '')};
    window.__EMBED_SEED__=${JSON.stringify(buildPreloadedCourses(prog) || null).replace(/</g,'\\u003c')};
    (function(){
      let reqCounter = 0;
      const pending = {};
      window.addEventListener('message', function(e){
        const d = e.data;
        if(d && d.__storageBridgeResponse && pending[d.reqId]){
          const p = pending[d.reqId]; delete pending[d.reqId];
          if(d.error) p.reject(new Error(d.error)); else p.resolve(d.result);
        }
      });
      function call(method, args){
        return new Promise(function(resolve, reject){
          const reqId = 'r' + (reqCounter++) + '_' + Date.now();
          pending[reqId] = {resolve: resolve, reject: reject};
          window.parent.postMessage({__storageBridge:true, reqId: reqId, method: method, args: args}, '*');
        });
      }
      window.storage = {
        get: function(key, shared){ return call('get',[key, shared]); },
        set: function(key, value, shared){ return call('set',[key, value, shared]); },
        delete: function(key, shared){ return call('delete',[key, shared]); },
        list: function(prefix, shared){ return call('list',[prefix, shared]); }
      };
    })();
  <\/script>`;
  // inject right after <head> so it runs before the tool's own script block
  return html.replace('<head>', '<head>' + inject);
}

// The Stick Figure frame is sized to its full content (no scrollbar of its
// own), so the page scrolls as one. The frame is told which part of it is
// on screen, so its pop-ups open there and its Save bar stays in view; while
// a pop-up is open the page behind it stops scrolling.
let seqFrameCleanup = null;
function connectSeqFrame(frame){
  if(seqFrameCleanup) seqFrameCleanup();
  const scroller = document.scrollingElement || document.documentElement;
  const sendViewport = ()=>{
    if(!document.body.contains(frame)){ cleanup(); return; }
    const r = frame.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const top = Math.max(0, -r.top);
    const height = Math.max(120, Math.min(vh, r.bottom) - Math.max(0, r.top));
    try{ frame.contentWindow.postMessage({__viewport:{top, height}}, '*'); }catch(e){}
  };
  const onMsg = e=>{
    if(e.source !== frame.contentWindow || !e.data) return;
    if(e.data.__seqHeight){ frame.style.height = Math.max(600, Math.ceil(e.data.__seqHeight) + 4) + 'px'; sendViewport(); }
    if(e.data.__seqModal !== undefined){
      scroller.style.overflow = e.data.__seqModal ? 'hidden' : '';
      document.body.style.overflow = e.data.__seqModal ? 'hidden' : '';
      sendViewport();
    }
    if(e.data.__seqWantsViewport) sendViewport();
  };
  const cleanup = ()=>{
    window.removeEventListener('scroll', sendViewport, true);
    window.removeEventListener('resize', sendViewport);
    window.removeEventListener('message', onMsg);
    scroller.style.overflow = ''; document.body.style.overflow = '';
    seqFrameCleanup = null;
  };
  window.addEventListener('scroll', sendViewport, true);
  window.addEventListener('resize', sendViewport);
  window.addEventListener('message', onMsg);
  frame.addEventListener('load', sendViewport);
  seqFrameCleanup = cleanup;
}

// Parent-side half of the bridge above: performs the real storage call
// (this top-level page's window.storage works normally) and posts the
// result back to whichever iframe asked for it.
window.addEventListener('message', async (e)=>{
  const d = e.data;
  if(!d || !d.__storageBridge) return;
  // The embedded tool gets read access to program-index but no writes: only
  // this page's mutateProgramList may change it. A cached older copy of the
  // tool therefore can't strip pairings either.
  if((d.method==='set' || d.method==='delete') && d.args && d.args[0]===PROGRAM_INDEX_KEY){
    e.source.postMessage({__storageBridgeResponse:true, reqId:d.reqId, result:{key:PROGRAM_INDEX_KEY, ignored:true}}, '*');
    return;
  }
  try{
    const result = await window.storage[d.method](...d.args);
    e.source.postMessage({__storageBridgeResponse:true, reqId:d.reqId, result}, '*');
  }catch(err){
    e.source.postMessage({__storageBridgeResponse:true, reqId:d.reqId, error: (err && err.message) || String(err)}, '*');
  }
});

// ---------- SOW gating: uploaded, signed PDF instead of a filled-in form ----------
// The department's Senior Assessment and Curriculum Specialist creates and
// signs the Scope of Work outside this tool; the department just uploads
// the finished PDF here. Complete = a PDF is on file. Uploading it IS the
// completion signal — there's no separate signature-collection step to
// track, since the document already carries its signatures when it arrives.
function sowIsComplete(sow){
  return !!(sow && sow.fileData);
}

// data:URL -> Blob, for opening/downloading a stored PDF without keeping a
// live object URL around between renders.
function dataURLtoBlob(dataURL){
  const [meta, b64] = dataURL.split(',');
  const mime = (meta.match(/:(.*?);/) || [,'application/pdf'])[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// VI. Course Content - reads courses from IV, pillars from III
// ---------- Course outcomes: one box per outcome, each tied to a pillar ----------
// Stored as [{text, pillar}]. Older entries kept outcomes as one block of
// text; those are split into one outcome per line the first time they load.
function outcomeListFrom(e, listKey, textKey, minBoxes){
  if(!Array.isArray(e[listKey])){
    const lines = str(e[textKey]).split(/\n+/).map(x=>x.replace(/^\s*(\d+[.)]|[-•*])\s*/,'').trim()).filter(Boolean);
    e[listKey] = lines.map(t=>({text:t, pillar:''}));
  }
  while(e[listKey].length < (minBoxes||0)) e[listKey].push({text:'', pillar:''});
  return e[listKey];
}
function filledOutcomes(list){ return (list||[]).filter(o=>str(o.text).trim()); }
function renderOutcomesEditor(host, list, pillars, onChange){
  host.innerHTML = list.map((o,i)=>`<div class="oc-row">
      <div class="oc-num">${i+1}</div>
      <div class="oc-main">
        <textarea data-oc="${i}" rows="2" placeholder="Students will be able to...">${esc(o.text)}</textarea>
        <div class="oc-pillar"><span>Connects to pillar</span>
          <select data-ocp="${i}"><option value="">${pillars.length ? 'Select a pillar' : 'No pillars defined yet (Deliverable III)'}</option>${pillars.map(p=>`<option value="${escAttr(p.name)}" ${o.pillar===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        </div>
      </div>
      ${list.length > 1 ? `<button class="oc-x" data-ocx="${i}" title="Remove this outcome">&times;</button>` : ''}
    </div>`).join('') + `<button class="btn small ghost" data-ocadd>+ Add another outcome</button>`;
  host.querySelectorAll('[data-oc]').forEach(el=>el.addEventListener('input', ()=>{ list[+el.dataset.oc].text = el.value; onChange(); }));
  host.querySelectorAll('[data-ocp]').forEach(el=>el.addEventListener('change', ()=>{ list[+el.dataset.ocp].pillar = el.value; onChange(); }));
  host.querySelectorAll('[data-ocx]').forEach(el=>el.addEventListener('click', ()=>{ list.splice(+el.dataset.ocx, 1); onChange(); renderOutcomesEditor(host, list, pillars, onChange); }));
  host.querySelector('[data-ocadd]').addEventListener('click', ()=>{ list.push({text:'', pillar:''}); onChange(); renderOutcomesEditor(host, list, pillars, onChange); host.querySelectorAll('textarea')[list.length-1].focus(); });
}
function outcomesHtml(list){
  const f = filledOutcomes(list);
  return f.length ? `<ol>${f.map(o=>`<li>${esc(o.text)}${o.pillar ? ` <i>(Pillar: ${esc(o.pillar)})</i>` : ''}</li>`).join('')}</ol>` : '';
}

// ---------- Stick Figure -> Transition Planning ----------
// Compares the program's Stick Figure with the catalog requirements it
// started from: revised courses (with what changed), new and restored
// courses, catalog courses deleted from the Stick Figure, and hours by area.
function sfBucket(area, subject){
  const a = normKey(area);
  if(a.includes('foundation') || str(subject).toUpperCase()==='FOUN') return 'foundation';
  if(a.includes('general education')) return 'genEd';
  return 'major';
}
function sfCode(subject, number){ return (str(subject) + ' ' + str(number)).trim(); }
function sfHours(list){
  // A "choose N" bundle counts N courses once, not every option.
  const seen = new Set(); let total = 0;
  list.forEach(c=>{
    const h = +c.hours || 5;
    if(c.group){ if(seen.has(c.group)) return; seen.add(c.group); total += (+c.groupSelectCount || 1) * h; }
    else total += h;
  });
  return total;
}
function stickFigureChanges(prog, rec){
  const seed = buildPreloadedCourses(prog) || [];
  const seedById = {}; seed.forEach(c=>{ seedById[c.id] = c; });
  const seeded = !!(rec && (rec.catalogPreloaded || (rec.courses||[]).some(c=>c.catalogPreloaded)));
  const current = (rec && Array.isArray(rec.courses)) ? rec.courses : (seed.length ? seed : []);
  const usingSeed = !(rec && Array.isArray(rec.courses));
  const out = {revised:[], added:[], removed:[], unchanged:0, unplaced:0, hours:{}, hasBaseline: seed.length>0 && (seeded || usingSeed)};
  current.forEach(c=>{
    const base = c.original || (c.catalogPreloaded && seedById[c.id] && seedById[c.id].original) || null;
    const area = c.requirementArea || (seedById[c.id] && seedById[c.id].requirementArea) || '';
    const bucket = sfBucket(area, c.subject);
    if(c.catalogPreloaded && !(c.year && c.quarter)) out.unplaced++;
    if(c.status==='new' || c.status==='restoration'){
      out.added.push({key:'new:'+c.id, id:c.id, code:sfCode(c.subject,c.number), title:c.title||'', status:c.status, bucket, placeholder:false});
    } else if(c.status==='placeholder_elective' && !c.catalogPreloaded){
      out.added.push({key:'new:'+c.id, id:c.id, code:'', title:c.title||'', status:'placeholder', bucket, placeholder:true});
    } else if(c.status==='revised'){
      const priorNumber = c.originalNumber || (base && base.number) || c.number;
      const changes = [];
      if(base){
        if(normKey(base.title)!==normKey(c.title)) changes.push('title');
        if(normKey(priorNumber)!==normKey(c.number)) changes.push('course number');
        if(normKey(base.prereqs)!==normKey(c.prereqs)) changes.push('prerequisites');
        if(normKey(base.summary)!==normKey(c.summary)) changes.push('course summary');
      } else if(c.originalNumber) changes.push('course number');
      out.revised.push({key:'rev:'+c.id, id:c.id, code:sfCode(c.subject,c.number), title:c.title||'',
        priorCode:sfCode(c.subject, priorNumber), priorTitle:(base && base.title) || c.title || '',
        priorPrereqs:(base && base.prereqs)||'', prereqs:c.prereqs||'', changes, reason:c.numberChangeReason||'', bucket});
    } else {
      out.unchanged++;
    }
  });
  if(out.hasBaseline && !usingSeed){
    const ids = new Set(current.map(c=>c.id));
    seed.forEach(sc=>{
      if(ids.has(sc.id)) return;
      out.removed.push({key:'rem:'+sc.id, id:sc.id, code:sfCode(sc.subject, sc.number), title:sc.title, bucket:sfBucket(sc.requirementArea, sc.subject), placeholder: sc.status==='placeholder_elective', group: sc.group||''});
    });
  }
  ['foundation','genEd','major'].forEach(b=>{
    out.hours[b] = {
      prior: seed.length ? sfHours(seed.filter(c=>sfBucket(c.requirementArea, c.subject)===b)) : null,
      now: sfHours(current.filter(c=>sfBucket(c.requirementArea || (seedById[c.id]||{}).requirementArea, c.subject)===b))
    };
  });
  out.priorCourses = seed.filter(c=>c.subject).map(c=>sfCode(c.subject,c.number)+' '+c.title);
  out.currentCourses = current.filter(c=>c.subject).map(c=>sfCode(c.subject,c.number)+' '+c.title);
  return out;
}
// "SUBJ 123 Title" typed or picked -> {code, title}
function sfSplit(text){
  const t = str(text).trim();
  const m = t.match(/^([A-Za-z]{2,5}\s*\d{3}[A-Za-z]?)\s*(.*)$/);
  return m ? {code: m[1].toUpperCase().replace(/\s+/,' '), title: m[2]} : {code:'', title:t};
}
// Rows for the student guide's equivalency tables, built from the changes
// and the department's answers (data.sfAnswers).
// Substitution courses for a new course: a list, taken as "any one of these"
// or "all of these together". Older answers kept a single course in a.sub.
function subsOf(a){
  if(Array.isArray(a.subs)) return a.subs;
  return a.sub ? [a.sub] : [];
}
function subsText(a){
  const list = subsOf(a).map(x=>str(x).trim()).filter(Boolean);
  if(!list.length) return '';
  if(list.length===1) return list[0];
  const joiner = a.subMode==='all' ? ' and ' : ' or ';
  return list.slice(0,-1).join(', ') + (list.length>2 ? ',' : '') + joiner + list[list.length-1] + (a.subMode==='all' ? ' (all required)' : '');
}
// Rows for the student guide's equivalency tables, built from the changes and
// the department's answers. A department can edit any row (overrides); its
// edits are kept until it resets the row.
function stickFigureRows(ch, answers, bucket, overrides){
  const rows = [];
  ch.revised.filter(r=>r.bucket===bucket).forEach(r=>{
    const notes = [];
    if(r.changes.length) notes.push('Revised: ' + r.changes.join(', ') + '.');
    if(r.changes.includes('prerequisites')) notes.push('New prerequisites: ' + (r.prereqs || 'none') + '.');
    notes.push('Completing ' + r.priorCode + ' satisfies this requirement.');
    rows.push({key:r.key, newText:(r.code+' '+r.title).trim(), priorText:(r.priorCode+' '+r.priorTitle).trim(), notes:notes.join(' ')});
  });
  ch.added.filter(r=>r.bucket===bucket).forEach(r=>{
    const a = answers[r.key] || {};
    const subs = subsText(a);
    rows.push({key:r.key, newText:(r.code+' '+r.title).trim(), priorText: a.none ? 'No prior equivalent' : (subs || 'Substitution to be determined'),
      notes: [r.status==='restoration' ? 'Restored course.' : (r.placeholder ? 'New elective slot.' : 'New course.'), a.notes||''].filter(Boolean).join(' ')});
  });
  ch.removed.filter(r=>r.bucket===bucket).forEach(r=>{
    const a = answers[r.key] || {};
    rows.push({key:r.key, newText: a.none ? 'No longer required' : (str(a.eq).trim() || 'Equivalent to be determined'), priorText:(r.code+' '+r.title).trim(),
      notes: ['Removed from the curriculum.', a.notes||''].filter(Boolean).join(' ')});
  });
  rows.forEach(row=>{
    const o = overrides && overrides[row.key];
    if(o){ ['newText','priorText','notes'].forEach(f=>{ if(o[f]!==undefined) row[f] = o[f]; }); row.edited = true; }
    // shape the export table expects
    row.newCode = row.newText; row.newTitle = ''; row.priorCode = row.priorText; row.priorTitle = '';
  });
  return rows;
}

    body.innerHTML = `<div class="card"><h2>Syllabus Planning</h2>
      <div class="desc">Syllabus Planning is only needed for courses the department has designated as <b>New Course</b> on the Sequenced Stick Figure (Deliverable IV) — not revisions, restorations, or existing courses.</div>
      <div class="empty">None of this program's courses are currently marked "New Course" in Deliverable IV. Mark a course's status as New there, save the program, and it will appear here.</div></div>`;
    return;
  }
  if(data.selected && !courses.find(c=>courseKeyOf(c)===data.selected)) data.selected='';

  body.innerHTML = `<div class="card">
    <h2>Syllabus Planning</h2>
    <div class="desc">Syllabus Planning is only needed for courses the department has designated as <b>New Course</b> on the Sequenced Stick Figure (Deliverable IV). For each new course, plan out 20 class sessions (lecture topics, planned demonstrations, class activities) and at least 5 grading opportunities, each with a weight toward the final grade.</div>
    <div class="flowhint">This list is the "New Course" subset of Deliverable IV's course list, automatically. Need to fix a course's name or number? Edit it right here — it updates the Stick Figure and every other tab too.</div>
    <label>New courses needing syllabus content</label>
    <div id="sylList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;"></div>
    <div id="sylDetail"></div>
    ${data.selected ? toolbar() : ''}
  </div>`;

  const list = body.querySelector('#sylList');
  courses.forEach(c=>{
    const key = courseKeyOf(c);
    const btn = document.createElement('button');
    btn.className = 'btn small ' + (data.selected===key ? '' : 'ghost');
    btn.textContent = courseLabelOf(c) || '(untitled course)';
    btn.addEventListener('click', ()=>{ data.selected = key; saveDeliverable(prog.id,'syllabus',data).then(()=>renderTab(prog)); });
    list.appendChild(btn);
  });

  const detail = body.querySelector('#sylDetail');
  const selectedCourse = courses.find(c=>courseKeyOf(c)===data.selected);
  if(!selectedCourse){
    detail.innerHTML = `<div class="empty">Click a course above to plan its syllabus.</div>`;
    return;
  }
  const key = data.selected;
  if(!data.entries[key]) data.entries[key] = {};
  const e = data.entries[key];
  if(!e.sessions || e.sessions.length!==20) e.sessions = Array.from({length:20}, (_,i)=> (e.sessions && e.sessions[i]) || {content:''});
  if(!e.grading || !e.grading.length) e.grading = Array.from({length:5}, ()=>({title:'',weight:'',explanation:'',outcome:''}));
  // Reference: course info from IV, description and outcomes from VI.
  const cc = Object.assign({}, (ccData.entries||{})[key] || {});
  const ccOutcomes = filledOutcomes(outcomeListFrom(cc, 'outcomeList', 'outcomes', 0));
  const outcomeLabel = (o,i)=>`Outcome ${i+1}: ${o.text}`;
  const outcomeOptions = ccOutcomes.map(outcomeLabel);
  const unlinked = e.grading.filter(g=>(str(g.title).trim() || str(g.explanation).trim()) && !g.outcome).length;

  detail.innerHTML = `<div class="ref-box">
      <h4>For reference: ${esc(courseLabelOf(selectedCourse))}</h4>
      <table class="sf-auto">
        <tr><th style="width:170px;">Prerequisites (IV)</th><td>${esc(selectedCourse.prereqs || 'None')}</td></tr>
        <tr><th>Course summary (IV)</th><td>${esc(selectedCourse.summary || 'Not entered yet')}</td></tr>
        <tr><th>Course description (VI)</th><td>${esc(cc.description || 'Not entered yet in Course Content')}</td></tr>
        <tr><th>Learning outcomes (VI)</th><td>${ccOutcomes.length ? `<ol style="margin:0;padding-left:20px;">${ccOutcomes.map(o=>`<li>${esc(o.text)}${o.pillar ? ` <span style="color:#6b7280;">(Pillar: ${esc(o.pillar)})</span>` : ''}</li>`).join('')}</ol>` : 'Not entered yet in Course Content'}</td></tr>
      </table>
    </div>
    <label>Class Sessions (20)</label>
    <div class="fhint">Lecture topics, planned demonstrations, class activities, etc. for each session.</div>
    <div id="sessionsWrap"></div>
    <label>Grading Opportunities</label>
    <div class="fhint">At least 5, but add more if needed. Include the assignment title, its weight toward the final grade, a brief explanation, and the course outcome it is designed to measure.</div>
    ${!ccOutcomes.length ? `<div class="sow-note" style="margin-top:6px;">This course has no learning outcomes yet. Add them in Course Content (VI) so each grading opportunity can be linked to the outcome it measures.</div>` : ''}
    ${unlinked ? `<div class="sow-note" style="margin-top:6px;" id="unlinkedNote">${unlinked} grading opportunit${unlinked===1?'y does':'ies do'} not have a course outcome selected yet. Each grading opportunity needs to measure a course outcome.</div>` : ''}
    <div id="gradingWrap"></div>
    <div class="row-actions"><button class="btn small ghost" id="addGrading">+ Add grading opportunity</button></div>`;

  const sessionsWrap = detail.querySelector('#sessionsWrap');
  e.sessions.forEach((s,i)=>{
    const row = document.createElement('div');
    row.style.cssText='display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;';
    row.innerHTML = `<div style="flex:0 0 70px;padding-top:9px;font-size:13px;font-weight:700;color:var(--navy);">Session ${i+1}</div>
      <textarea style="flex:1;min-height:44px;" data-session="${i}">${esc(s.content)}</textarea>`;
    row.querySelector('textarea').addEventListener('input', (ev)=>{ e.sessions[i].content = ev.target.value; saveDeliverable(prog.id,'syllabus',data); });
    sessionsWrap.appendChild(row);
  });

  const gradingWrap = detail.querySelector('#gradingWrap');
  gradingWrap._rerender = ()=>renderTab(prog);
  buildTable(gradingWrap, e.grading, [
    {key:'title',label:'Assignment Title'},{key:'weight',label:'Weight (% of final grade)'},
    {key:'explanation',label:'Brief Explanation',type:'textarea'},
    {key:'outcome',label:'Course Outcome Measured',type:'select',
      options: row=>['', ...outcomeOptions, ...(row.outcome && !outcomeOptions.includes(row.outcome) ? [row.outcome] : [])],
      optionLabel: v=>!v ? 'Select an outcome' : (v.length > 70 ? v.slice(0,67) + '...' : v)}
  ], ()=>saveDeliverable(prog.id,'syllabus',data));
  gradingWrap.querySelectorAll('select').forEach(sel=>sel.addEventListener('change', ()=>setTimeout(()=>renderTab(prog), 50)));
  detail.querySelector('#addGrading').addEventListener('click', ()=>{
    e.grading.push({title:'',weight:'',explanation:'',outcome:''});
    saveDeliverable(prog.id,'syllabus',data).then(()=>renderTab(prog));
  });

  wireExport(body, ()=>{
    const html = `<h1>Deliverable X: Syllabus Planning — ${esc(prog.programName)}</h1>
      ${courses.map(c=>{
        const k = courseKeyOf(c); const ce = data.entries[k];
        if(!ce) return `<h2>${esc(courseLabelOf(c))}</h2><p><i>Not yet planned</i></p>`;
        return `<h2>${esc(courseLabelOf(c))}</h2>
          <h3 style="font-size:11pt;">Class Sessions</h3>
          <table><tr><th>#</th><th>Content</th></tr>${(ce.sessions||[]).map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.content)}</td></tr>`).join('')}</table>
          <h3 style="font-size:11pt;">Grading Opportunities</h3>
          <table><tr><th>Assignment</th><th>Weight</th><th>Explanation</th><th>Outcome Measured</th></tr>${(ce.grading||[]).map(g=>`<tr><td>${esc(g.title)}</td><td>${esc(g.weight)}</td><td>${esc(g.explanation)}</td><td>${esc(g.outcome||'Not selected')}</td></tr>`).join('')}</table>`;
      }).join('')}`;
    downloadWordDoc(`${prog.programName}_Deliverable_X_Syllabus_Planning`, html);
  });
};

// ---------- Scope of Work tab ----------
async function renderSowTab(prog, body){
  const sow = await loadDeliverable(sowStorageId(prog), 'sow');
  const complete = sowIsComplete(sow);
  const groupTracks = sowGroupTracks(prog);
  const levelLabel = degreeLevelOf(prog)==='grad' ? 'graduate' : 'undergraduate';
  const groupNote = groupTracks.length>1
    ? ` One upload covers this whole ${levelLabel} level — ${groupTracks.map(p=>esc(p.trackLabel||p.programName)).join(', ')} all share what's on file here.`
    : '';

  if(!complete){
    body.innerHTML = `<div class="card">
      <h2>Scope of Work Agreement</h2>
      <div class="desc">This is the gateway to the ten deliverables below. Your Senior Assessment and Curriculum Specialist prepares and signs the Scope of Work document outside this tool — once it's signed, upload the PDF here. The deliverables unlock automatically the moment it's on file.${groupNote}</div>
      <div class="flowhint">Not uploaded yet. The ten deliverables stay locked until a signed PDF is uploaded.</div>
      <div class="field" style="margin-top:6px;">
        <label>Uploaded by</label>
        <input type="text" id="sowUploaderName" placeholder="Your name">
      </div>
      <div class="field">
        <label>Signed Scope of Work (PDF)</label>
        <input type="file" id="sowFileInput" accept="application/pdf">
      </div>
      <div class="row-actions"><button class="btn gold" id="sowUploadBtn">Upload &amp; Lock</button></div>
    </div>`;
    body.querySelector('#sowUploadBtn').addEventListener('click', async ()=>{
      const nameInput = body.querySelector('#sowUploaderName');
      const fileInput = body.querySelector('#sowFileInput');
      const file = fileInput.files[0];
      if(!file){ uiAlert('Choose a PDF first.'); return; }
      if(file.type && file.type !== 'application/pdf'){ uiAlert('Please upload a PDF file.'); return; }
      if(file.size > 4.5 * 1024 * 1024){ uiAlert('This PDF is too large to store here (must be under about 4.5 MB). Try compressing it, or ask your Senior Assessment and Curriculum Specialist for a smaller export.'); return; }
      const btn = body.querySelector('#sowUploadBtn');
      btn.disabled = true; btn.textContent = 'Uploading…';
      let fileData;
      try{ fileData = await readFileAsDataURL(file); }
      catch(e){
        uiAlert('Could not read that file. Make sure it is a PDF that opens normally, then try again.');
        btn.disabled = false; btn.textContent = 'Upload & Lock';
        return;
      }
      const payload = {
        fileName: file.name,
        fileData,
        uploadedBy: nameInput.value.trim(),
        uploadedAt: Date.now(),
        addenda: (sow && sow.addenda) || []
      };
      const saved = await saveDeliverable(sowStorageId(prog), 'sow', payload);
      if(!saved){
        await uiAlert('The PDF was read, but saving it to storage failed. Claude\'s preview often refuses saves, and it also limits how large a saved file can be. The deliverables are unlocked for now, but the agreement will need to be uploaded again after this page is closed. On the hosted Curriculum Studio site the upload is saved permanently.');
      }
      renderSowTab(prog, body);
    });
    return;
  }

  // Locked view: the uploaded document plus the addenda log.
  const uploadedWhen = sow.uploadedAt ? new Date(sow.uploadedAt).toLocaleString() : '';
  body.innerHTML = `<div class="card">
    <h2>Scope of Work Agreement</h2>
    <div class="desc">${groupNote || 'This is the gateway to the ten deliverables below.'}</div>
    <div class="flowhint"><b>Uploaded and locked.</b> The ten deliverables below are unlocked. Any change needed now goes in Addenda below rather than replacing this document.</div>
    <div style="border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div>
        <div style="font-weight:600;">${esc(sow.fileName || 'Scope of Work.pdf')}</div>
        <div style="font-size:13px;color:var(--muted);">${sow.uploadedBy ? `Uploaded by ${esc(sow.uploadedBy)}` : 'Uploaded'}${uploadedWhen ? ' · ' + esc(uploadedWhen) : ''}</div>
      </div>
      <button class="btn gold" id="sowViewBtn">View / Download PDF</button>
    </div>

    <h2 style="margin-top:24px;">Addenda</h2>
    <div class="desc">Log any change needed after the fact here — dated and attributed — without altering the uploaded document itself.</div>
    <div id="addendaList" style="margin:10px 0;"></div>
    <div class="field">
      <label>Add an addendum</label>
      <div class="row2">
        <input type="text" id="addendumAuthor" placeholder="Name">
        <input type="date" id="addendumDate">
      </div>
      <textarea id="addendumText" rows="3" placeholder="Describe the change..." style="margin-top:8px;"></textarea>
      <div class="row-actions"><button class="btn gold" id="addAddendumBtn">Add Addendum</button></div>
    </div>
  </div>`;

  body.querySelector('#sowViewBtn').addEventListener('click', ()=>{
    try{
      const blob = dataURLtoBlob(sow.fileData);
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }catch(e){ uiAlert('Could not open this file.'); }
  });

  const addenda = sow.addenda || [];
  const listEl = body.querySelector('#addendaList');
  listEl.innerHTML = addenda.length ? addenda.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).map(a=>`
    <div style="border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;">
      <div style="font-weight:600;">${esc(a.author)}${a.date? ' — ' + esc(a.date) : ''}</div>
      <div style="margin-top:4px;white-space:pre-wrap;">${esc(a.text)}</div>
    </div>`).join('') : `<div class="empty">No addenda yet.</div>`;

  body.querySelector('#addAddendumBtn').addEventListener('click', async ()=>{
    const author = body.querySelector('#addendumAuthor').value.trim();
    const date = body.querySelector('#addendumDate').value;
    const text = body.querySelector('#addendumText').value.trim();
    if(!author || !text){ uiAlert('Add a name and a description first.'); return; }
    sow.addenda = sow.addenda || [];
    sow.addenda.push({id: uid(), author, date, text, ts: Date.now()});
    await saveDeliverable(sowStorageId(prog), 'sow', sow);
    renderSowTab(prog, body);
  });
}

// ---------- Feedback tab ----------
// One dialog thread per program, reachable from anywhere within that
// program's workspace (the SOW gate and every deliverable), so the
// department and their assigned Senior Assessment and Curriculum
// Specialist have a running place to talk without leaving the tool.
async function renderFeedbackTab(prog, body){
  const data = await getData(prog.id, 'feedback', {messages: []});
  const sorted = [...data.messages].sort((a,b)=>(a.ts||0)-(b.ts||0));
  body.innerHTML = `<div class="card">
    <h2>Feedback</h2>
    <div class="desc">Dialog between the department and the assigned Senior Assessment and Curriculum Specialist about this program's revision. Visible to everyone with this tool open.</div>
    <div id="feedbackThread" style="margin:14px 0;"></div>
    <div style="border-top:1px solid #d9d5cb;padding-top:12px;margin-top:6px;">
      <div class="row2">
        <div><label>Your name</label><input type="text" id="fbName" placeholder="e.g. Jordan Reyes"/></div>
        <div><label>Role</label>
          <select id="fbRole">
            <option value="Department">Department</option>
            <option value="Senior Assessment and Curriculum Specialist">Senior Assessment and Curriculum Specialist</option>
          </select>
        </div>
      </div>
      <label>Message</label>
      <textarea id="fbText" rows="3" placeholder="Add a note or question..."></textarea>
      <div class="row-actions"><button class="btn gold" id="fbPost">Post</button></div>
    </div>
  </div>`;
  const thread = body.querySelector('#feedbackThread');
  if(!sorted.length){
    thread.innerHTML = `<div class="empty">No messages yet.</div>`;
  } else {
    thread.innerHTML = sorted.map(m=>`<div style="border:1px solid #d9d5cb;border-radius:6px;padding:10px 12px;margin-bottom:8px;background:#fffdf8;">
      <div style="font-weight:600;">${esc(m.author||'Unknown')} <span style="font-weight:400;color:#8a7f68;">— ${esc(m.role||'')} · ${m.ts? new Date(m.ts).toLocaleString():''}</span></div>
      <div style="margin-top:4px;white-space:pre-wrap;">${esc(m.text)}</div>
    </div>`).join('');
  }
  body.querySelector('#fbPost').addEventListener('click', async ()=>{
    const name = body.querySelector('#fbName').value.trim();
    const role = body.querySelector('#fbRole').value;
    const text = body.querySelector('#fbText').value.trim();
    if(!name || !text) return;
    data.messages.push({id: uid(), author: name, role, text, ts: Date.now()});
    await saveDeliverable(prog.id, 'feedback', data);
    renderFeedbackTab(prog, body);
  });
}

// ---------- shared field helpers ----------
function field(labelText, key, val, big, hint){
  return `<label>${labelText}</label>${hint? `<div class="fhint">${esc(hint)}</div>`:''}${big? `<textarea data-field="${key}">${esc(val)}</textarea>` : `<input type="text" data-field="${key}" value="${(val||'').toString().replace(/"/g,'&quot;')}"/>`}`;
}
function sectionHint(text){
  return `<div class="shint">${esc(text)}</div>`;
}
function toolbar(){
  return `<div class="row-actions"><button class="btn gold" data-export>Download as Word</button></div>`;
}
function wireFields(body, data, onSave){
  body.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('input', ()=>{ data[el.dataset.field]=el.value; onSave(); });
  });
}
function wireExport(body, fn){
  body.querySelector('[data-export]')?.addEventListener('click', fn);
}

// ---------- init ----------
(async function init(){
  state.view = 'home';
  state.profile = {preparedBy: lsGet(NAME_KEY) || ''};
  await resumeSession();
  render();
})();
</script>
</body>
</html>
