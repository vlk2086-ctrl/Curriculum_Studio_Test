    return;
  }
  if(data.selected && !courses.find(c=>courseKeyOf(c)===data.selected)) data.selected='';

  body.innerHTML = `<div class="card">
    <h2>Syllabus Planning</h2>
    <div class="desc">Syllabus Planning is only needed for courses the department has designated as <b>New Course</b> on the Sequenced Stick Figure (Deliverable IV). For each new course, plan out 20 class sessions (lecture topics, planned demonstrations, class activities) and at least 5 grading opportunities, each with a weight toward the final grade.</div>
    <div class="flowhint">This list is the "New Course" subset of Deliverable IV's course list, automatically. Need to fix a course's name or number? Edit it right here — it updates the Stick Figure and every other tab too.</div>
    <label>New courses needing syllabus content</label>
    <div id="sylList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;"></div>
    <div id="sylDetail"></div>
    ${data.selected ? toolbar() : ''}
  </div>`;

  const list = body.querySelector('#sylList');
  courses.forEach(c=>{
    const key = courseKeyOf(c);
    const btn = document.createElement('button');
    btn.className = 'btn small ' + (data.selected===key ? '' : 'ghost');
    btn.textContent = courseLabelOf(c) || '(untitled course)';
    btn.addEventListener('click', ()=>{ data.selected = key; saveDeliverable(prog.id,'syllabus',data).then(()=>renderTab(prog)); });
    list.appendChild(btn);
  });

  const detail = body.querySelector('#sylDetail');
  const selectedCourse = courses.find(c=>courseKeyOf(c)===data.selected);
  if(!selectedCourse){
    detail.innerHTML = `<div class="empty">Click a course above to plan its syllabus.</div>`;
    return;
  }
  const key = data.selected;
  if(!data.entries[key]) data.entries[key] = {};
  const e = data.entries[key];
  if(!e.sessions || e.sessions.length!==20) e.sessions = Array.from({length:20}, (_,i)=> (e.sessions && e.sessions[i]) || {content:''});
  if(!e.grading || !e.grading.length) e.grading = Array.from({length:5}, ()=>({title:'',weight:'',explanation:'',outcome:''}));
  // Reference: course info from IV, description and outcomes from VI.
  const cc = Object.assign({}, (ccData.entries||{})[key] || {});
  const ccOutcomes = filledOutcomes(outcomeListFrom(cc, 'outcomeList', 'outcomes', 0));
  const outcomeLabel = (o,i)=>`Outcome ${i+1}: ${o.text}`;
  const outcomeOptions = ccOutcomes.map(outcomeLabel);
  const unlinked = e.grading.filter(g=>(str(g.title).trim() || str(g.explanation).trim()) && !g.outcome).length;

  detail.innerHTML = `<div class="ref-box">
      <h4>For reference: ${esc(courseLabelOf(selectedCourse))}</h4>
      <table class="sf-auto">
        <tr><th style="width:170px;">Prerequisites (IV)</th><td>${esc(selectedCourse.prereqs || 'None')}</td></tr>
        <tr><th>Course summary (IV)</th><td>${esc(selectedCourse.summary || 'Not entered yet')}</td></tr>
        <tr><th>Course description (VI)</th><td>${esc(cc.description || 'Not entered yet in Course Content')}</td></tr>
        <tr><th>Learning outcomes (VI)</th><td>${ccOutcomes.length ? `<ol style="margin:0;padding-left:20px;">${ccOutcomes.map(o=>`<li>${esc(o.text)}${o.pillar ? ` <span style="color:#6b7280;">(Pillar: ${esc(o.pillar)})</span>` : ''}</li>`).join('')}</ol>` : 'Not entered yet in Course Content'}</td></tr>
      </table>
    </div>
    <label>Class Sessions (20)</label>
    <div class="fhint">Lecture topics, planned demonstrations, class activities, etc. for each session.</div>
    <div id="sessionsWrap"></div>
    <label>Grading Opportunities</label>
    <div class="fhint">At least 5, but add more if needed. Include the assignment title, its weight toward the final grade, a brief explanation, and the course outcome it is designed to measure.</div>
    ${!ccOutcomes.length ? `<div class="sow-note" style="margin-top:6px;">This course has no learning outcomes yet. Add them in Course Content (VI) so each grading opportunity can be linked to the outcome it measures.</div>` : ''}
    ${unlinked ? `<div class="sow-note" style="margin-top:6px;" id="unlinkedNote">${unlinked} grading opportunit${unlinked===1?'y does':'ies do'} not have a course outcome selected yet. Each grading opportunity needs to measure a course outcome.</div>` : ''}
    <div id="gradingWrap"></div>
    <div class="row-actions"><button class="btn small ghost" id="addGrading">+ Add grading opportunity</button></div>`;

  const sessionsWrap = detail.querySelector('#sessionsWrap');
  e.sessions.forEach((s,i)=>{
    const row = document.createElement('div');
    row.style.cssText='display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;';
    row.innerHTML = `<div style="flex:0 0 70px;padding-top:9px;font-size:13px;font-weight:700;color:var(--navy);">Session ${i+1}</div>
      <textarea style="flex:1;min-height:44px;" data-session="${i}">${esc(s.content)}</textarea>`;
    row.querySelector('textarea').addEventListener('input', (ev)=>{ e.sessions[i].content = ev.target.value; saveDeliverable(prog.id,'syllabus',data); });
    sessionsWrap.appendChild(row);
  });

  const gradingWrap = detail.querySelector('#gradingWrap');
  gradingWrap._rerender = ()=>renderTab(prog);
  buildTable(gradingWrap, e.grading, [
    {key:'title',label:'Assignment Title'},{key:'weight',label:'Weight (% of final grade)'},
    {key:'explanation',label:'Brief Explanation',type:'textarea'},
    {key:'outcome',label:'Course Outcome Measured',type:'select',
      options: row=>['', ...outcomeOptions, ...(row.outcome && !outcomeOptions.includes(row.outcome) ? [row.outcome] : [])],
      optionLabel: v=>!v ? 'Select an outcome' : (v.length > 70 ? v.slice(0,67) + '...' : v)}
  ], ()=>saveDeliverable(prog.id,'syllabus',data));
  gradingWrap.querySelectorAll('select').forEach(sel=>sel.addEventListener('change', ()=>setTimeout(()=>renderTab(prog), 50)));
  detail.querySelector('#addGrading').addEventListener('click', ()=>{
    e.grading.push({title:'',weight:'',explanation:'',outcome:''});
    saveDeliverable(prog.id,'syllabus',data).then(()=>renderTab(prog));
  });

  wireExport(body, ()=>{
    const html = `<h1>Deliverable X: Syllabus Planning — ${esc(prog.programName)}</h1>
      ${courses.map(c=>{
        const k = courseKeyOf(c); const ce = data.entries[k];
        if(!ce) return `<h2>${esc(courseLabelOf(c))}</h2><p><i>Not yet planned</i></p>`;
        return `<h2>${esc(courseLabelOf(c))}</h2>
          <h3 style="font-size:11pt;">Class Sessions</h3>
          <table><tr><th>#</th><th>Content</th></tr>${(ce.sessions||[]).map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.content)}</td></tr>`).join('')}</table>
          <h3 style="font-size:11pt;">Grading Opportunities</h3>
          <table><tr><th>Assignment</th><th>Weight</th><th>Explanation</th><th>Outcome Measured</th></tr>${(ce.grading||[]).map(g=>`<tr><td>${esc(g.title)}</td><td>${esc(g.weight)}</td><td>${esc(g.explanation)}</td><td>${esc(g.outcome||'Not selected')}</td></tr>`).join('')}</table>`;
      }).join('')}`;
    downloadWordDoc(`${prog.programName}_Deliverable_X_Syllabus_Planning`, html);
  });
};

// ---------- Scope of Work tab ----------
async function renderSowTab(prog, body){
  const sow = await loadDeliverable(sowStorageId(prog), 'sow');
  const complete = sowIsComplete(sow);
  const groupTracks = sowGroupTracks(prog);
  const levelLabel = degreeLevelOf(prog)==='grad' ? 'graduate' : 'undergraduate';
  const groupNote = groupTracks.length>1
    ? ` One upload covers this whole ${levelLabel} level — ${groupTracks.map(p=>esc(p.trackLabel||p.programName)).join(', ')} all share what's on file here.`
    : '';

  if(!complete){
    body.innerHTML = `<div class="card">
      <h2>Scope of Work Agreement</h2>
      <div class="desc">This is the gateway to the ten deliverables below. Your Senior Assessment and Curriculum Specialist prepares and signs the Scope of Work document outside this tool — once it's signed, upload the PDF here. The deliverables unlock automatically the moment it's on file.${groupNote}</div>
      <div class="flowhint">Not uploaded yet. The ten deliverables stay locked until a signed PDF is uploaded.</div>
      <div class="field" style="margin-top:6px;">
        <label>Uploaded by</label>
        <input type="text" id="sowUploaderName" placeholder="Your name">
      </div>
      <div class="field">
        <label>Signed Scope of Work (PDF)</label>
        <input type="file" id="sowFileInput" accept="application/pdf">
      </div>
      <div class="row-actions"><button class="btn gold" id="sowUploadBtn">Upload &amp; Lock</button></div>
    </div>`;
    body.querySelector('#sowUploadBtn').addEventListener('click', async ()=>{
      const nameInput = body.querySelector('#sowUploaderName');
      const fileInput = body.querySelector('#sowFileInput');
      const file = fileInput.files[0];
      if(!file){ uiAlert('Choose a PDF first.'); return; }
      if(file.type && file.type !== 'application/pdf'){ uiAlert('Please upload a PDF file.'); return; }
      if(file.size > 4.5 * 1024 * 1024){ uiAlert('This PDF is too large to store here (must be under about 4.5 MB). Try compressing it, or ask your Senior Assessment and Curriculum Specialist for a smaller export.'); return; }
      const btn = body.querySelector('#sowUploadBtn');
      btn.disabled = true; btn.textContent = 'Uploading…';
      let fileData;
      try{ fileData = await readFileAsDataURL(file); }
      catch(e){
        uiAlert('Could not read that file. Make sure it is a PDF that opens normally, then try again.');
        btn.disabled = false; btn.textContent = 'Upload & Lock';
        return;
      }
      const payload = {
        fileName: file.name,
        fileData,
        uploadedBy: nameInput.value.trim(),
        uploadedAt: Date.now(),
        addenda: (sow && sow.addenda) || []
      };
      const saved = await saveDeliverable(sowStorageId(prog), 'sow', payload);
      if(!saved){
        await uiAlert('The PDF was read, but saving it to storage failed. Claude\'s preview often refuses saves, and it also limits how large a saved file can be. The deliverables are unlocked for now, but the agreement will need to be uploaded again after this page is closed. On the hosted Curriculum Studio site the upload is saved permanently.');
      }
      renderSowTab(prog, body);
    });
    return;
  }

  // Locked view: the uploaded document plus the addenda log.
  const uploadedWhen = sow.uploadedAt ? new Date(sow.uploadedAt).toLocaleString() : '';
  body.innerHTML = `<div class="card">
    <h2>Scope of Work Agreement</h2>
    <div class="desc">${groupNote || 'This is the gateway to the ten deliverables below.'}</div>
    <div class="flowhint"><b>Uploaded and locked.</b> The ten deliverables below are unlocked. Any change needed now goes in Addenda below rather than replacing this document.</div>
    <div style="border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div>
        <div style="font-weight:600;">${esc(sow.fileName || 'Scope of Work.pdf')}</div>
        <div style="font-size:13px;color:var(--muted);">${sow.uploadedBy ? `Uploaded by ${esc(sow.uploadedBy)}` : 'Uploaded'}${uploadedWhen ? ' · ' + esc(uploadedWhen) : ''}</div>
      </div>
      <button class="btn gold" id="sowViewBtn">View / Download PDF</button>
    </div>

    <h2 style="margin-top:24px;">Addenda</h2>
    <div class="desc">Log any change needed after the fact here — dated and attributed — without altering the uploaded document itself.</div>
    <div id="addendaList" style="margin:10px 0;"></div>
    <div class="field">
      <label>Add an addendum</label>
      <div class="row2">
        <input type="text" id="addendumAuthor" placeholder="Name">
        <input type="date" id="addendumDate">
      </div>
      <textarea id="addendumText" rows="3" placeholder="Describe the change..." style="margin-top:8px;"></textarea>
      <div class="row-actions"><button class="btn gold" id="addAddendumBtn">Add Addendum</button></div>
    </div>
  </div>`;

  body.querySelector('#sowViewBtn').addEventListener('click', ()=>{
    try{
      const blob = dataURLtoBlob(sow.fileData);
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }catch(e){ uiAlert('Could not open this file.'); }
  });

  const addenda = sow.addenda || [];
  const listEl = body.querySelector('#addendaList');
  listEl.innerHTML = addenda.length ? addenda.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).map(a=>`
    <div style="border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;">
      <div style="font-weight:600;">${esc(a.author)}${a.date? ' — ' + esc(a.date) : ''}</div>
      <div style="margin-top:4px;white-space:pre-wrap;">${esc(a.text)}</div>
    </div>`).join('') : `<div class="empty">No addenda yet.</div>`;

  body.querySelector('#addAddendumBtn').addEventListener('click', async ()=>{
    const author = body.querySelector('#addendumAuthor').value.trim();
    const date = body.querySelector('#addendumDate').value;
    const text = body.querySelector('#addendumText').value.trim();
    if(!author || !text){ uiAlert('Add a name and a description first.'); return; }
    sow.addenda = sow.addenda || [];
    sow.addenda.push({id: uid(), author, date, text, ts: Date.now()});
    await saveDeliverable(sowStorageId(prog), 'sow', sow);
    renderSowTab(prog, body);
  });
}

// ---------- Feedback tab ----------
// One dialog thread per program, reachable from anywhere within that
// program's workspace (the SOW gate and every deliverable), so the
// department and their assigned Senior Assessment and Curriculum
// Specialist have a running place to talk without leaving the tool.
async function renderFeedbackTab(prog, body){
  const data = await getData(prog.id, 'feedback', {messages: []});
  const sorted = [...data.messages].sort((a,b)=>(a.ts||0)-(b.ts||0));
  body.innerHTML = `<div class="card">
    <h2>Feedback</h2>
    <div class="desc">Dialog between the department and the assigned Senior Assessment and Curriculum Specialist about this program's revision. Visible to everyone with this tool open.</div>
    <div id="feedbackThread" style="margin:14px 0;"></div>
    <div style="border-top:1px solid #d9d5cb;padding-top:12px;margin-top:6px;">
      <div class="row2">
        <div><label>Your name</label><input type="text" id="fbName" placeholder="e.g. Jordan Reyes"/></div>
        <div><label>Role</label>
          <select id="fbRole">
            <option value="Department">Department</option>
            <option value="Senior Assessment and Curriculum Specialist">Senior Assessment and Curriculum Specialist</option>
          </select>
        </div>
      </div>
      <label>Message</label>
      <textarea id="fbText" rows="3" placeholder="Add a note or question..."></textarea>
      <div class="row-actions"><button class="btn gold" id="fbPost">Post</button></div>
    </div>
  </div>`;
  const thread = body.querySelector('#feedbackThread');
  if(!sorted.length){
    thread.innerHTML = `<div class="empty">No messages yet.</div>`;
  } else {
    thread.innerHTML = sorted.map(m=>`<div style="border:1px solid #d9d5cb;border-radius:6px;padding:10px 12px;margin-bottom:8px;background:#fffdf8;">
      <div style="font-weight:600;">${esc(m.author||'Unknown')} <span style="font-weight:400;color:#8a7f68;">— ${esc(m.role||'')} · ${m.ts? new Date(m.ts).toLocaleString():''}</span></div>
      <div style="margin-top:4px;white-space:pre-wrap;">${esc(m.text)}</div>
    </div>`).join('');
  }
  body.querySelector('#fbPost').addEventListener('click', async ()=>{
    const name = body.querySelector('#fbName').value.trim();
    const role = body.querySelector('#fbRole').value;
    const text = body.querySelector('#fbText').value.trim();
    if(!name || !text) return;
    data.messages.push({id: uid(), author: name, role, text, ts: Date.now()});
    await saveDeliverable(prog.id, 'feedback', data);
    renderFeedbackTab(prog, body);
  });
}

// ---------- shared field helpers ----------
function field(labelText, key, val, big, hint){
  return `<label>${labelText}</label>${hint? `<div class="fhint">${esc(hint)}</div>`:''}${big? `<textarea data-field="${key}">${esc(val)}</textarea>` : `<input type="text" data-field="${key}" value="${(val||'').toString().replace(/"/g,'&quot;')}"/>`}`;
}
function sectionHint(text){
  return `<div class="shint">${esc(text)}</div>`;
}
function toolbar(){
  return `<div class="row-actions"><button class="btn gold" data-export>Download as Word</button></div>`;
}
function wireFields(body, data, onSave){
  body.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('input', ()=>{ data[el.dataset.field]=el.value; onSave(); });
  });
}
function wireExport(body, fn){
  body.querySelector('[data-export]')?.addEventListener('click', fn);
}

// ---------- init ----------
(async function init(){
  await loadPrograms();
  // Seed only when storage confirmed there's no list, never after a failed read.
  // Also fills in any starter programs still missing after recovery when the saved list came back empty.
  // No seeding needed: built-in programs are always shown (see BUILT_IN_PROGRAMS).
  render();
})();

// Re-pull the program list whenever this tab comes back into focus. Left-
// open tabs are the other half of the "drift" problem: mutateProgramList
// protects every write, but a tab that's been sitting idle for a while is
// still showing an old snapshot until its next edit. Refreshing on focus
// keeps the rail honest without requiring a manual reload.
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState === 'visible'){
    await loadPrograms();
    render();
  }
});
</script>
