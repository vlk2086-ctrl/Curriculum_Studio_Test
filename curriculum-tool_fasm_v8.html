  programs: [],           // [{id, programName, familyId, familyName, trackLabel, degreeType, degreeLevel, updatedAt}]
  activeProgram: null,
  activeTab: null,        // null = show program landing page
  data: {},               // programId -> deliverableKey -> payload
  status: '',
  showBulkAdd: false
};

function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

const PROGRAM_INDEX_KEY = 'program-index';

// ---------- Program list: safe reads, self-repair, guarded writes ----------
// Why programs kept migrating out of their major/degree pairing (all fixed
// below and in the embedded Stick Figure tool):
//  1. The embedded Stick Figure tool (Deliverable IV) rewrote this program's
//     entry in the shared program-index on EVERY render (every course edit,
//     and simply opening the tab), replacing it with a summary that had no
//     familyId, familyName or trackLabel. The rail groups by familyId, so
//     every stripped program landed together under "(unnamed major)", showing
//     its full name instead of its degree. Their shared familyId (undefined)
//     also made them share one Scope of Work record and offer each other's
//     courses as "sibling" copies.
//  2. That same write was a stale read-modify-write of the whole index, so it
//     could also undo rail edits made in the meantime (renames, removals,
//     newly added degree levels) and bring removed programs back.
//  3. "Edit Program Info" inside the Stick Figure could change a program's
//     name or degree, which then overwrote the rail's name.
//  4. If a storage read failed, the rail treated it as an empty list; the
//     starter-list seed then wrote a fresh list with new ids over everything.
//  5. Programs added with the Add box or bulk add ("Animation BFA") became a
//     brand-new major instead of joining the existing one.
//  6. Earlier bugs left some majors split under two different familyIds.
// repairProgramList() heals 1, 5 and 6 on every load and before every write,
// so even an entry damaged by an old copy of this file still open somewhere
// is put back the next time anyone loads this version.
const DEGREE_TOKENS = ['BA','BFA','BDES','MA','MFA','MBI','MARCH'];
function str(v){ return (v===undefined || v===null) ? '' : String(v); }
function normKey(s){ return str(s).trim().replace(/\s+/g,' ').toLowerCase(); }
function splitProgramName(name){
  const clean = str(name).trim().replace(/\s+/g,' ');
  const m = clean.match(/^(.*\S)\s+([A-Za-z.]+)$/);
  if(m){
    const tok = m[2].replace(/\./g,'').toUpperCase();
    if(DEGREE_TOKENS.includes(tok)) return {familyName: m[1].trim(), trackLabel: tok};
  }
  return {familyName: clean, trackLabel: ''};
}
function isRealFamilyId(id){ return !!id && id !== 'undefined' && id !== 'null'; }

// Pure function: returns {list, changed, moves}. `moves` lists programs whose
// familyId changed from one real id to another (a split major being merged),
// so their Scope of Work record can follow them.
function repairProgramList(input){
  const original = JSON.stringify(input || []);
  const moves = [];
  // a. drop junk, de-duplicate ids (keep the copy that still has its pairing)
  const byId = new Map(); const order = [];
  (Array.isArray(input) ? input : []).forEach(raw=>{
    if(!raw || typeof raw !== 'object' || Array.isArray(raw) || !raw.id) return;
    raw = Object.assign({}, raw, {id: str(raw.id)});
    const p = Object.assign({}, raw);
    const prev = byId.get(p.id);
    if(!prev){ byId.set(p.id, p); order.push(p.id); return; }
    if(!isRealFamilyId(prev.familyId) && isRealFamilyId(p.familyId)) byId.set(p.id, Object.assign({}, prev, p));
  });
  const list = order.map(id=>byId.get(id));

  // b. recover familyName / trackLabel from the program name and degree
  list.forEach(p=>{
    p.programName = (str(p.programName).trim() || [str(p.familyName).trim(), str(p.trackLabel).trim()].filter(Boolean).join(' ') || 'Untitled program');
    let track = str(p.trackLabel).trim();
    let fam = str(p.familyName).trim();
    const dt = str(p.degreeType).trim().toUpperCase();
    const wasStripped = !track && !str(p.familyId).trim();
    const split = splitProgramName(p.programName);
    if(!track){
      if(split.trackLabel) track = split.trackLabel;
      else if(DEGREE_TOKENS.includes(dt)) track = dt;
      // a stand-alone program whose "major" was its whole name ("Acting BFA")
      if(track && (!fam || normKey(fam) === normKey(p.programName))) fam = split.trackLabel ? split.familyName : p.programName;
    }
    if(!fam){
      if(track && normKey(p.programName).endsWith(' ' + normKey(track))) fam = p.programName.slice(0, p.programName.length - track.length).trim();
      else fam = split.familyName || p.programName;
    }
    // One-time data fix, limited to entries the old Stick Figure damaged:
    // Fashion Marketing and Management was mislabeled MFA there, and it is a
    // BFA. A deliberately added FMM MFA keeps its label (it has a trackLabel).
    if(wasStripped && normKey(fam)===normKey('Fashion Marketing and Management') && track==='MFA') track = 'BFA';
    p.trackLabel = track;
    p.familyName = fam;
  });

  // c. one familyId per major name (merges split majors, re-pairs stripped ones)
  const groups = new Map();
  list.forEach(p=>{
    const k = normKey(p.familyName);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  });
  groups.forEach(members=>{
    const counts = new Map();
    members.forEach(p=>{ if(isRealFamilyId(p.familyId)) counts.set(p.familyId, (counts.get(p.familyId)||0) + 1); });
    let winner = null, best = 0;
    counts.forEach((n,id)=>{ if(n > best){ best = n; winner = id; } });
    if(!winner) winner = uid();
    const namer = members.find(p=>p.familyId === winner) || members[0];
    const displayName = namer.familyName;
    members.forEach(p=>{
      if(p.familyId !== winner){
        if(isRealFamilyId(p.familyId)) moves.push({from: p.familyId, to: winner, level: degreeLevelOf(p)});
        p.familyId = winner;
      }
      p.familyName = displayName;
      p.programName = `${displayName} ${p.trackLabel}`.trim();
    });
  });

  return {list, changed: JSON.stringify(list) !== original, moves};
}

// Distinguishes "no list saved yet" from "couldn't read it". Only the first
// is ever allowed to lead to a write.
// Stored values are JSON text; tolerate values that come back already parsed
// or double-encoded.
function parseStoredList(v){
  let x = v;
  for(let i=0; i<2 && typeof x === 'string'; i++) x = JSON.parse(x);
  if(!Array.isArray(x)) throw new Error('Saved program list is not a list (got ' + (x===null ? 'null' : typeof x) + ')');
  return x;
}
async function readIndexFrom(store){
  let res;
  try{ res = await store.get(PROGRAM_INDEX_KEY, true); }
  catch(e){
    // Claude's built-in artifact storage throws "Key not found" for a key
    // that has never been saved. That means empty, not broken.
    if(/not found/i.test((e && e.message) || String(e))) return {status:'missing', list:[]};
    // Some storage backends throw for a key that doesn't exist yet; confirm
    // with list() before treating it as missing rather than broken.
    let listed = null;
    try{ listed = await store.list(PROGRAM_INDEX_KEY, true); }catch(e2){}
    if(listed && Array.isArray(listed.keys) && !listed.keys.map(String).includes(PROGRAM_INDEX_KEY)) return {status:'missing', list:[]};
    return {status:'error', list:null, error: (e && e.message) || String(e)};
  }
  if(!res || res.value === undefined || res.value === null) return {status:'missing', list:[]};
  try{ return {status:'ok', list: parseStoredList(res.value)}; }
  catch(e){ return {status:'error', list:null, error: 'Could not read the saved list: ' + ((e && e.message) || e)}; }
}
const sleep = ms => new Promise(r=>setTimeout(r, ms));

// Distinguishes "no list saved yet" from "couldn't read it". Only the first
// is ever allowed to lead to a write. Retries a few times (a busy or rate-
// limited backend often succeeds a moment later), then, if the host's own
// storage keeps failing, tries Supabase directly and switches to it.
async function readProgramIndex(){
  let r;
  for(let attempt=0; attempt<3; attempt++){
    r = await readIndexFrom(window.storage);
    if(r.status !== 'error') return r;
    console.error('[Curriculum Studio] program list read failed (' + storageBackendName() + '), attempt ' + (attempt+1) + ':', r.error);
    await sleep(500 * (attempt+1));
  }
  const firstError = storageBackendName() + ': ' + r.error;
  if(window.storage !== window.__supabaseStorage && window.__supabaseStorage){
    const alt = await readIndexFrom(window.__supabaseStorage);
    if(alt.status === 'ok'){
      console.warn('[Curriculum Studio] switched to Supabase storage after: ' + firstError);
      window.storage = window.__supabaseStorage;
      state.storageNote = 'Loaded from Supabase because the built-in storage failed.';
      return alt;
    }
    return {status:'error', list:null, error: firstError + ' | Supabase: ' + (alt.error || alt.status)};
  }
  return {status:'error', list:null, error: firstError};
}

// Carries a merged major's Scope of Work record to its surviving familyId
// (only when the destination doesn't already have one).
async function migrateSowRecords(moves){
  const seen = new Set();
  for(const m of moves){
    const key = m.from + '>' + m.to + '>' + m.level;
    if(seen.has(key)) continue; seen.add(key);
    try{
      const src = await loadDeliverable('family:' + m.from + ':' + m.level, 'sow');
      if(!src) continue;
      const dest = await loadDeliverable('family:' + m.to + ':' + m.level, 'sow');
      if(dest) continue;
      await window.storage.set(`prog:family:${m.to}:${m.level}:sow`, JSON.stringify(src), true);
    }catch(e){}
  }
}

// ---------- Recovery: rebuild missing programs from what's still in storage ----------
// Removing a program (or any accident that shortens program-index) never
// deletes its deliverables: they stay under prog:<id>:..., and the Stick
// Figure keeps its own program:<id> record with the program's name and
// degree. This scans for those and puts back any program the list is
// missing, keeping its original id so all of its saved work reconnects.
const PROGRAM_INDEX_BACKUP_KEY = 'program-index-backup';
const PROGRAM_REMOVED_KEY = 'program-index-removed';


async function safeList(prefix){
  try{ const r = await window.storage.list(prefix, true); return (r && Array.isArray(r.keys)) ? r.keys.map(str).filter(k=>k.startsWith(prefix)) : null; }
  catch(e){ return null; }
}
async function safeGetJSON(key){
  try{ const r = await window.storage.get(key, true); return (r && r.value) ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}

// Returns {candidates:[entries], dataIds:Set, removed:Set} or null if storage can't be listed.
async function gatherRecoveryInfo(){
  const progKeys = await safeList('prog:');
  const recKeys = await safeList('program:');
  if(progKeys === null && recKeys === null) return null;
  const dataIds = new Set();
  (progKeys||[]).forEach(k=>{
    const id = k.split(':')[1] || '';
    if(id && id !== 'family' && id !== 'solo') dataIds.add(id);
  });
  const candidates = [];
  const named = new Set();
  const backup = await safeGetJSON(PROGRAM_INDEX_BACKUP_KEY);
  (Array.isArray(backup) ? backup : []).forEach(p=>{ if(p && p.id){ candidates.push(Object.assign({}, p)); named.add(str(p.id)); } });
  for(const k of (recKeys||[])){
    const id = k.slice('program:'.length);
    if(!id) continue;
    dataIds.add(id);
    if(named.has(id)) continue;
    const rec = await safeGetJSON(k);
    if(!rec || !str(rec.programName).trim()) continue;
    candidates.push({id, programName: str(rec.programName).trim(), degreeType: str(rec.degreeType), degreeLevel: str(rec.degreeLevel), updatedAt: Date.now()});
    named.add(id);
  }
  // Programs with saved deliverables but no name anywhere: keep them visible
  // rather than lose them. Each gets its own placeholder major to rename.
  let n = 0;
  dataIds.forEach(id=>{
    if(named.has(id)) return;
    n++;
    candidates.push({id, programName: `Recovered program ${n}`, familyName: `Recovered program ${n}`, trackLabel:'', recovered:true, updatedAt: Date.now()});
  });
  const removedList = await safeGetJSON(PROGRAM_REMOVED_KEY);
  const removed = new Set((Array.isArray(removedList) ? removedList : []).map(str));
  return {candidates, dataIds, removed};
}

// Pure: merges recovery candidates into `list`.
function applyRecovery(list, info){
  if(!info) return list;
  const hasData = id => info.dataIds.has(id);
  const present = new Set(list.map(p=>p.id));
  // Repair candidates on their own first so they carry familyName/trackLabel.
  const cands = repairProgramList(info.candidates).list;
  cands.forEach(c=>{
    if(present.has(c.id) || info.removed.has(c.id)) return;
    // If a same-name, same-degree entry exists with NO saved work (e.g. one
    // re-created by the starter list), the recovered original replaces it.
    const blankTwin = list.findIndex(p=>!hasData(p.id) && normKey(p.familyName)===normKey(c.familyName) && normKey(p.trackLabel)===normKey(c.trackLabel));
    const entry = {id:c.id, programName:c.programName, familyName:c.familyName, trackLabel:c.trackLabel, degreeType:'', degreeLevel:'', updatedAt: Date.now()};
    if(blankTwin >= 0){ entry.familyId = list[blankTwin].familyId; list.splice(blankTwin, 1, entry); }
    else list.push(entry);
    present.add(c.id);
  });
  return list;
}

// ---------- Built-in programs ----------
// These programs are part of the tool itself, so they appear in every copy
// (inside Claude or on GitHub Pages) whatever storage holds, and can't be
// removed, renamed or moved to another major from the rail. Each has a
// fixed id, so its saved deliverables always link back to it. If storage
// already has the same major and degree under an older id, that stored
// entry is used instead so its existing work stays connected.
// To change this list, edit it here.
const BUILT_IN_PROGRAMS = [
  {familyName:'2D Animation', tracks:['MA','MFA']},
  {familyName:'3D Animation', tracks:['MA','MFA']},
  {familyName:'Visual Effects', tracks:['MA','MFA']},
  {familyName:'Fashion Marketing and Management', tracks:['BFA']},
  {familyName:'Acting', tracks:['BFA']},
  {familyName:'Sound Design', tracks:['BFA']},
  {familyName:'Film and Television', tracks:['BFA']},
  {familyName:'Writing', tracks:['BFA','MFA']},
  {familyName:'Graphic Design', tracks:['BA','BFA']},
  {familyName:'Graphic Design and Visual Experience', tracks:['MA','MFA']},
];
function slugify(s){ return str(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function builtInEntries(){
  const out = [];
  BUILT_IN_PROGRAMS.forEach(f=>{
    f.tracks.forEach(t=>{
      out.push({id:'bi-' + slugify(f.familyName) + '-' + slugify(t), familyId:'bi-' + slugify(f.familyName),
        familyName:f.familyName, trackLabel:t, programName:`${f.familyName} ${t}`, degreeType:'', degreeLevel:''});
    });
  });
  return out;
}
function isBuiltInFamilyName(name){ return BUILT_IN_PROGRAMS.some(f=>normKey(f.familyName)===normKey(name)); }
function isBuiltInTrack(p){
  const f = BUILT_IN_PROGRAMS.find(f=>normKey(f.familyName)===normKey(p.familyName));
  return !!(f && f.tracks.some(t=>normKey(t)===normKey(p.trackLabel)));
}
// Majors replaced by others (Animation became 2D Animation and 3D Animation).
// Hidden from the menu; any saved work under them stays in storage.
const RETIRED_MAJORS = ['Animation'];
// Removes from the saved program list: entries for built-in programs (the
// file supplies those), retired majors, "Recovered program" placeholders, and
// extra degrees under a built-in major that weren't added in the Studio
// (they came in through the old recovery step, not from a person). Saved
// work under any removed entry is not deleted.
function cleanupStoredList(list){
  return (list || []).filter(p=>{
    if(!p || !p.id) return false;
    if(String(p.id).startsWith('bi-')) return false;
    if(RETIRED_MAJORS.some(r=>normKey(r)===normKey(p.familyName))) return false;
    if(/^recovered program \d+$/.test(normKey(p.familyName))) return false;
    if(isBuiltInFamilyName(p.familyName) && !isBuiltInTrack(p) && !p.addedInStudio) return false;
    return true;
  });
}

// Stored list + any built-in program it doesn't already have, in a stable
// order (built-in majors first, in the order above). Display only: the
// built-ins are never written into the stored list.
function withBuiltIns(stored){
  const out = cleanupStoredList(Array.isArray(stored) ? stored : []).map(p=>Object.assign({}, p));
  builtInEntries().forEach(b=>{
    if(out.some(p=>normKey(p.familyName)===normKey(b.familyName) && normKey(p.trackLabel)===normKey(b.trackLabel))) return;
    const fam = out.find(p=>normKey(p.familyName)===normKey(b.familyName));
    out.push(Object.assign({}, b, fam ? {familyId: fam.familyId, familyName: fam.familyName, programName: `${fam.familyName} ${b.trackLabel}`} : {}));
  });
  out.forEach(p=>{ p.builtIn = isBuiltInTrack(p); });
  const famRank = p=>{ const i = BUILT_IN_PROGRAMS.findIndex(f=>normKey(f.familyName)===normKey(p.familyName)); return i<0 ? 1000 : i; };
  const trackRank = p=>{ const f = BUILT_IN_PROGRAMS.find(f=>normKey(f.familyName)===normKey(p.familyName)); const i = f ? f.tracks.findIndex(t=>normKey(t)===normKey(p.trackLabel)) : -1; return i<0 ? 1000 : i; };
  return out.map((p,i)=>({p,i})).sort((a,b)=> (famRank(a.p)-famRank(b.p)) || (famRank(a.p)===1000 ? 0 : (trackRank(a.p)-trackRank(b.p))) || (a.i-b.i)).map(x=>x.p);
}

async function loadPrograms(){
  const r = await readProgramIndex();
  state.indexStatus = r.status;
  state.loadError = r.status === 'error' ? r.error : '';
  if(r.status === 'error'){
    // Keep whatever is on screen; never replace it with an empty list.
    state.status = "Couldn't reach shared storage, so the program list wasn't refreshed. Reload to try again.";
    if(!state.programs.length) state.programs = withBuiltIns([]); // built-ins always show
    return;
  }
  state.loadedEmpty = !r.list.length;
  let fixed;
  try{ fixed = repairProgramList(r.list); }
  catch(e){ state.programs = withBuiltIns(Array.isArray(r.list) ? r.list.filter(p=>p && p.id) : []); return; } // show as-is, write nothing
  state.programs = withBuiltIns(fixed.list);
  // Programs are written into this file now, so saved Stick Figure records are
  // no longer used to rebuild the menu (that re-added retired and unrelated
  // programs). Instead the saved list is cleaned; mutateProgramList writes
  // only if something actually changed.
  await mutateProgramList(cleanupStoredList);
  if(state.activeProgram && !state.programs.some(p=>p.id===state.activeProgram)){ state.activeProgram = null; state.activeTab = null; }
  // No program is selected automatically: the tool always opens on the main
  // Curriculum Studio page (process and announcements) until one is chosen.
}

// Every mutation to the program list (add, rename, remove, seed, repair)
// goes through here. It re-reads the shared list right before writing,
// repairs it, applies the change to THAT copy, repairs again (so new entries
// join their major), and writes once. If the re-read fails, nothing is
// written: saving a stale or empty local copy is what used to wipe or
// revert other people's changes.
async function mutateProgramList(mutator){
  const r = await readProgramIndex();
  if(r.status === 'error'){
    state.status = "Couldn't reach shared storage. That change wasn't saved, please try again.";
    render();
    return false;
  }
  const before = repairProgramList(r.list);
  let updated = before.list;
  if(mutator) updated = mutator(updated) || updated;
  const after = repairProgramList(updated);
  const prevJSON = JSON.stringify(r.list);
  const nextJSON = JSON.stringify(after.list);
  if(nextJSON === prevJSON){
    state.indexStatus = 'ok'; state.programs = withBuiltIns(after.list); render(); return true;
  }
  try{
    // Keep the previous version so any bad change can be undone.
    if(Array.isArray(r.list) && r.list.length) await window.storage.set(PROGRAM_INDEX_BACKUP_KEY, prevJSON, true);
    await window.storage.set(PROGRAM_INDEX_KEY, nextJSON, true);
  }catch(e){
    state.status = "Couldn't save to shared storage. That change wasn't saved, please try again.";
    render();
    return false;
  }
  state.indexStatus = 'ok';
  state.programs = withBuiltIns(after.list);
  const moves = before.moves.concat(after.moves);
  if(moves.length) await migrateSowRecords(moves);
  render();
  return true;
}

// Fetch the canonical course list from the Sequenced Stick Figure tool's
// own storage record, so every downstream deliverable stays in sync with it.
async function getCourses(progId){
  const prog = state.programs.find(p=>p.id===progId);
  await ensurePreloadedCourses(prog);
  // If the saved list isn't there (e.g. storage refused the save), use the
  // catalog requirements so every deliverable still sees the courses.
  const r = await readCourseRecordStrict(progId);
  if(r.status==='missing' && prog && hasPreloadedCourses(prog)){
    return buildPreloadedCourses(prog).map(c=>({
      id: c.id, subject: c.subject||'', number: c.number||'', title: c.title||'',
      prereqs: c.prereqs||'', status: c.status||'', group: c.group||'', ownership: c.ownership||'',
      summary: c.summary||'', original: c.original||null, originalNumber: '', numberChangeReason: '', requirementArea: c.requirementArea||''
    }));
  }
  try{
    const res = await window.storage.get('program:'+progId, true);
    if(!res) return [];
    const data = JSON.parse(res.value);
    return (data.courses||[]).map(c=>({
      id: c.id, subject: c.subject||'', number: c.number||'', title: c.title||'',
      prereqs: Array.isArray(c.prereqs)? c.prereqs.join(', ') : (c.prereqs||''),
      status: c.status||'', group: c.group||'', ownership: c.ownership||'',
      summary: c.summary||'', original: c.original||null, originalNumber: c.originalNumber||'',
      numberChangeReason: c.numberChangeReason||'', requirementArea: c.requirementArea||''
    }));
  }catch(e){ return []; }
}
// Keyed by the course's stable internal id (assigned once by the sequencing
// tool and never changed), NOT by subject/number/title — so editing a
// course's name or number later doesn't disconnect its Pillar Mapping,
// Course Content, or Syllabus Planning data. Falls back to the old
// composite key only for courses saved before this id existed.
function courseKeyOf(c){ return (c.id!==undefined && c.id!==null) ? 'c'+c.id : `${c.subject}_${c.number}_${c.title}`; }
function courseLabelOf(c){ return `${c.subject} ${c.number}${c.title? ' — '+c.title:''}`.trim(); }

// Lets any deliverable (not just the Stick Figure) edit a course's subject/
// number/title and have it stick everywhere, since it writes straight back
// to the same canonical record the sequencing tool reads and saves.
async function updateCourseCore(progId, courseId, patch){
  try{
    const res = await window.storage.get('program:'+progId, true);
    if(!res) return false;
    const data = JSON.parse(res.value);
    const c = (data.courses||[]).find(c=>c.id===courseId);
    if(!c) return false;
    Object.assign(c, patch);
    await window.storage.set('program:'+progId, JSON.stringify(data), true);
    return true;
  }catch(e){ return false; }
}
function courseQuickEdit(prog, c, onSaved){
  return `<div class="quick-edit">
      <span class="qe-lbl">Subject</span><input type="text" class="qe-subject" value="${(c.subject||'').replace(/"/g,'&quot;')}"/>
      <span class="qe-lbl">Number</span><input type="text" class="qe-number" value="${(c.number||'').replace(/"/g,'&quot;')}"/>
      <span class="qe-lbl">Title</span><input type="text" class="qe-title" value="${(c.title||'').replace(/"/g,'&quot;')}"/>
    </div>`;
}
function wireCourseQuickEdit(box, prog, c){
  const subj = box.querySelector('.qe-subject'), num = box.querySelector('.qe-number'), title = box.querySelector('.qe-title');
  const save = async ()=>{
    await updateCourseCore(prog.id, c.id, {subject: subj.value, number: num.value, title: title.value});
    renderTab(prog);
  };
  [subj, num, title].forEach(el=>el.addEventListener('change', save));
}

// Work that couldn't be saved (e.g. Claude's preview refusing saves) is kept
// for this session so the page still behaves correctly until it's closed.
const sessionOnly = {};
async function loadDeliverable(progId, key){
  const k = progId + '|' + key;
  if(sessionOnly[k] !== undefined) return sessionOnly[k];
  try{
    const res = await window.storage.get(`prog:${progId}:${key}`, true);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}

// Saving never rebuilds the page (that replaced the box being typed in after
// every letter). Only the status note and the rail's save warning update.
// Rapid saves of the same deliverable are combined: one save at a time, then
// one more with the latest content if anything changed meanwhile.
const saveQueue = {};
function updateSaveIndicators(){
  const pill = document.getElementById('saveStatusPill');
  if(pill){ pill.textContent = state.status || ''; pill.style.display = state.status ? '' : 'none'; }
  const warn = document.getElementById('railSaveWarning');
  if(warn) warn.style.display = state.saveFailed ? '' : 'none';
}
async function writeDeliverable(progId, key, payload){
  const k = progId + '|' + key;
  try{
    await window.storage.set(`prog:${progId}:${key}`, JSON.stringify(payload), true);
    delete sessionOnly[k];
    state.status = 'Saved ' + new Date().toLocaleTimeString();
    state.saveFailed = false;
  }catch(e){
    sessionOnly[k] = JSON.parse(JSON.stringify(payload));
    state.status = 'Not saved: storage refused the save. Changes last only until this page is closed.';
    state.saveFailed = true;
  }
  updateSaveIndicators();
  return !state.saveFailed;
}
function saveDeliverable(progId, key, payload){
  const k = progId + '|' + key;
  const q = saveQueue[k] || (saveQueue[k] = {running:null, pending:null});
  if(q.running){
    q.pending = payload;
    return q.running.then(()=>q.next);
  }
  const run = async ()=>{
    let ok = await writeDeliverable(progId, key, payload);
    while(q.pending){ const p = q.pending; q.pending = null; ok = await writeDeliverable(progId, key, p); }
    q.running = null;
    return ok;
  };
  q.running = run();
  q.next = q.running;
  return q.running;
}

function ensureCache(progId){
  if(!state.data[progId]) state.data[progId] = {};
}

async function getData(progId, key, fallback){
  ensureCache(progId);
  if(state.data[progId][key] !== undefined) return state.data[progId][key];
  const loaded = await loadDeliverable(progId, key);
  state.data[progId][key] = loaded || fallback;
  return state.data[progId][key];
}

// "Animation BFA" typed in the Add box becomes the BFA degree level under the
// existing Animation major (matched by name), not a new major of its own.
function newProgramEntry(name){
  const split = splitProgramName(name);
  const existing = state.programs.find(p=>normKey(p.familyName)===normKey(split.familyName));
  const id = uid();
  const familyName = existing ? existing.familyName : split.familyName;
  return {id, programName: `${familyName} ${split.trackLabel}`.trim(),
    familyId: existing ? existing.familyId : uid(), familyName, trackLabel: split.trackLabel,
    degreeType:'', degreeLevel:'', updatedAt: Date.now(), addedInStudio: true};
}
function findDuplicateTrack(p){
  if(!p.trackLabel) return null;
  return state.programs.find(x=>normKey(x.familyName)===normKey(p.familyName) && normKey(x.trackLabel)===normKey(p.trackLabel)) || null;
}

async function addProgram(name){
  if(!name.trim()) return;
  const p = newProgramEntry(name);
  const dup = findDuplicateTrack(p);
  if(dup){ state.activeProgram = dup.id; state.activeTab = null; render(); return; }
  state.activeProgram = p.id;
  state.activeTab = null;
  await mutateProgramList(list=>{ list.push(p); return list; });
}

async function bulkAddPrograms(text){
  const names = text.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length) return;
  const newPrograms = names.map(newProgramEntry).filter(p=>!findDuplicateTrack(p));
  if(!newPrograms.length){ state.showBulkAdd = false; render(); return; }
  state.activeProgram = newPrograms[0].id;
  state.activeTab = null;
  state.showBulkAdd = false;
  await mutateProgramList(list=>{ list.push(...newPrograms); return list; });
}

// Add another degree level to an existing major (e.g. MFA under Animation).
// It starts blank; content can be copied afterward from a same-level degree.
async function addTrack(familyId, trackLabel, copyFromId){
  trackLabel = (trackLabel||'').trim();
  if(DEGREE_TOKENS.includes(trackLabel.replace(/\./g,'').toUpperCase())) trackLabel = trackLabel.replace(/\./g,'').toUpperCase();
  const clash = state.programs.find(p=>p.familyId===familyId && normKey(p.trackLabel)===normKey(trackLabel));
  if(clash){ state.activeProgram = clash.id; state.activeTab = null; render(); return; }
  const sibling = state.programs.find(p=>p.id===copyFromId);
  const familyName = sibling ? sibling.familyName : (state.programs.find(p=>p.familyId===familyId)||{}).familyName || 'Program';
  const id = uid();
  const p = {id, programName: `${familyName} ${trackLabel}`.trim(), familyId, familyName, trackLabel, degreeType:'', degreeLevel:'', updatedAt: Date.now(), addedInStudio: true};

  // New degrees start blank. Content is copied afterward with "Copy content
  // from another degree" on the overview page (same level only).
  state.activeProgram = id;
  state.activeTab = null;
  await mutateProgramList(list=>{ list.push(p); return list; });
}

// Other degree-level tracks under the same major (e.g. the MA when you're
// looking at the MFA), for offering a retroactive copy — this is separate
// from the one-time copy offered when a track is first created, since
// programs that already existed before that flow ran (like the seeded
// starter list) never had a chance to copy from each other.
function getSiblingTracks(prog){
  if(!isRealFamilyId(prog.familyId)) return [];
  return state.programs.filter(p=>p.familyId===prog.familyId && p.id!==prog.id);
}
// Copying runs one way, from the degree departments build first (it has
// more required courses) down to its shorter sibling in the same major:
// MFA content copies into the MA, BFA content into the BA.
const COPY_FROM = {MA:['MFA'], BA:['BFA']};
function copySourcesFor(prog){
  const from = COPY_FROM[str(prog.trackLabel).trim().toUpperCase()] || [];
  return getSiblingTracks(prog).filter(p=>from.includes(str(p.trackLabel).trim().toUpperCase()));
}

// ---------- SOW grouping: one agreement per degree level, not per track ----------
// A family can have several tracks at the same level (e.g. Service Design's
// MA and MBI are both graduate) — those share one Scope of Work Agreement.
// Undergrad and grad each get their own, per department. This only affects
// which SOW record a program points to; deliverables I-X still stay
// separate per individual program/track as before.
const UNDERGRAD_TRACK_LABELS = ['BA','BFA','BDES'];
const GRAD_TRACK_LABELS = ['MA','MFA','MBI','MARCH'];
function degreeLevelOf(prog){
  const t = (prog.trackLabel || '').trim().toUpperCase();
  if(GRAD_TRACK_LABELS.includes(t)) return 'grad';
  if(UNDERGRAD_TRACK_LABELS.includes(t)) return 'undergrad';
  // Anything typed differently than the standard abbreviations: SCAD's
  // graduate tracks are consistently M-prefixed (MA/MFA/MBI/MARCH/etc.),
  // so lead with that; otherwise default to undergraduate.
  return t.startsWith('M') ? 'grad' : 'undergrad';
}
function sowGroupTracks(prog){
  // Every program in this family at the same degree level, including prog
  // itself — the set of tracks this one Scope of Work Agreement covers.
  if(!isRealFamilyId(prog.familyId)) return [prog];
  return state.programs.filter(p=>p.familyId===prog.familyId && degreeLevelOf(p)===degreeLevelOf(prog));
}
function sowStorageId(prog){
  // Passed as the "progId" argument to loadDeliverable/saveDeliverable so
  // it reuses their existing prog:{id}:{key} storage pattern, just scoped
  // to family+level instead of one program. uid()-generated program ids
  // never start with "family:", so this can't collide with a real one.
  // No familyId: scope to the program itself rather than a shared
  // "family:undefined:..." record that unrelated programs would all see.
  if(!isRealFamilyId(prog.familyId)) return 'solo:' + prog.id + ':' + degreeLevelOf(prog);
  return 'family:' + prog.familyId + ':' + degreeLevelOf(prog);
}

const CATALOG_EDITION = '2026-2027';
// Programs that start from another program's catalog requirements. 2D and
// 3D Animation are being split out of Animation and share many courses, so
// each begins with the current Animation MA or MFA requirements.
const PROGRAM_DATA_SOURCE = {
  '2d animation|ma': 'animation|ma', '2d animation|mfa': 'animation|mfa',
  '3d animation|ma': 'animation|ma', '3d animation|mfa': 'animation|mfa'
};
function programDataKey(prog){
  const k = normKey(prog.familyName) + '|' + normKey(prog.trackLabel);
  return PROGRAM_DATA_SOURCE[k] || k;
}
function hasPreloadedCourses(prog){ return !!PROGRAM_COURSE_DATA.programs[programDataKey(prog)]; }
// A placeholder (an elective slot) belongs to the department only when it
// names the department's own subject code ("700-level ANIM elective" for
// Animation); otherwise it is owned elsewhere, by the subjects it names
// ("700-level ARTH elective" -> ARTH) or, for generic slots like Free
// elective, by no single program.
function placeholderOwnership(title, ownSubject){
  const codes = (str(title).match(/\b[A-Z]{2,5}\b/g) || []).filter(c=>!['OR','AND'].includes(c));
  if(ownSubject && codes.includes(ownSubject)) return {ownership:'owned', owningProgram:''};
  return {ownership:'owned_elsewhere', owningProgram: codes.join(', ')};
}
function buildPreloadedCourses(prog){
  const entry = PROGRAM_COURSE_DATA.programs[programDataKey(prog)];
  if(!entry) return null;
  const own = entry.own, rows = entry.rows;
  return rows.map((r,i)=>Object.assign({
    id: i+1, year:'', quarter:'',
    subject:r[0], number:r[1], title:r[2], prereqs:r[3], summary:r[4],
    status: r[5] ? 'placeholder_elective' : 'existing_not_revising',
    ownership: r[6] ? 'owned_elsewhere' : 'owned', owningProgram: r[6] || '',
    owningYear:'', owningQuarter:'', owningNotes:'', isShared:false, sharedNotes:'',
    prereqRationale:'', needsRevision:false, revisionProgram:'', revisionNotes:'',
    group: r[8] || '', groupSelectCount: r[9] || 1,
    requirementArea: PROGRAM_COURSE_DATA.areas[r[7]] || '', hours: r[10] || 5,
    catalogPreloaded: CATALOG_EDITION,
    // The catalog values, so a course counts as revised only when its title,
    // number, prerequisites or summary differ from these.
    original: {title:r[2], number:r[1], prereqs:r[3], summary:r[4]}
  }, r[5] ? placeholderOwnership(r[2], own) : {}));
}
// Programs loaded before this rule existed had every placeholder marked as
// owned by the department. Correct those once, leaving any placeholder a
// department has already edited alone.
// Earlier versions stored a "select two/three/four" option's hours as the
// whole row's hours (10/15/20). Correct pre-loaded courses to the catalog's
// per-course hours, matched by their position in the catalog list.
function fixPreloadedHours(rec, prog){
  if(!rec || rec.hoursRule) return false;
  const seed = buildPreloadedCourses(prog);
  if(!seed) return false;
  const byId = {}; seed.forEach(c=>{ byId[c.id] = c; });
  (rec.courses||[]).forEach(c=>{
    const sc = byId[c.id];
    if(c.catalogPreloaded && sc && normKey((c.original||{}).title || sc.title)===normKey(sc.title)) c.hours = sc.hours;
  });
  rec.hoursRule = 1;
  return true;
}
function fixPreloadedPlaceholderOwnership(rec, prog){
  const entry = PROGRAM_COURSE_DATA.programs[programDataKey(prog)];
  if(!entry || !rec || rec.placeholderOwnershipRule) return false;
  (rec.courses||[]).forEach(c=>{
    if(c.status==='placeholder_elective' && c.catalogPreloaded && c.ownership==='owned' && !c.owningNotes){
      Object.assign(c, placeholderOwnership(c.title, entry.own));
    }
  });
  rec.placeholderOwnershipRule = 1;
  return true;
}
// Reads a program's Stick Figure record, telling "not saved yet" apart from
// "couldn't read it" so a failed read never leads to overwriting real work.
async function readCourseRecordStrict(progId){
  try{
    const r = await window.storage.get('program:'+progId, true);
    if(!r || r.value===undefined || r.value===null) return {status:'missing', rec:null};
    return {status:'ok', rec: JSON.parse(r.value)};
  }catch(e){
    if(/not found/i.test((e && e.message) || String(e))) return {status:'missing', rec:null};
    return {status:'error', rec:null};
  }
}
// Loads the catalog requirements into a program the first time its course
// list is needed. Never touches a program that already has courses, or one
// that was already loaded once (so a department that deliberately cleared
// its list isn't refilled).
async function ensurePreloadedCourses(prog){
  if(!prog || !hasPreloadedCourses(prog)) return;
  const r = await readCourseRecordStrict(prog.id);
  if(r.status==='error') return;
  const rec = r.rec || {};
  if((rec.courses||[]).length || rec.catalogPreloaded){
    // Records saved by older versions may have lost the record-level marker;
    // the per-course marker still identifies catalog courses.
    const fromCatalog = rec.catalogPreloaded || (rec.courses||[]).some(c=>c.catalogPreloaded);
    if(fromCatalog){
      const a = fixPreloadedPlaceholderOwnership(rec, prog);
      const b = fixPreloadedHours(rec, prog);
      if(a || b){ if(!rec.catalogPreloaded) rec.catalogPreloaded = CATALOG_EDITION; try{ await window.storage.set('program:'+prog.id, JSON.stringify(rec), true); }catch(e){} }
    }
    return;
  }
  const seeded = buildPreloadedCourses(prog);
  const lvl = degreeLevelOf(prog);
  const data = Object.assign({}, rec, {
    id: prog.id, programName: prog.programName,
    degreeLevel: lvl, degreeType: str(prog.trackLabel).toUpperCase(),
    programYears: str(prog.trackLabel).trim().toUpperCase()==='MA' ? 1 : (lvl==='undergrad' ? 4 : 2),
    courses: seeded, nextId: seeded.length + 1,
    electiveShells: rec.electiveShells || [],
    catalogPreloaded: CATALOG_EDITION,
    placeholderOwnershipRule: 1, hoursRule: 1
  });
  try{ await window.storage.set('program:'+prog.id, JSON.stringify(data), true); }catch(e){}
}

const COPYABLE = [
  {key:'story', label:'I. The Story'},
  {key:'research', label:'II. Research'},
  {key:'pillars', label:'III. Pillars'},
  {key:'pillarmap', label:'V. Pillar Mapping', courseLinked:true},
  {key:'coursecontent', label:'VI. Course Content', courseLinked:true},
  {key:'assessment', label:'VII. Assessment Planning'},
  {key:'transition', label:'VIII. Transition Planning'},
  {key:'resources', label:'IX. Resource Needs'},
  {key:'syllabus', label:'X. Syllabus Planning', courseLinked:true},
];
async function readCourseRecord(progId){
  const r = await readCourseRecordStrict(progId);
  return r.rec;
}
async function sourceHasContent(srcId, key){
  return !!(await loadDeliverable(srcId, key));
}
function courseMatchKey(c){
  return (c.subject || c.number) ? (str(c.subject).trim().toUpperCase() + ' ' + str(c.number).trim().toUpperCase()) : ('~' + normKey(c.title));
}
// Course-linked deliverables store entries per course. The same course has
// a different internal id in each degree, so entries are matched by subject
// and number and merged in; entries for courses the destination doesn't
// have are skipped, and the destination's other entries are left alone.
function remapCourseLinked(payload, srcCourses, destCourses, destExisting){
  const srcKeyToMatch = {};
  srcCourses.forEach(c=>{ srcKeyToMatch['c'+c.id] = courseMatchKey(c); });
  const matchToDestKey = {};
  destCourses.forEach(c=>{ matchToDestKey[courseMatchKey(c)] = 'c'+c.id; });
  const translate = k=>{ const m = srcKeyToMatch[k]; return m ? matchToDestKey[m] : null; };
  const out = JSON.parse(JSON.stringify(destExisting || {}));
  Object.keys(payload).forEach(field=>{
    const v = payload[field];
    if(v && typeof v==='object' && !Array.isArray(v) && (field==='levels' || field==='entries')){
      out[field] = out[field] || {};
      Object.keys(v).forEach(k=>{ const dk = translate(k); if(dk) out[field][dk] = JSON.parse(JSON.stringify(v[k])); });
    } else if(field==='selected'){
      const dk = translate(v); if(dk && !out.selected) out.selected = dk;
    } else if(out[field]===undefined){
      out[field] = JSON.parse(JSON.stringify(v));
    }
  });
  return out;
}
async function copyDeliverables(dest, src, keys){
  const copied = [];
  const srcRec = await readCourseRecord(src.id);
  const destRec = await readCourseRecord(dest.id);
  for(const key of keys){
    const payload = await loadDeliverable(src.id, key);
    if(!payload) continue;
    const def = COPYABLE.find(c=>c.key===key) || {};
    let next = JSON.parse(JSON.stringify(payload));
    if(def.courseLinked){
      next = remapCourseLinked(payload, (srcRec && srcRec.courses) || [], (destRec && destRec.courses) || [], await loadDeliverable(dest.id, key));
    }
    await window.storage.set(`prog:${dest.id}:${key}`, JSON.stringify(next), true);
    copied.push(key);
  }
  delete state.data[dest.id]; // drop cached copies so the new content shows
  return copied;
}
// Stick Figure courses are never copied wholesale (each degree has its own
// pre-loaded requirements). Only courses a department PROPOSED in the source
// (New Course or Course Restoration) that the destination doesn't already
// have can be added, one by one. Nothing already in the destination changes.
function proposedCoursesToOffer(srcRec, destRec){
  const have = new Set(((destRec && destRec.courses) || []).map(courseMatchKey));
  return ((srcRec && srcRec.courses) || []).filter(c=>(c.status==='new' || c.status==='restoration') && !have.has(courseMatchKey(c)));
}
async function addProposedCourses(dest, src, srcIds){
  const r = await readCourseRecordStrict(dest.id);
  if(r.status==='error') throw new Error('storage');
  await ensurePreloadedCourses(dest);
  const destRec = (await readCourseRecord(dest.id)) || {id: dest.id, programName: dest.programName, courses: [], electiveShells: [], nextId: 1};
  const srcRec = await readCourseRecord(src.id);
  const offer = proposedCoursesToOffer(srcRec, destRec).filter(c=>srcIds.includes(c.id));
  let nextId = Math.max(destRec.nextId || 1, ...((destRec.courses||[]).map(c=>(+c.id||0)+1)), 1);
  const added = offer.map(c=>Object.assign(JSON.parse(JSON.stringify(c)), {id: nextId++, year:'', quarter:'', group:'', groupSelectCount:1}));
  destRec.courses = (destRec.courses || []).concat(added);
  destRec.nextId = nextId;
  await window.storage.set('program:'+dest.id, JSON.stringify(destRec), true);
  delete state.data[dest.id];
  return added.length;
}

// Panel shown on an MA or BA overview page when its MFA or BFA exists.
async function renderCopyPanel(prog, host){
  const sources = copySourcesFor(prog);
  if(!sources.length){ host.innerHTML = ''; return; }
  const srcId = host.dataset.src && sources.some(s=>s.id===host.dataset.src) ? host.dataset.src : sources[0].id;
  const src = sources.find(s=>s.id===srcId);
  const has = await Promise.all(COPYABLE.map(c=>sourceHasContent(src.id, c.key)));
  await ensurePreloadedCourses(prog);
  const srcRec = await readCourseRecord(src.id);

      <div class="hint">Courses the ${me} already has are never changed or replaced. Checked courses are added to the ${me}'s Unplaced Courses, ready to place in its sequence.</div>
      ${offer.length ? `<div class="copy-grid">${offer.map(c=>`<label><input type="checkbox" data-addcourse="${escAttr(String(c.id))}"/> <span>${esc((c.subject+' '+c.number).trim())} ${esc(c.title)} <em style="color:#6b7280;">(${c.status==='restoration'?'restoration':'new'})</em></span></label>`).join('')}</div>
        <div class="row-actions"><button class="btn small gold" id="addCoursesBtn">Add checked courses to the ${me}</button></div>`
      : `<div style="font-size:13.5px;color:#6b7280;">No new courses in the ${them} that the ${me} doesn't already have.</div>`}
      <div id="addCoursesStatus" style="font-size:13.5px;margin-top:8px;color:#2d6a3e;"></div>
    </div>
  </div>`;
  host.querySelector('#copySrc')?.addEventListener('change', e=>{ host.dataset.src = e.target.value; renderCopyPanel(prog, host); });
  host.querySelector('#copyAllBtn').addEventListener('click', ()=>{ host.querySelectorAll('[data-copykey]:not(:disabled)').forEach(cb=>cb.checked = true); });
  host.querySelector('#copyGoBtn').addEventListener('click', async ()=>{
    const keys = [...host.querySelectorAll('[data-copykey]:checked')].map(cb=>cb.dataset.copykey);
    if(!keys.length){ await uiAlert('Check at least one deliverable to copy.'); return; }
    const ok = await uiConfirm(`Copy ${keys.length} deliverable${keys.length===1?'':'s'} from ${src.programName} into ${prog.programName}? This replaces what is currently saved in ${prog.programName} for those deliverables.`, 'Copy');
    if(!ok) return;
    const done = await copyDeliverables(prog, src, keys);
    await renderLanding(prog);
    const st = document.querySelector('#copyPanelHost #copyStatus');
    if(st) st.textContent = `Copied ${done.length} deliverable${done.length===1?'':'s'} from ${src.programName}.`;
  });
  host.querySelector('#addCoursesBtn')?.addEventListener('click', async ()=>{
    const ids = [...host.querySelectorAll('[data-addcourse]:checked')].map(cb=>{ const v = cb.dataset.addcourse; return isNaN(+v) ? v : +v; });
    if(!ids.length){ await uiAlert('Check at least one course to add.'); return; }
    let n = 0;
    try{ n = await addProposedCourses(prog, src, ids); }
    catch(e){ await uiAlert("Couldn't reach saved work, so nothing was added. Please try again."); return; }
    await renderLanding(prog);
    const st = document.querySelector('#copyPanelHost #addCoursesStatus');
    if(st) st.textContent = `Added ${n} course${n===1?'':'s'} to ${prog.programName}'s Unplaced Courses.`;
  });
}

// ---------- Word export (HTML->.doc trick, opens natively in Word) ----------
function downloadWordDoc(title, bodyHtml){
  const html = `<!DOCTYPE html><html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset='utf-8'><title>${title}</title>
  <style>
    body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000;}
    h1{font-size:18pt;color:#1c2b4a;border-bottom:2px solid #c9a227;padding-bottom:4px;}
    h2{font-size:13pt;color:#1c2b4a;margin-top:18px;}
    table{border-collapse:collapse;width:100%;margin-top:8px;}
    td,th{border:1px solid #999;padding:5px;font-size:10pt;vertical-align:top;}
    th{background:#1c2b4a;color:#fff;}
    .meta{color:#666;font-size:9pt;margin-bottom:14px;}
  </style></head>
  <body>${bodyHtml}</body></html>`;
  const blob = new Blob(['\ufeff', html], {type: 'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title.replace(/[^a-z0-9\-_ ]/gi,'').replace(/\s+/g,'_') + '.doc';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br/>'); }
function escAttr(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- In-page dialogs ----------
// Native prompt(), confirm() and alert() can be silently blocked inside Claude's
// preview, which made buttons like "+ add another degree level" do nothing.
// These render inside the page instead and always work.
function uiDialog({title, message, fields, okLabel, cancelLabel, danger}){
  return new Promise(resolve=>{
    const hasFields = !!(fields && fields.length);
    const wrap = document.createElement('div');
    wrap.className = 'ui-modal-backdrop';
    wrap.innerHTML = `<div class="ui-modal" role="dialog" aria-modal="true">
      ${title ? `<h3>${esc(title)}</h3>` : ''}
      ${message ? `<p>${esc(message)}</p>` : ''}
      ${(fields||[]).map((f,i)=> f.options
        ? `<label class="ui-field">${esc(f.label||'')}<select data-i="${i}">${f.options.map(o=>`<option value="${escAttr(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`
        : `<label class="ui-field">${esc(f.label||'')}<input type="text" data-i="${i}" value="${escAttr(f.value||'')}" placeholder="${escAttr(f.placeholder||'')}"/></label>`).join('')}
      <div class="ui-actions">
        ${cancelLabel===null ? '' : `<button class="btn small ghost" data-act="cancel">${esc(cancelLabel||'Cancel')}</button>`}
        <button class="btn small ${danger?'danger':'gold'}" data-act="ok">${esc(okLabel||'OK')}</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const inputs = [...wrap.querySelectorAll('input,select')];
    (inputs[0] || wrap.querySelector('[data-act="ok"]')).focus();
    let done = false;
    const close = ok=>{
      if(done) return; done = true;
      const vals = inputs.map(x=>x.value);
      wrap.remove();
      resolve(ok ? (hasFields ? vals : true) : (hasFields ? null : false));
    };
    wrap.querySelector('[data-act="ok"]').addEventListener('click', ()=>close(true));
    wrap.querySelector('[data-act="cancel"]')?.addEventListener('click', ()=>close(false));
    wrap.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.tagName!=='SELECT') close(true); if(e.key==='Escape') close(false); });
    wrap.addEventListener('mousedown', e=>{ if(e.target===wrap) close(false); });
  });
}
function uiAlert(message){ return uiDialog({message, okLabel:'OK', cancelLabel:null}); }
function uiConfirm(message, okLabel, danger){ return uiDialog({message, okLabel: okLabel||'OK', danger}); }
async function uiPrompt(message, value, placeholder){
  const r = await uiDialog({message, fields:[{value, placeholder}], okLabel:'Save'});
  return r ? r[0] : null;
}

    <div class="prog-list">

          <div class="family-name">${fam.familyName ? esc(fam.familyName) : '(unnamed major)'}${isBuiltInFamilyName(fam.familyName) ? '' : ` <span class="fam-edit-btn" data-renamefam="${fam.familyId}" title="Rename this major">✎</span>`}</div>
          <div class="track-row">
            ${fam.tracks.map(p=>`<span class="track-chip-wrap"><button class="prog-btn track-btn ${p.id===state.activeProgram?'active':''}" data-prog="${p.id}">${esc(p.trackLabel || p.programName)}</button>${p.builtIn ? '' : `<span class="track-x-btn" data-removeprog="${p.id}" title="Remove this degree">×</span><span class="track-edit-btn" data-relabel="${p.id}" title="Change degree level">✎</span>`}</span>`).join('')}
          </div>
          <button class="add-track-btn" data-addtrack="${fam.familyId}">+ add another degree level</button>
        </div>`;
      }).join('') || (state.indexStatus==='error'
        ? '<div style="color:#ffd9a8;font-size:13px;line-height:1.4;">Couldn\'t load the program list from shared storage. Nothing was changed. <button class="add-track-btn" id="retryLoadBtn">Retry</button><div style="margin-top:8px;font-size:11.5px;color:#c7d1ea;word-break:break-word;">Details: ' + esc(state.loadError || 'unknown') + '</div></div>'
        : '<div style="color:#8a93ab;font-size:12px;">No programs yet</div>')}

    <div class="add-prog">

    await addProgram(inp.value);
  });
  document.getElementById('newProgInput')?.addEventListener('keydown', async (e)=>{
    if(e.key==='Enter'){ await addProgram(e.target.value); }
  });
  document.getElementById('retryLoadBtn')?.addEventListener('click', async ()=>{ await loadPrograms(); render(); });
  document.getElementById('bulkToggleBtn')?.addEventListener('click', ()=>{ state.showBulkAdd = !state.showBulkAdd; render(); });
  document.getElementById('bulkAddBtn')?.addEventListener('click', async ()=>{
    const inp = document.getElementById('bulkInput');
    await bulkAddPrograms(inp.value);
  });
  document.querySelectorAll('.prog-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ state.activeProgram = b.dataset.prog; state.activeTab = null; render(); });

  document.querySelectorAll('[data-addtrack]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const familyId = b.dataset.addtrack;
      const fam = state.programs.find(p=>p.familyId===familyId);
      const label = await uiPrompt(`Add a degree level to ${fam ? fam.familyName : 'this major'} (for example MA, MFA, BA, BFA):`, '', 'MFA');
      if(!label || !label.trim()) return;
      await addTrack(familyId, label.trim(), null);
    });
  });
  document.querySelectorAll('[data-renamefam]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const familyId = b.dataset.renamefam;
      const famPrograms = state.programs.filter(p=>p.familyId===familyId);
      if(!famPrograms.length || isBuiltInFamilyName(famPrograms[0].familyName)) return;
      const newName = await uiPrompt('Rename this major:', famPrograms[0].familyName);
      if(!newName || !newName.trim()) return;
      const trimmed = newName.trim();
      if(state.programs.some(p=>p.familyId!==familyId && normKey(p.familyName)===normKey(trimmed))){
        await uiAlert(`There is already a major named ${trimmed}. Choose a different name, or add the degree under that major instead.`);
        return;
      }
      await mutateProgramList(list=>{
        list.forEach(p=>{
          if(p.familyId===familyId){
            p.familyName = trimmed;
            p.programName = `${trimmed} ${p.trackLabel}`.trim();
          }
        });
        return list;
      });
    });
  });
  document.querySelectorAll('[data-relabel]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const progId = b.dataset.relabel;
      const p = state.programs.find(x=>x.id===progId);
      if(!p) return;
      const label = await uiPrompt(`Degree level for ${p.programName} (for example MA, MFA, BFA):`, p.trackLabel || '');
      if(!label || !label.trim()) return;
      let t = label.trim();
      if(DEGREE_TOKENS.includes(t.replace(/\./g,'').toUpperCase())) t = t.replace(/\./g,'').toUpperCase();
      if(state.programs.some(x=>x.id!==progId && x.familyId===p.familyId && normKey(x.trackLabel)===normKey(t))){
        await uiAlert(`${p.familyName} already has a ${t}.`); return;
      }
      await mutateProgramList(list=>{
        list.forEach(x=>{ if(x.id===progId){ x.trackLabel = t; x.programName = `${x.familyName} ${t}`.trim(); } });
        return list;
      });
    });
  });
  document.querySelectorAll('[data-removeprog]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const progId = b.dataset.removeprog;
      const p = state.programs.find(x=>x.id===progId);
      if(!p) return;
      if(!(await uiConfirm(`Remove "${p.programName}" from the list? This only removes it from this navigation — any saved deliverable data stays in storage in case you need to bring it back.`, 'Remove', true))) return;
      if(state.activeProgram===progId){ state.activeProgram = null; state.activeTab = null; }
      const ok = await mutateProgramList(list=> list.filter(x=>x.id!==progId));
      if(ok){
        try{
          const prev = await safeGetJSON(PROGRAM_REMOVED_KEY);
          const next = Array.isArray(prev) ? prev : [];
          if(!next.includes(progId)) next.push(progId);
          await window.storage.set(PROGRAM_REMOVED_KEY, JSON.stringify(next), true);
        }catch(e){}
      }
    });
  });
  document.getElementById('backToLanding')?.addEventListener('click', ()=>{ state.activeTab = null; render(); });
  document.querySelectorAll('.step').forEach(b=>{
    b.addEventListener('click', ()=>{ state.activeTab = parseInt(b.dataset.tab); render(); });
  });
  document.querySelectorAll('[data-tab="sow"], [data-tab="feedback"]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.activeTab = b.dataset.tab; render(); });
  });

  if(prog && state.activeTab === null) renderLanding(prog);
  else if(prog) renderTab(prog);
  else renderSiteLanding();
}

const ANNOUNCEMENTS_KEY = 'announcements';

async function loadAnnouncements(){
  try{
    const res = await window.storage.get(ANNOUNCEMENTS_KEY, true);
    return res ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveAnnouncements(list){
  await window.storage.set(ANNOUNCEMENTS_KEY, JSON.stringify(list), true);
}

      await saveAnnouncements(list);
      renderSiteLanding();

  });

// A refresh requested by an earlier action (for example, after a save
// finishes) can arrive after the user has moved to another program or page.
// Only draw if that program and page are still the ones on screen;
// otherwise one program's content could appear inside another's page.
function stillShowing(prog, wantLanding){
  return !!prog && prog.id === state.activeProgram && (wantLanding ? state.activeTab === null : state.activeTab !== null);
}
async function renderLanding(prog){
  if(!stillShowing(prog, true)) return;
  const el = document.getElementById('landingBody');
  if(!el) return;
  const sow = await loadDeliverable(sowStorageId(prog), 'sow');
  const sowComplete = sowIsComplete(sow);
  const sowGroup = sowGroupTracks(prog);
  const sowGroupNote = sowGroup.length>1 ? ` Covers ${sowGroup.map(p=>esc(p.trackLabel||p.programName)).join(', ')}.` : '';
  const feedback = await loadDeliverable(prog.id, 'feedback');
  const feedbackCount = (feedback && feedback.messages) ? feedback.messages.length : 0;
  const statuses = await Promise.all(DELIVERABLES.map(async d=>{
    if(d.key==='stickfigure'){
      // Pre-loaded requirements alone don't count as progress; placing,
      // revising or adding a course does.

async function renderTab(prog){
  if(!stillShowing(prog, false)) return;
  const body = document.getElementById('tabBody');
  if(!body) return;
  body.innerHTML = '<div class="empty">Loading…</div>';

  if(state.activeTab === 'sow'){ await renderSowTab(prog, body); return; }
  if(state.activeTab === 'feedback'){ await renderFeedbackTab(prog, body); return; }

  // Authoritative check: every numbered deliverable routes through here
  // regardless of how it was reached (stepper click, landing card, a stale
  // activeTab), so this is the one place that decides whether it renders
  // editable or preview-only based on the SOW's sign-off status.
  const sow = await loadDeliverable(sowStorageId(prog), 'sow');
  const complete = sowIsComplete(sow);
  const d = DELIVERABLES.find(x=>x.id===state.activeTab);

  const renderer = RENDERERS[d.key];
  await renderer(prog, body);

  // The Sequenced Stick Figure tool stays fully open before the SOW is
  // signed — departments can play around with sequencing early, it just
  // isn't the source of truth for anything downstream until the agreement
  // is in place. Every other deliverable still locks to preview-only.
  if(!complete && d.key !== 'stickfigure'){
    applyDeliverablePreviewLock(body, sow);
  }
}

// Before the SOW is signed, a deliverable still renders normally underneath
// this — it's just made read-only afterward, so the department can look
// over what's there (and what earlier tracks entered, via the copy-from-
// sibling flows) without being able to change anything until it's unlocked.
function applyDeliverablePreviewLock(body, sow){
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#fdf3ee;border:1px solid #ecc9b8;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:#7a3b1f;';
  banner.innerHTML = `<b>Preview only.</b> This unlocks for editing once the signed Scope of Work document is uploaded. <a href="#" id="previewGoToSow" style="color:#7a3b1f;">Go to the agreement →</a>`;
  body.insertBefore(banner, body.firstChild);
  banner.querySelector('#previewGoToSow').addEventListener('click', (e)=>{ e.preventDefault(); state.activeTab = 'sow'; render(); });

  body.querySelectorAll('input, textarea, select, button').forEach(el=>{
    if(el.hasAttribute('data-export')) return; // downloading a preview is still fine
    el.disabled = true;
  });
}

// helper to build editable table
function buildTable(container, rows, columns, onChange, opts={}){
  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join('')}${opts.removable!==false?'<th></th>':''}</tr></thead>`;
  const tbody = document.createElement('tbody');
  rows.forEach((row,ri)=>{
    const tr = document.createElement('tr');
    columns.forEach(c=>{
      const td = document.createElement('td');
      if(c.type==='select'){
        const sel = document.createElement('select');
        (c.options(row)||[]).forEach(optVal=>{
          const o = document.createElement('option');
          o.value = optVal; o.textContent = c.optionLabel ? c.optionLabel(optVal) : (optVal || '—');
          if(row[c.key]===optVal) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener('change', ()=>{ row[c.key]=sel.value; onChange(); });
        td.appendChild(sel);
      } else if(c.type==='textarea'){
        const ta = document.createElement('textarea');
        ta.rows=2; ta.value = row[c.key]||'';
        ta.addEventListener('input', ()=>{ row[c.key]=ta.value; onChange(); });
        td.appendChild(ta);
      } else {
        const inp = document.createElement('input');
        inp.type='text'; inp.value = row[c.key]||'';
        inp.readOnly = !!c.readonly;
        inp.addEventListener('input', ()=>{ row[c.key]=inp.value; onChange(); });
        td.appendChild(inp);
      }
      tr.appendChild(td);
    });
    if(opts.removable!==false){
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.className='btn small ghost'; btn.textContent='Remove';
      btn.addEventListener('click', ()=>{ rows.splice(ri,1); onChange(); container._rerender(); });
      td.appendChild(btn); tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  container.appendChild(tbl);
}

// IV. Sequenced Stick Figure — embeds the dedicated sequencing tool (bundled
// into this same file, see SEQ_TOOL_B64), scoped to the current program.
// That tool owns the canonical course list; every downstream deliverable
// below reads directly from its saved data.
function buildSeqToolSrcdoc(prog){
  // Plain atob() only correctly reconstructs ASCII bytes — any multi-byte
  // UTF-8 character in the source (em dashes, curly quotes, etc.) comes back
  // as garbled characters unless it's run through a proper UTF-8 decode.
  const html = decodeURIComponent(atob(SEQ_TOOL_B64).split('').map(function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  // window.storage (the persistence API) is only injected by the host into
  // this top-level artifact page — a nested srcdoc iframe does NOT get its
  // own copy. So every call the embedded tool makes to window.storage.get/
  // set/delete/list is bridged here via postMessage to the parent, which
  // does have a working window.storage, and the result is sent back.
  const inject = `<script>
    window.__EMBED_PID__=${JSON.stringify(prog.id)};
    window.__EMBED_PNAME__=${JSON.stringify(prog.programName)};
    window.__EMBED_TRACK__=${JSON.stringify(prog.trackLabel || '')};
    window.__EMBED_SEED__=${JSON.stringify(buildPreloadedCourses(prog) || null).replace(/</g,'\\u003c')};
    (function(){
      let reqCounter = 0;
      const pending = {};
      window.addEventListener('message', function(e){
        const d = e.data;
        if(d && d.__storageBridgeResponse && pending[d.reqId]){
          const p = pending[d.reqId]; delete pending[d.reqId];
          if(d.error) p.reject(new Error(d.error)); else p.resolve(d.result);
        }
      });
      function call(method, args){
        return new Promise(function(resolve, reject){
          const reqId = 'r' + (reqCounter++) + '_' + Date.now();
          pending[reqId] = {resolve: resolve, reject: reject};
          window.parent.postMessage({__storageBridge:true, reqId: reqId, method: method, args: args}, '*');
        });
      }
      window.storage = {
        get: function(key, shared){ return call('get',[key, shared]); },
        set: function(key, value, shared){ return call('set',[key, value, shared]); },
        delete: function(key, shared){ return call('delete',[key, shared]); },
        list: function(prefix, shared){ return call('list',[prefix, shared]); }
      };
    })();
  <\/script>`;
  // inject right after <head> so it runs before the tool's own script block
  return html.replace('<head>', '<head>' + inject);
}

// The Stick Figure frame is sized to its full content (no scrollbar of its
// own), so the page scrolls as one. The frame is told which part of it is
// on screen, so its pop-ups open there and its Save bar stays in view; while
// a pop-up is open the page behind it stops scrolling.
let seqFrameCleanup = null;
function connectSeqFrame(frame){
  if(seqFrameCleanup) seqFrameCleanup();
  const scroller = document.scrollingElement || document.documentElement;
  const sendViewport = ()=>{
    if(!document.body.contains(frame)){ cleanup(); return; }
    const r = frame.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const top = Math.max(0, -r.top);
    const height = Math.max(120, Math.min(vh, r.bottom) - Math.max(0, r.top));
    try{ frame.contentWindow.postMessage({__viewport:{top, height}}, '*'); }catch(e){}
  };
  const onMsg = e=>{
    if(e.source !== frame.contentWindow || !e.data) return;
    if(e.data.__seqHeight){ frame.style.height = Math.max(600, Math.ceil(e.data.__seqHeight) + 4) + 'px'; sendViewport(); }
    if(e.data.__seqModal !== undefined){
      scroller.style.overflow = e.data.__seqModal ? 'hidden' : '';
      document.body.style.overflow = e.data.__seqModal ? 'hidden' : '';
      sendViewport();
    }
    if(e.data.__seqWantsViewport) sendViewport();
  };
  const cleanup = ()=>{
    window.removeEventListener('scroll', sendViewport, true);
    window.removeEventListener('resize', sendViewport);
    window.removeEventListener('message', onMsg);
    scroller.style.overflow = ''; document.body.style.overflow = '';
    seqFrameCleanup = null;
  };
  window.addEventListener('scroll', sendViewport, true);
  window.addEventListener('resize', sendViewport);
  window.addEventListener('message', onMsg);
  frame.addEventListener('load', sendViewport);
  seqFrameCleanup = cleanup;
}

// Parent-side half of the bridge above: performs the real storage call
// (this top-level page's window.storage works normally) and posts the
// result back to whichever iframe asked for it.
window.addEventListener('message', async (e)=>{
  const d = e.data;
  if(!d || !d.__storageBridge) return;
  // The embedded tool gets read access to program-index but no writes: only
  // this page's mutateProgramList may change it. A cached older copy of the
  // tool therefore can't strip pairings either.
  if((d.method==='set' || d.method==='delete') && d.args && d.args[0]===PROGRAM_INDEX_KEY){
    e.source.postMessage({__storageBridgeResponse:true, reqId:d.reqId, result:{key:PROGRAM_INDEX_KEY, ignored:true}}, '*');
    return;
  }
  try{
    const result = await window.storage[d.method](...d.args);
    e.source.postMessage({__storageBridgeResponse:true, reqId:d.reqId, result}, '*');
  }catch(err){
    e.source.postMessage({__storageBridgeResponse:true, reqId:d.reqId, error: (err && err.message) || String(err)}, '*');

// ---------- SOW gating: uploaded, signed PDF instead of a filled-in form ----------
// The department's Senior Assessment and Curriculum Specialist creates and
// signs the Scope of Work outside this tool; the department just uploads
// the finished PDF here. Complete = a PDF is on file. Uploading it IS the
// completion signal — there's no separate signature-collection step to
// track, since the document already carries its signatures when it arrives.
function sowIsComplete(sow){
  return !!(sow && sow.fileData);
}

// data:URL -> Blob, for opening/downloading a stored PDF without keeping a
// live object URL around between renders.
function dataURLtoBlob(dataURL){
  const [meta, b64] = dataURL.split(',');
  const mime = (meta.match(/:(.*?);/) || [,'application/pdf'])[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// VI. Course Content - reads courses from IV, pillars from III
// ---------- Course outcomes: one box per outcome, each tied to a pillar ----------
// Stored as [{text, pillar}]. Older entries kept outcomes as one block of
// text; those are split into one outcome per line the first time they load.
function outcomeListFrom(e, listKey, textKey, minBoxes){
  if(!Array.isArray(e[listKey])){
    const lines = str(e[textKey]).split(/\n+/).map(x=>x.replace(/^\s*(\d+[.)]|[-•*])\s*/,'').trim()).filter(Boolean);
    e[listKey] = lines.map(t=>({text:t, pillar:''}));
  }
  while(e[listKey].length < (minBoxes||0)) e[listKey].push({text:'', pillar:''});
  return e[listKey];
}
function filledOutcomes(list){ return (list||[]).filter(o=>str(o.text).trim()); }
function renderOutcomesEditor(host, list, pillars, onChange){
  host.innerHTML = list.map((o,i)=>`<div class="oc-row">
      <div class="oc-num">${i+1}</div>
      <div class="oc-main">
        <textarea data-oc="${i}" rows="2" placeholder="Students will be able to...">${esc(o.text)}</textarea>
        <div class="oc-pillar"><span>Connects to pillar</span>
          <select data-ocp="${i}"><option value="">${pillars.length ? 'Select a pillar' : 'No pillars defined yet (Deliverable III)'}</option>${pillars.map(p=>`<option value="${escAttr(p.name)}" ${o.pillar===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        </div>
      </div>
      ${list.length > 1 ? `<button class="oc-x" data-ocx="${i}" title="Remove this outcome">&times;</button>` : ''}
    </div>`).join('') + `<button class="btn small ghost" data-ocadd>+ Add another outcome</button>`;
  host.querySelectorAll('[data-oc]').forEach(el=>el.addEventListener('input', ()=>{ list[+el.dataset.oc].text = el.value; onChange(); }));
  host.querySelectorAll('[data-ocp]').forEach(el=>el.addEventListener('change', ()=>{ list[+el.dataset.ocp].pillar = el.value; onChange(); }));
  host.querySelectorAll('[data-ocx]').forEach(el=>el.addEventListener('click', ()=>{ list.splice(+el.dataset.ocx, 1); onChange(); renderOutcomesEditor(host, list, pillars, onChange); }));
  host.querySelector('[data-ocadd]').addEventListener('click', ()=>{ list.push({text:'', pillar:''}); onChange(); renderOutcomesEditor(host, list, pillars, onChange); host.querySelectorAll('textarea')[list.length-1].focus(); });
}
function outcomesHtml(list){
  const f = filledOutcomes(list);
  return f.length ? `<ol>${f.map(o=>`<li>${esc(o.text)}${o.pillar ? ` <i>(Pillar: ${esc(o.pillar)})</i>` : ''}</li>`).join('')}</ol>` : '';
}

// ---------- Stick Figure -> Transition Planning ----------
// Compares the program's Stick Figure with the catalog requirements it
// started from: revised courses (with what changed), new and restored
// courses, catalog courses deleted from the Stick Figure, and hours by area.
function sfBucket(area, subject){
  const a = normKey(area);
  if(a.includes('foundation') || str(subject).toUpperCase()==='FOUN') return 'foundation';
  if(a.includes('general education')) return 'genEd';
  return 'major';
}
function sfCode(subject, number){ return (str(subject) + ' ' + str(number)).trim(); }
function sfHours(list){
  // A "choose N" bundle counts N courses once, not every option.
  const seen = new Set(); let total = 0;
  list.forEach(c=>{
    const h = +c.hours || 5;
    if(c.group){ if(seen.has(c.group)) return; seen.add(c.group); total += (+c.groupSelectCount || 1) * h; }
    else total += h;
  });
  return total;
}
function stickFigureChanges(prog, rec){
  const seed = buildPreloadedCourses(prog) || [];
  const seedById = {}; seed.forEach(c=>{ seedById[c.id] = c; });
  const seeded = !!(rec && (rec.catalogPreloaded || (rec.courses||[]).some(c=>c.catalogPreloaded)));
  const current = (rec && Array.isArray(rec.courses)) ? rec.courses : (seed.length ? seed : []);
  const usingSeed = !(rec && Array.isArray(rec.courses));
  const out = {revised:[], added:[], removed:[], unchanged:0, unplaced:0, hours:{}, hasBaseline: seed.length>0 && (seeded || usingSeed)};
  current.forEach(c=>{
    const base = c.original || (c.catalogPreloaded && seedById[c.id] && seedById[c.id].original) || null;
    const area = c.requirementArea || (seedById[c.id] && seedById[c.id].requirementArea) || '';
    const bucket = sfBucket(area, c.subject);
    if(c.catalogPreloaded && !(c.year && c.quarter)) out.unplaced++;
    if(c.status==='new' || c.status==='restoration'){
      out.added.push({key:'new:'+c.id, id:c.id, code:sfCode(c.subject,c.number), title:c.title||'', status:c.status, bucket, placeholder:false});
    } else if(c.status==='placeholder_elective' && !c.catalogPreloaded){
      out.added.push({key:'new:'+c.id, id:c.id, code:'', title:c.title||'', status:'placeholder', bucket, placeholder:true});
    } else if(c.status==='revised'){
      const priorNumber = c.originalNumber || (base && base.number) || c.number;
      const changes = [];
      if(base){
        if(normKey(base.title)!==normKey(c.title)) changes.push('title');
        if(normKey(priorNumber)!==normKey(c.number)) changes.push('course number');
        if(normKey(base.prereqs)!==normKey(c.prereqs)) changes.push('prerequisites');
        if(normKey(base.summary)!==normKey(c.summary)) changes.push('course summary');
      } else if(c.originalNumber) changes.push('course number');
      out.revised.push({key:'rev:'+c.id, id:c.id, code:sfCode(c.subject,c.number), title:c.title||'',
        priorCode:sfCode(c.subject, priorNumber), priorTitle:(base && base.title) || c.title || '',
        priorPrereqs:(base && base.prereqs)||'', prereqs:c.prereqs||'', changes, reason:c.numberChangeReason||'', bucket});
    } else {
      out.unchanged++;
    }
  });
  if(out.hasBaseline && !usingSeed){
    const ids = new Set(current.map(c=>c.id));
    seed.forEach(sc=>{
      if(ids.has(sc.id)) return;
      out.removed.push({key:'rem:'+sc.id, id:sc.id, code:sfCode(sc.subject, sc.number), title:sc.title, bucket:sfBucket(sc.requirementArea, sc.subject), placeholder: sc.status==='placeholder_elective', group: sc.group||''});
    });
  }
  ['foundation','genEd','major'].forEach(b=>{
    out.hours[b] = {
      prior: seed.length ? sfHours(seed.filter(c=>sfBucket(c.requirementArea, c.subject)===b)) : null,
      now: sfHours(current.filter(c=>sfBucket(c.requirementArea || (seedById[c.id]||{}).requirementArea, c.subject)===b))
    };
  });
  out.priorCourses = seed.filter(c=>c.subject).map(c=>sfCode(c.subject,c.number)+' '+c.title);
  out.currentCourses = current.filter(c=>c.subject).map(c=>sfCode(c.subject,c.number)+' '+c.title);
  return out;
}
// "SUBJ 123 Title" typed or picked -> {code, title}
function sfSplit(text){
  const t = str(text).trim();
  const m = t.match(/^([A-Za-z]{2,5}\s*\d{3}[A-Za-z]?)\s*(.*)$/);
  return m ? {code: m[1].toUpperCase().replace(/\s+/,' '), title: m[2]} : {code:'', title:t};
}
// Rows for the student guide's equivalency tables, built from the changes
// and the department's answers (data.sfAnswers).
// Substitution courses for a new course: a list, taken as "any one of these"
// or "all of these together". Older answers kept a single course in a.sub.
function subsOf(a){
  if(Array.isArray(a.subs)) return a.subs;
  return a.sub ? [a.sub] : [];
}
function subsText(a){
  const list = subsOf(a).map(x=>str(x).trim()).filter(Boolean);
  if(!list.length) return '';
  if(list.length===1) return list[0];
  const joiner = a.subMode==='all' ? ' and ' : ' or ';
  return list.slice(0,-1).join(', ') + (list.length>2 ? ',' : '') + joiner + list[list.length-1] + (a.subMode==='all' ? ' (all required)' : '');
}
// Rows for the student guide's equivalency tables, built from the changes and
// the department's answers. A department can edit any row (overrides); its
// edits are kept until it resets the row.
function stickFigureRows(ch, answers, bucket, overrides){
  const rows = [];
  ch.revised.filter(r=>r.bucket===bucket).forEach(r=>{
    const notes = [];
    if(r.changes.length) notes.push('Revised: ' + r.changes.join(', ') + '.');
    if(r.changes.includes('prerequisites')) notes.push('New prerequisites: ' + (r.prereqs || 'none') + '.');
    notes.push('Completing ' + r.priorCode + ' satisfies this requirement.');
    rows.push({key:r.key, newText:(r.code+' '+r.title).trim(), priorText:(r.priorCode+' '+r.priorTitle).trim(), notes:notes.join(' ')});
  });
  ch.added.filter(r=>r.bucket===bucket).forEach(r=>{
    const a = answers[r.key] || {};
    const subs = subsText(a);
    rows.push({key:r.key, newText:(r.code+' '+r.title).trim(), priorText: a.none ? 'No prior equivalent' : (subs || 'Substitution to be determined'),
      notes: [r.status==='restoration' ? 'Restored course.' : (r.placeholder ? 'New elective slot.' : 'New course.'), a.notes||''].filter(Boolean).join(' ')});
  });
  ch.removed.filter(r=>r.bucket===bucket).forEach(r=>{
    const a = answers[r.key] || {};
    rows.push({key:r.key, newText: a.none ? 'No longer required' : (str(a.eq).trim() || 'Equivalent to be determined'), priorText:(r.code+' '+r.title).trim(),
      notes: ['Removed from the curriculum.', a.notes||''].filter(Boolean).join(' ')});
  });
  rows.forEach(row=>{
    const o = overrides && overrides[row.key];
    if(o){ ['newText','priorText','notes'].forEach(f=>{ if(o[f]!==undefined) row[f] = o[f]; }); row.edited = true; }
    // shape the export table expects
    row.newCode = row.newText; row.newTitle = ''; row.priorCode = row.priorText; row.priorTitle = '';
  });
  return rows;
}

    body.innerHTML = `<div class="card"><h2>Syllabus Planning</h2>
