<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Studio — Pitch Day Deliverables</title>
<style>
  :root{
    --navy:#1c2b4a; --navy-deep:#12203b; --gold:#c9a227; --gold-light:#e8d9a8;
    --paper:#faf9f6; --line:#d9d5cb; --ink:#22262e; --muted:#6b7280;
    --ok:#3a6b52; --danger:#8a3b3b;
    font-family:'Georgia',serif;
  }
  *{box-sizing:border-box;}
  body,.root{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;}
  .app{display:flex;min-height:100vh;background:var(--paper);}
  .rail{width:280px;background:var(--navy-deep);color:#ffffff;flex-shrink:0;padding:20px 16px;position:relative;transition:width .15s;}
  .rail-toggle{position:absolute;top:18px;right:10px;width:28px;height:28px;border-radius:5px;border:1px solid #3a4a75;background:#233459;color:#fff;cursor:pointer;font-size:15px;line-height:24px;padding:0;}
  .rail-toggle:hover{background:#3a4a75;}
  .app.rail-collapsed .rail{width:44px;padding:20px 8px;overflow:hidden;}
  .app.rail-collapsed .rail > *:not(.rail-toggle){display:none;}
  .app.rail-collapsed .rail-toggle{right:8px;}
  .main.seq-wide{padding:20px 18px;}
  .main.seq-wide .card.seq-card{padding:18px 14px;}
  .rail h1{font-family:Georgia,serif;font-size:21px;letter-spacing:.03em;margin:0 0 14px;color:#fff;font-weight:700;}
  .rail .sub{font-size:13px;color:#c7d1ea;margin-bottom:18px;letter-spacing:.05em;text-transform:uppercase;}
  .prog-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .prog-btn{text-align:left;background:#233459;border:1px solid #3a4a75;color:#ffffff;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:15.5px;font-weight:600;font-family:inherit;}
  .prog-btn:hover{background:#2d4270;border-color:var(--gold);}
  .prog-btn.active{background:var(--gold);color:#241d04;font-weight:700;border-color:var(--gold);}
  .add-prog{display:flex;gap:6px;margin-top:8px;}
  .add-prog input{flex:1;min-width:0;background:#233459;border:1px solid #3a4a75;color:#fff;padding:8px 10px;border-radius:5px;font-size:14.5px;}
  .add-prog button{background:var(--gold);border:none;color:#241d04;padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:700;font-size:14.5px;}
  .main{flex:1;padding:30px 38px;max-width:1900px;}
  .prog-title{font-family:Georgia,serif;font-size:29px;color:var(--navy);margin:0 0 3px;}
  .prog-meta{font-size:14px;color:var(--muted);margin-bottom:20px;}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;border-bottom:2px solid var(--line);padding-bottom:14px;}
  .tab{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:16px;cursor:pointer;font-size:14.5px;color:var(--navy);}
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 28px;margin-bottom:18px;}
  .card h2{font-family:Georgia,serif;color:var(--navy);font-size:22px;margin:0 0 5px;border-bottom:2px solid var(--gold);padding-bottom:9px;}
  .card .desc{font-size:14.5px;color:var(--muted);margin:7px 0 18px;line-height:1.55;}
  label{display:block;font-size:14px;font-weight:700;color:var(--navy);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.03em;}
  textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:15.5px;font-family:inherit;background:#fffdf8;}
  textarea{min-height:78px;resize:vertical;}
  table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px;}
  th{background:var(--navy);color:#fff;padding:8px 8px;text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;}
  td{border:1px solid var(--line);padding:6px;vertical-align:top;}
  td input,td textarea,td select{border:none;width:100%;background:transparent;font-size:14.5px;padding:4px;}
  td input:focus,td textarea:focus,td select:focus{background:#fff8e0;outline:1px solid var(--gold);}
  .row-actions{margin-top:10px;display:flex;gap:8px;}
  .btn{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:14.5px;font-weight:600;}
  .btn.gold{background:var(--gold);color:#2a2205;}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);}
  .btn.small{padding:5px 11px;font-size:13.5px;}
  .btn.danger{background:#8a3b3b;color:#fff;}
  .ui-modal-backdrop{position:fixed;inset:0;background:rgba(20,28,48,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;}
  .ui-modal{background:#fff;border-radius:8px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25);color:var(--ink);}
  .ui-modal h3{margin:0 0 8px;font-family:Georgia,serif;color:var(--navy);font-size:19px;}
  .ui-modal p{margin:0 0 12px;font-size:14.5px;line-height:1.45;}
  .ui-field{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:0 0 10px;}
  .ui-field input,.ui-field select{margin-top:4px;}
  .ui-field select{width:100%;border:1px solid var(--line);border-radius:5px;padding:9px 10px;font-size:15px;background:#fffdf8;}
  .ui-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .oc-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
  .oc-num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:6px;}
  .oc-main{flex:1;}
  .oc-main textarea{margin-bottom:4px;}
  .oc-pillar{display:flex;gap:8px;align-items:center;font-size:13px;color:#5b6478;}
  .oc-pillar select{flex:1;max-width:420px;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fffdf8;}
  .oc-x{background:transparent;border:1px solid var(--line);color:#8a3b3b;border-radius:50%;width:26px;height:26px;cursor:pointer;margin-top:6px;font-size:15px;}
  .sow-note{background:#fff4e5;border:1px solid #e0a96d;border-left:4px solid #c9822b;color:#5a3a10;border-radius:0 6px 6px 0;padding:10px 14px;font-size:14px;line-height:1.45;margin:0 0 14px;}
  .ref-box{background:#f4f6fa;border:1px solid #d6dce8;border-radius:6px;padding:12px 14px;margin:0 0 16px;}
  .ref-box h4{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#5b6478;}
  .ref-box table.sf-auto{background:#fff;}
  .ac-pillar{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 14px;background:#fffdf8;}
  .ac-pillar-head{font-family:Georgia,serif;color:var(--navy);font-size:18px;font-weight:700;}
  .ac-def{font-size:14px;color:#5b6478;margin:2px 0 10px;}
  .ac-row{display:grid;grid-template-columns:2fr 1.4fr 1.2fr 30px;gap:10px;align-items:start;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line);}
  .ac-col span{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
  .ac-col select{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px;background:#fff;}
  .ac-row .oc-x{margin-top:20px;}
  .sample-banner{background:#eef4fb;border:1px solid #c9d8ec;border-left:4px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 16px;font-size:14.5px;line-height:1.5;color:#23405f;margin:0 0 16px;}
  .sample-flow{margin-top:8px;font-size:13.5px;color:#3a4f6b;}
  .cc-box{border:1px solid #d9d5cb;border-radius:6px;padding:12px 14px;margin-bottom:12px;background:#fffdf8;}
  .cc-title{font-weight:700;color:var(--navy);font-size:16px;margin-bottom:6px;}
  h3.cc-section{font-family:Georgia,serif;color:var(--navy);font-size:18px;margin:18px 0 8px;}
  table.sf-auto{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:14px;}
  table.sf-auto th{background:#eef1f6;color:var(--navy);text-align:left;padding:6px 8px;border:1px solid var(--line);font-size:13px;}
  table.sf-edit textarea{width:100%;min-height:44px;font-size:13.5px;padding:6px 8px;}
  table.sf-auto td{padding:6px 8px;border:1px solid var(--line);vertical-align:top;}
  .sf-q{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 10px;background:#fffdf8;}
  .sf-q-title{font-weight:700;color:var(--navy);margin-bottom:4px;}
  .sf-tag{display:inline-block;font-size:11.5px;font-weight:600;background:#eef1f6;color:var(--navy);border-radius:10px;padding:1px 8px;margin-left:6px;}
  .sf-row{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
  .sf-row input[type=text]{flex:1;}
  .sf-none{font-size:13px;white-space:nowrap;display:flex;gap:4px;align-items:center;margin:0;}
  .copy-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 14px;}
  .copy-card h3{margin:0 0 4px;font-family:Georgia,serif;color:var(--navy);font-size:18px;}
  .copy-card .hint{font-size:13.5px;color:#5b6478;margin:0 0 10px;}
  .copy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;margin:8px 0 12px;}
  .copy-grid label{font-size:14px;display:flex;gap:6px;align-items:flex-start;}
  .copy-grid label.empty{color:#9aa1b0;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .status{font-size:13.5px;color:var(--ok);}
  .pill{display:inline-block;background:var(--gold-light);color:#5a4a0f;border-radius:10px;padding:3px 10px;font-size:13px;margin-left:6px;}
  .empty{color:var(--muted);font-style:italic;font-size:15px;padding:10px 0;}
  .flowhint{background:#f2f6f2;border-left:3px solid var(--ok);padding:9px 13px;font-size:13.5px;color:#2f4d3d;margin-bottom:14px;border-radius:0 5px 5px 0;}
  /* higher-specificity fix: rail inputs must stay dark-background/white-text
     even though the generic input[type=text] rule above sets a light background */
  .rail input[type=text]{background:#233459;color:#fff;}
  .rail input[type=text]::placeholder{color:#c7d1ea;}
  .family-group{margin-bottom:16px;}
  .family-name{font-size:17px;color:#ffffff;font-weight:800;letter-spacing:.01em;padding:4px 2px;margin-top:8px;font-family:Georgia,serif;}
  .fam-edit-btn{font-size:12px;color:#9aa5c0;cursor:pointer;font-weight:400;margin-left:4px;}
  .fam-edit-btn:hover{color:#fff;}
  .track-chip-wrap{position:relative;display:inline-flex;}
  .track-x-btn{position:absolute;top:-6px;right:-6px;background:#8a3b3b;color:#fff;border-radius:50%;width:16px;height:16px;font-size:11px;line-height:16px;text-align:center;cursor:pointer;display:none;}
  .track-chip-wrap:hover .track-x-btn{display:block;}
  .track-edit-btn{position:absolute;top:-6px;left:-6px;background:#3a4a75;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;cursor:pointer;display:none;}
  .track-chip-wrap:hover .track-edit-btn{display:block;}
  .track-row{display:flex;flex-wrap:wrap;gap:6px;}
  .track-row .prog-btn.track-btn{flex:0 0 auto;min-width:90px;text-align:center;}
  .add-track-btn{background:transparent;border:1px dashed #5a6c99;color:#c7d1ea;font-size:12.5px;padding:5px 9px;border-radius:5px;cursor:pointer;margin:4px 0 6px;font-weight:600;}
  .bulk-toggle{background:none;border:none;color:#c7d1ea;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px 0 0;font-weight:600;}
  .bulk-wrap textarea{width:100%;background:#233459;color:#fff;border:1px solid #3a4a75;border-radius:5px;font-size:13.5px;padding:7px 9px;min-height:70px;}
  .stepper{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0;margin-bottom:6px;}
  .step{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;padding:0 10px 10px;min-width:80px;}
  .step .circle{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:5px;}
  .step .lbl{font-size:12px;text-align:center;color:var(--muted);line-height:1.3;max-width:88px;}
  .step.active .circle{background:var(--navy);border-color:var(--navy);color:#fff;}
  .step.active .lbl{color:var(--navy);font-weight:700;}
  .step.done .circle{background:var(--gold);border-color:var(--gold);color:#2a2205;}
  .step:hover .circle{border-color:var(--gold);}
  .step:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 22px);width:calc(100% - 22px);height:2px;background:var(--line);}
  .nav-hint{font-size:13.5px;color:var(--muted);margin-bottom:10px;}
  .back-link{display:inline-block;font-size:14px;color:var(--navy);text-decoration:none;margin-bottom:14px;cursor:pointer;font-weight:600;}
  .back-link:hover{text-decoration:underline;}
  .landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .site-landing-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start;}
  @media (max-width:1000px){.site-landing-grid{grid-template-columns:1fr;}}
  .announce-form textarea{min-height:70px;}
  .announce-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:14px 16px;margin-bottom:12px;}
  .announce-meta{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .announce-body{font-size:14.5px;color:var(--ink);white-space:pre-line;line-height:1.5;}
  .announce-delete{background:none;border:none;color:#b04a4a;font-size:12px;cursor:pointer;text-decoration:underline;}
  .landing-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;cursor:pointer;transition:border-color .15s;}
  .landing-card:hover{border-color:var(--gold);}
  .landing-card .num{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.05em;}
  .landing-card h3{margin:5px 0 7px;font-size:17px;color:var(--navy);font-family:Georgia,serif;}
  .landing-card p{margin:0;font-size:14px;color:var(--muted);line-height:1.45;}
  .landing-card .badge{float:right;font-size:11.5px;padding:3px 9px;border-radius:9px;background:#eee;color:#777;}
  .landing-card .badge.done{background:#dff0e6;color:var(--ok);}
  .instr{margin:8px 0 16px;border:1px solid var(--gold-light);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;background:#fdfaf0;padding:12px 16px;}
  .instr .instr-label{font-size:12px;font-weight:700;color:#8a6d1a;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .instr .instr-body{font-size:14.5px;color:#3a3f4a;line-height:1.6;white-space:pre-line;}
  details.instr summary.instr-label{cursor:pointer;margin-bottom:0;list-style:none;}
  details.instr summary.instr-label::-webkit-details-marker{display:none;}
  details.instr summary.instr-label::before{content:'▸ ';}
  details.instr[open] summary.instr-label::before{content:'▾ ';}
  details.instr[open] summary.instr-label{margin-bottom:8px;}
  details.instr .instr-body{margin-top:4px;}
  .fhint{font-size:13.5px;color:#8a6d1a;font-style:italic;margin:-2px 0 6px;line-height:1.45;}
  .shint{font-size:14px;color:#6b7280;background:#f7f5ee;border-left:3px solid var(--gold-light);padding:9px 12px;margin:7px 0 11px;border-radius:0 5px 5px 0;line-height:1.55;white-space:pre-line;}
  .quick-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f2f6fb;border:1px solid #cddaf0;border-radius:5px;padding:8px 10px;margin-bottom:12px;}
  .quick-edit .qe-lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:#5a6c8f;font-weight:700;}
  .quick-edit input{width:auto;flex:1;min-width:80px;padding:6px 8px;font-size:14.5px;border:1px solid #cddaf0;background:#fff;}
  .quick-edit .qe-title{flex:2;min-width:150px;}
</style>
</head>

<div class="root">

<script>
// ---------- Storage backend ----------
// Inside Claude.ai's artifact preview, window.storage is provided by the
// host automatically. Outside it (e.g. hosted standalone on GitHub Pages),
// it doesn't exist -- so this defines it ourselves, backed by Supabase,
// but ONLY if nothing has already supplied it. Same file works in both
// places without editing anything else.
// Both backends are kept available: the host's storage (if any) is used
// first, and Supabase is a fallback the program list can switch to when the
// host's storage keeps failing.
window.__hostStorage = window.storage || null;

// ---------- Which set of saved records this copy uses ----------
// 'test': this copy keeps its own records in Supabase (every key starts with
// "studio-test::"), completely separate from the live Curriculum Studio. It
// can't read or change live data, and the live site can't see its data.
// 'live': this copy uses the live Curriculum Studio's records. Only the copy
// that replaces the live site should be set to 'live'.
const DATA_SET = 'test';
const DATA_PREFIX = DATA_SET === 'live' ? '' : 'studio-test::';
{
  (function(){
    const SUPABASE_URL = 'https://tkstnkdxefivxeubfyeu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Dm3G5t5tmiydMThQx60TDg_J1L_zzbG';
    const TABLE = 'app_state'; // reuses the table Claude.ai's own storage feature already writes to in this project
    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    };

    const NS = k => DATA_PREFIX + k;
    window.__supabaseStorage = {
      async get(key, shared){
        key = NS(key);
        const res = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?key=eq.' + encodeURIComponent(key) + '&select=key,value', { headers });
        if(!res.ok) throw new Error('storage.get failed: ' + res.status);
        const rows = await res.json();
        if(!rows.length) return null;
        return { key: rows[0].key.slice(DATA_PREFIX.length), value: rows[0].value, shared: true };
      },
      async set(key, value, shared){
        const plainKey = key; key = NS(key);
        const res = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?on_conflict=key', {
          method: 'POST',
          headers: Object.assign({}, headers, { Prefer: 'resolution=merge-duplicates,return=representation' }),
          body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
        });
        if(!res.ok) throw new Error('storage.set failed: ' + res.status);
        return { key: plainKey, value, shared: true };
      },
      async delete(key, shared){
        const plainKey = key; key = NS(key);
        const res = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?key=eq.' + encodeURIComponent(key), {
          method: 'DELETE', headers
        });
        if(!res.ok) throw new Error('storage.delete failed: ' + res.status);
        return { key: plainKey, deleted: true, shared: true };
      },
      async list(prefix, shared){
        const full = NS(prefix || '');
        const filter = full ? '&key=like.' + encodeURIComponent(full) + '*' : '';
        const res = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?select=key' + filter, { headers });
        if(!res.ok) throw new Error('storage.list failed: ' + res.status);
        const rows = await res.json();
        return { keys: rows.map(r=>r.key).filter(k=>k.startsWith(full)).map(k=>k.slice(DATA_PREFIX.length)), prefix, shared: true };
      }
    };
  })();
}
if (!window.storage) window.storage = window.__supabaseStorage;

// ---------- Sample program (test copy only) ----------
// A completed Fashion Marketing and Management BFA, written to fit the FASM
// Scope of Work, showing every deliverable filled in and how each feeds the
// next. Its records are served whenever nothing has been saved under the same
// key, so the sample always appears; anything a tester saves replaces it, and
// "Restore the sample" on the program overview removes those saves again.

, \"title\": \"Free elective\", \"prereqs\": \"\", \"summary\": \"\", \"status\": \"placeholder_elective\", \"ownership\": \"owned_elsewhere\", \"owningProgram\": \"\", \"owningYear\": \"\", \"owningQuarter\": \"\", \"owningNotes\": \"\", \"isShared\": false, \"sharedNotes\": \"\", \"prereqRationale\": \"\", \"needsRevision\": false, \"revisionProgram\": \"\", \"revisionNotes\": \"\", \"group\": \"\", \"groupSelectCount\": 1, \"requirementArea\": \"Additional Electives\", \"hours\": 5, \"catalogPreloaded\": \"2026-2027\", \"original\": {\"title\": \"Free elective\", \"number\": \"\", \"prereqs\": \"\", \"summary\": \"\"}, \"order\": 3}, {\"id\": 39, \"year\": \"4\", \"quarter\": \"2\", \"order\": 1, \"subject\": \"FASM\", \"number\": \"450\", \"title\": \"Capstone I: Industry Research and Concept Development\", \"prereqs\": \"FASM 400 and FASM 419\", \"summary\": \"Students begin a two-quarter capstone by researching a real industry challenge with a partner brand, analyzing market and customer data, and developing a strategic concept to complete in FASM 430.\", \"status\": \"new\", \"ownership\": \"owned\", \"owningProgram\": \"\", \"owningYear\": \"\", \"owningQuarter\": \"\", \"owningNotes\": \"\", \"isShared\": false, \"sharedNotes\": \"\", \"prereqRationale\": \"\", \"needsRevision\": false, \"revisionProgram\": \"\", \"revisionNotes\": \"\", \"group\": \"\", \"groupSelectCount\": 1, \"requirementArea\": \"Major Curriculum\", \"hours\": 5, \"originalNumber\": \"\", \"numberChangeReason\": \"\"}], \"nextId\": 40, \"electiveShells\": [{\"id\": \"shell_sample_capstone\", \"year\": \"4\", \"quarter\": \"1\", \"groupName\": \"FASM 479, 500-level SCADpro elective, or Business-focused elective\", \"selectCount\": 1}], \"catalogPreloaded\": \"2026-2027\", \"placeholderOwnershipRule\": 1, \"hoursRule\": 1}", "prog:bi-fashion-marketing-and-management-bfa:story": "{\"headline\": \"SCAD Fashion Marketing and Management graduates now leave with a two-quarter industry capstone, leadership experience, and hands-on fluency in retail analytics and AI.\", \"problem\": \"Employers told us our graduates arrived with strong product and trend knowledge but limited experience leading teams, reading retail data, and using AI tools that are now part of everyday merchandising work. Students told us the capstone came too late and was too short to produce work that stood out in interviews. Portfolio reviews confirmed it: projects were polished but rarely grounded in research or data.\", \"experience\": \"Students now begin their capstone in the fall of their senior year with FASM 450 Capstone I, researching a real industry challenge with a partner brand, and finish it in FASM 430 Capstone II by presenting a complete strategy and portfolio to an industry panel. Leadership is taught directly in FASM 400 Leadership and Contemporary Issues in Fashion, where students lead teams through case challenges on AI, sustainability, and omnichannel growth. FASM 440 now asks students to tell a brand's story across every channel a customer touches.\", \"jobsQuote\": \"Graduates are prepared for roles as assistant buyers, merchandise planners and allocation analysts, product development coordinators, omnichannel and e-commerce merchandisers, brand and marketing coordinators, and retail management trainees, with a clear path toward buying, planning, and brand leadership roles.\", \"mentorQuote\": \"\\\"The students who stand out in our interviews can walk me through a decision they made with data and explain how they led a team to get there. This curriculum builds exactly that.\\\" (Sample quote: director of merchandise planning, industry advisory partner)\", \"gettingStarted\": \"Incoming students follow the Fall 2027 program of study, beginning with Foundation Studies and business fundamentals. Current students can review the transition guide with their success adviser to decide whether updating to the new catalog year fits their plans.\", \"announcement\": \"\"}", "prog:bi-fashion-marketing-and-management-bfa:research": "{\"levelUp\": \"The program's Level Up Score shows strong performance in enrollment and employment in field, with the clearest opportunity in portfolio quality at graduation. Capstone and portfolio scores from the last two assessment cycles were the lowest of the program's measures, which directly informed the move to a two-quarter capstone.\", \"peerPrograms\": [{\"link\": \"Fashion Institute of Technology, Fashion Business Management BS (fitnyc.edu)\"}, {\"link\": \"LIM College, Fashion Merchandising BBA (limcollege.edu)\"}, {\"link\": \"Parsons School of Design, Strategic Design and Management BBA (newschool.edu/parsons)\"}, {\"link\": \"Kent State University, Fashion Merchandising BS (kent.edu/fashion)\"}], \"peerAnalysis\": \"Peer programs increasingly pair merchandising coursework with dedicated analytics and leadership content, and most now offer an extended or industry-sponsored capstone. Our program remains distinctive for its creative and visual communication strengths; the revision keeps those strengths while closing the gaps in analytics, AI, and leadership.\", \"industryTrends\": \"Retail employers report rising demand for merchandising professionals who can work with planning and allocation data, use AI-assisted forecasting and assortment tools, and manage omnichannel customer journeys. Sustainability and transparent sourcing continue to shape product development and brand strategy decisions.\", \"targetJobs\": \"Assistant buyer; merchandise planner and allocation analyst; product development coordinator; omnichannel and e-commerce merchandiser; brand and marketing coordinator; retail management trainee.\", \"jobVolume\": \"Merchandising, buying, and planning roles remain steady across national retailers, brands, and e-commerce companies, with the strongest growth in analytics-related and omnichannel positions. Demand is sufficient to support the major long-term.\", \"roi\": \"Starting salaries for assistant buyer, planning, and analyst roles are competitive for the field, and the analytics and leadership skills added in this revision align with the higher-paying positions in the career path.\", \"contacts\": [{\"name\": \"Jordan Ellis (sample)\", \"title\": \"Director of Merchandise Planning\", \"company\": \"Harbor and Pine Apparel (fictional)\", \"email\": \"\", \"linkedin\": \"\"}, {\"name\": \"Priya Raman (sample)\", \"title\": \"Vice President, Omnichannel Merchandising\", \"company\": \"Meridian Department Stores (fictional)\", \"email\": \"\", \"linkedin\": \"\"}, {\"name\": \"Marcus Lee (sample)\", \"title\": \"Sourcing and Sustainability Manager\", \"company\": \"Coastline Brands Group (fictional)\", \"email\": \"\", \"linkedin\": \"\"}]}", "prog:bi-fashion-marketing-and-management-bfa:pillars": "{\"pillars\": [{\"name\": \"Merchandising Analytics and AI\", \"definition\": \"Students use merchandising data, planning math, and AI-assisted tools to forecast demand, build assortments, and make and defend business decisions.\", \"industry\": \"Planning, allocation, and buying roles now rely on data platforms and AI forecasting; employers named analytics as the top skill gap in recent hires.\", \"measurement\": \"Assortment plans, forecasting exercises, and the analytics component of the capstone.\"}, {\"name\": \"Leadership and Professional Practice\", \"definition\": \"Students lead teams, communicate and negotiate with confidence, and act ethically and professionally in fashion business settings.\", \"industry\": \"Employers expect entry-level hires to manage projects and cross-functional teams quickly; leadership was repositioned as a core competency in the Scope of Work.\", \"measurement\": \"Team leadership in case challenges, internship evaluations, and the capstone industry presentation.\"}, {\"name\": \"Omnichannel Brand Strategy and Visual Communication\", \"definition\": \"Students build brand and product stories that work across physical, digital, and social channels, and communicate them visually and persuasively.\", \"industry\": \"Retail growth is driven by omnichannel experiences; brands need merchandisers who can connect product, customer, and channel.\", \"measurement\": \"Omnichannel brand campaigns and the professional portfolio.\"}, {\"name\": \"Global Sourcing and Sustainable Product Development\", \"definition\": \"Students develop products and sourcing strategies that balance cost, quality, speed to market, and social and environmental responsibility.\", \"industry\": \"Sustainability and transparent supply chains shape sourcing decisions across the industry and are increasingly expected by customers and investors.\", \"measurement\": \"Private label development projects, sourcing plans, and the capstone's sustainability analysis.\"}]}", "prog:bi-fashion-marketing-and-management-bfa:pillarmap": "{\"levels\": {\"c8\": {\"Merchandising Analytics and AI\": \"I\", \"Leadership and Professional Practice\": \"I\"}, \"c7\": {\"Leadership and Professional Practice\": \"I\"}, \"c13\": {\"Merchandising Analytics and AI\": \"I\", \"Omnichannel Brand Strategy and Visual Communication\": \"I\"}, \"c18\": {\"Global Sourcing and Sustainable Product Development\": \"I\"}, \"c19\": {\"Global Sourcing and Sustainable Product Development\": \"I\"}, \"c20\": {\"Omnichannel Brand Strategy and Visual Communication\": \"I\"}, \"c21\": {\"Omnichannel Brand Strategy and Visual Communication\": \"I\", \"Global Sourcing and Sustainable Product Development\": \"I\"}, \"c22\": {\"Merchandising Analytics and AI\": \"I\"}, \"c23\": {\"Merchandising Analytics and AI\": \"R\"}, \"c24\": {\"Omnichannel Brand Strategy and Visual Communication\": \"I\"}, \"c25\": {\"Global Sourcing and Sustainable Product Development\": \"R\", \"Merchandising Analytics and AI\": \"R\"}, \"c26\": {\"Merchandising Analytics and AI\": \"R\", \"Leadership and Professional Practice\": \"R\", \"Global Sourcing and Sustainable Product Development\": \"R\"}, \"c27\": {\"Leadership and Professional Practice\": \"R\"}, \"c28\": {\"Omnichannel Brand Strategy and Visual Communication\": \"R\", \"Merchandising Analytics and AI\": \"R\"}, \"c29\": {\"Merchandising Analytics and AI\": \"R\", \"Omnichannel Brand Strategy and Visual Communication\": \"R\"}, \"c30\": {\"Global Sourcing and Sustainable Product Development\": \"S\"}, \"c31\": {\"Leadership and Professional Practice\": \"S\", \"Omnichannel Brand Strategy and Visual Communication\": \"S\", \"Merchandising Analytics and AI\": \"S\"}, \"c32\": {\"Omnichannel Brand Strategy and Visual Communication\": \"S\", \"Merchandising Analytics and AI\": \"R\"}, \"c33\": {\"Leadership and Professional Practice\": \"R\"}, \"c39\": {\"Merchandising Analytics and AI\": \"S\", \"Leadership and Professional Practice\": \"R\", \"Global Sourcing and Sustainable Product Development\": \"R\"}}}", "prog:bi-fashion-marketing-and-management-bfa:coursecontent": "{\"entries\": {\"c39\": {\"description\": \"In the first quarter of a two-quarter capstone, students partner with an industry brand to research a real business challenge. Students gather and analyze market, customer, and sales data, use AI-assisted tools to test forecasts and scenarios, and develop a strategic concept that is presented to the partner for feedback. The concept and research become the foundation for the professional portfolio and industry presentation completed in FASM 430.\", \"outcomeList\": [{\"text\": \"Analyze market, customer, and sales data to define a fashion business problem and its opportunity.\", \"pillar\": \"Merchandising Analytics and AI\"}, {\"text\": \"Develop a strategic concept that addresses the problem, supported by research, forecasting, and AI-assisted analysis.\", \"pillar\": \"Merchandising Analytics and AI\"}, {\"text\": \"Evaluate the sourcing and sustainability implications of the proposed concept.\", \"pillar\": \"Global Sourcing and Sustainable Product Development\"}, {\"text\": \"Lead a project team through a research plan, timeline, and partner check-ins.\", \"pillar\": \"Leadership and Professional Practice\"}]}, \"c26\": {\"revDescription\": \"This course examines the issues reshaping fashion retail today, including artificial intelligence, data-driven decision making, sustainability, and omnichannel growth, and develops the leadership skills students need to respond to them. Working in rotating teams, students lead competitive case challenges, present recommendations to guest industry leaders, and reflect on their own leadership practice.\", \"revOutcomeList\": [{\"text\": \"Analyze a current industry issue using market data and AI-assisted research tools.\", \"pillar\": \"Merchandising Analytics and AI\"}, {\"text\": \"Lead a team through a case challenge, delegating roles and resolving conflict.\", \"pillar\": \"Leadership and Professional Practice\"}, {\"text\": \"Recommend and defend a business response to an industry issue in a professional presentation.\", \"pillar\": \"Leadership and Professional Practice\"}, {\"text\": \"Assess the sustainability and ethical implications of a proposed business strategy.\", \"pillar\": \"Global Sourcing and Sustainable Product Development\"}]}, \"c31\": {\"revDescription\": \"In the second quarter of the capstone, students complete the strategy developed in FASM 450 Capstone I. Students refine their concept with partner feedback, build a professional portfolio that documents their research, analysis, and creative direction, and present the finished project to an industry panel. The course also prepares students for interviews, networking, and career launch.\", \"revOutcomeList\": [{\"text\": \"Produce a professional portfolio that communicates a complete fashion business strategy.\", \"pillar\": \"Omnichannel Brand Strategy and Visual Communication\"}, {\"text\": \"Present and defend a capstone strategy to an industry panel.\", \"pillar\": \"Leadership and Professional Practice\"}, {\"text\": \"Integrate partner feedback and performance data to refine a strategic recommendation.\", \"pillar\": \"Merchandising Analytics and AI\"}]}, \"c32\": {\"revDescription\": \"Students develop the visual and narrative skills to tell a brand's story across every channel a customer touches, from stores and windows to e-commerce, social media, and clienteling. Students analyze omnichannel customer journeys and produce portfolio-quality campaigns that connect product, customer, and channel.\", \"revOutcomeList\": [{\"text\": \"Design a cohesive brand story across physical, digital, and social channels.\", \"pillar\": \"Omnichannel Brand Strategy and Visual Communication\"}, {\"text\": \"Analyze an omnichannel customer journey to identify opportunities for engagement.\", \"pillar\": \"Omnichannel Brand Strategy and Visual Communication\"}, {\"text\": \"Use channel performance data to evaluate and improve a visual campaign.\", \"pillar\": \"Merchandising Analytics and AI\"}]}}}", "prog:bi-fashion-marketing-and-management-bfa:assessment": "{\"criteria\": [{\"pillar\": \"Merchandising Analytics and AI\", \"criteria\": \"Calculates and interprets key merchandising metrics (sell-through, turnover, gross margin) to evaluate performance.\", \"course\": \"FASM 245 — Retail Buying Simulation\", \"artifact\": \"Assortment plan and buying simulation\"}, {\"pillar\": \"Merchandising Analytics and AI\", \"criteria\": \"Builds a demand forecast using historical data and AI-assisted tools, and explains its assumptions.\", \"course\": \"FASM 450 — Capstone I: Industry Research and Concept Development\", \"artifact\": \"Capstone research and forecasting report\"}, {\"pillar\": \"Merchandising Analytics and AI\", \"criteria\": \"Uses data to support and defend a strategic business recommendation.\", \"course\": \"FASM 430 — Capstone II: Professional Portfolio and Industry Presentation\", \"artifact\": \"Capstone industry presentation\"}, {\"pillar\": \"Leadership and Professional Practice\", \"criteria\": \"Leads a team by setting goals, assigning roles, and keeping work on schedule.\", \"course\": \"FASM 400 — Leadership and Contemporary Issues in Fashion\", \"artifact\": \"Leadership case challenge and team reflection\"}, {\"pillar\": \"Leadership and Professional Practice\", \"criteria\": \"Communicates and negotiates professionally with partners and stakeholders.\", \"course\": \"FASM 410 — Retail Management\", \"artifact\": \"Negotiation role-play\"}, {\"pillar\": \"Leadership and Professional Practice\", \"criteria\": \"Presents and defends a recommendation to industry professionals with confidence.\", \"course\": \"FASM 430 — Capstone II: Professional Portfolio and Industry Presentation\", \"artifact\": \"Capstone industry presentation\"}, {\"pillar\": \"Omnichannel Brand Strategy and Visual Communication\", \"criteria\": \"Creates a cohesive brand story across physical, digital, and social channels.\", \"course\": \"FASM 440 — Visual Communication and Omnichannel Storytelling\", \"artifact\": \"Omnichannel brand campaign\"}, {\"pillar\": \"Omnichannel Brand Strategy and Visual Communication\", \"criteria\": \"Maps a customer journey and identifies channel-specific opportunities.\", \"course\": \"FASM 440 — Visual Communication and Omnichannel Storytelling\", \"artifact\": \"Customer journey analysis\"}, {\"pillar\": \"Omnichannel Brand Strategy and Visual Communication\", \"criteria\": \"Produces a professional portfolio that communicates strategy visually.\", \"course\": \"FASM 430 — Capstone II: Professional Portfolio and Industry Presentation\", \"artifact\": \"Professional portfolio\"}, {\"pillar\": \"Global Sourcing and Sustainable Product Development\", \"criteria\": \"Evaluates sourcing options for cost, quality, speed to market, and responsibility.\", \"course\": \"FASM 420 — Global Sourcing and Import Buying for Fashion\", \"artifact\": \"Global sourcing plan\"}, {\"pillar\": \"Global Sourcing and Sustainable Product Development\", \"criteria\": \"Develops a private label product that meets a target customer's needs.\", \"course\": \"FASM 310 — Private Label Product Development\", \"artifact\": \"Private label line development project\"}, {\"pillar\": \"Global Sourcing and Sustainable Product Development\", \"criteria\": \"Assesses the sustainability impact of a product or business strategy.\", \"course\": \"FASM 450 — Capstone I: Industry Research and Concept Development\", \"artifact\": \"Capstone sustainability analysis\"}]}", "prog:bi-fashion-marketing-and-management-bfa:transition": "{\"whatWhy\": \"Beginning Fall 2027, the Fashion Marketing and Management BFA has a two-quarter capstone (new FASM 450 followed by a revised FASM 430), a leadership-focused FASM 400, and an omnichannel-focused FASM 440. The changes respond to employer, alumni, and portfolio assessment evidence calling for stronger capstone work, leadership preparation, and analytics and AI skills.\", \"fact1\": \"Students are not required to change catalog years; current students can finish under their existing program of study.\", \"fact2\": \"The capstone is now two quarters: FASM 450 (fall of senior year) is the prerequisite for FASM 430.\", \"fact3\": \"The total program remains 180 hours; one free elective was removed to make room for FASM 450.\", \"cohorts\": [{\"group\": \"Students currently in the program (pre-change)\", \"impact\": \"May stay on their current catalog year with no additional courses. Students who have not yet taken FASM 430 should discuss with their adviser whether updating to the new capstone sequence makes sense.\"}, {\"group\": \"Students entering under the new curriculum\", \"impact\": \"Follow the Fall 2027 program of study, including FASM 450 and FASM 430 as a two-quarter capstone in the senior year.\"}, {\"group\": \"Students mid-sequence in affected courses\", \"impact\": \"Students who completed FASM 400 or FASM 440 under the previous titles receive full credit; the courses keep their numbers. Students who completed FASM 430 before Fall 2027 may use it in place of FASM 450 if they update.\"}, {\"group\": \"Transfer students\", \"impact\": \"Transfer credit is evaluated against the Fall 2027 program of study; there are no changes to Foundation Studies or General Education requirements.\"}], \"edgeCases\": \"A student who completed the previous FASM 430 and wants to update to the new catalog should be referred to the department before registering, so the substitution for FASM 450 can be confirmed. Students planning to take FASM 430 in Spring 2027 under the old prerequisites should be advised before Winter registration.\", \"contact\": \"Senior Assessment and Curriculum Specialist, Curriculum and Assessment (curriculum@scad.edu); FASM department chair for course substitution questions; Registrar for Degree Planner and Banner questions.\", \"studentGuide\": {\"effectiveTerm\": \"Fall 2027\", \"foundation\": [], \"genEd\": [], \"major\": [], \"genEdNotes\": \"\", \"majorNotes\": \"\", \"foundationTotalNew\": \"30\", \"foundationTotalPrior\": \"30\", \"genEdTotalNew\": \"55\", \"genEdTotalPrior\": \"55\", \"majorTotalNew\": \"95\", \"majorTotalPrior\": \"95\"}, \"sfAnswers\": {\"new:39\": {\"subs\": [\"FASM 430 Professional Portfolio Practices\"], \"notes\": \"For students who completed FASM 430 before Fall 2027 only.\"}, \"rem:38\": {\"eq\": \"One of the two remaining free electives\", \"notes\": \"Students who have already taken three free electives may apply the extra course toward a business-focused elective with department approval.\"}}, \"sfOverrides\": {}}", "prog:bi-fashion-marketing-and-management-bfa:resources": "{\"faculty\": [{\"name\": \"Faculty member A (sample)\", \"expertise\": \"Merchandising and planning analytics\", \"courses\": \"FASM 220, FASM 245, FASM 450\", \"contracted\": \"6\", \"capacity\": \"1\", \"cannotTeach\": \"FASM 440\"}, {\"name\": \"Faculty member B (sample)\", \"expertise\": \"Retail leadership and brand management\", \"courses\": \"FASM 400, FASM 410, FASM 430\", \"contracted\": \"6\", \"capacity\": \"0\", \"cannotTeach\": \"FASM 420\"}, {\"name\": \"Faculty member C (sample)\", \"expertise\": \"Visual merchandising and digital presentation\", \"courses\": \"FASM 210, FASM 440, FASM 215\", \"contracted\": \"6\", \"capacity\": \"1\", \"cannotTeach\": \"FASM 220\"}, {\"name\": \"Faculty member D (sample)\", \"expertise\": \"Product development and global sourcing\", \"courses\": \"FASM 310, FASM 420, FASM 419\", \"contracted\": \"6\", \"capacity\": \"0\", \"cannotTeach\": \"FASM 400\"}], \"newFaculty\": [], \"training\": [], \"hardware\": [], \"software\": [], \"space\": [], \"equipment\": []}", "prog:bi-fashion-marketing-and-management-bfa:syllabus": "{\"entries\": {\"c39\": {\"sessions\": [{\"content\": \"Course overview, capstone structure across FASM 450 and FASM 430, and partner brand introductions.\"}, {\"content\": \"Defining a business problem: reading the partner brief and framing research questions.\"}, {\"content\": \"Research methods for fashion business: secondary research, interviews, and surveys.\"}, {\"content\": \"Team formation, roles, and the project charter; leadership expectations for the capstone.\"}, {\"content\": \"Market analysis: competitors, positioning, and white space.\"}, {\"content\": \"Customer analysis: segments, personas, and journey mapping.\"}, {\"content\": \"Working with sales and inventory data: key metrics and what they reveal.\"}, {\"content\": \"Demonstration: AI-assisted forecasting and scenario tools, with discussion of limits and ethics.\"}, {\"content\": \"Lab: building a demand forecast for the partner category.\"}, {\"content\": \"Research plan check-in with the partner brand (team presentations).\"}, {\"content\": \"Sustainability and sourcing: evaluating the impact of a proposed concept.\"}, {\"content\": \"Synthesizing research into insights: from data to opportunity statements.\"}, {\"content\": \"Concept development workshop: generating and testing strategic options.\"}, {\"content\": \"Financial feasibility: margin, pricing, and investment for the concept.\"}, {\"content\": \"Peer critique of draft concepts and forecasting models.\"}, {\"content\": \"Storytelling the strategy: structuring the concept presentation.\"}, {\"content\": \"Leadership reflection: team performance review and adjustments.\"}, {\"content\": \"Rehearsal of concept presentations with faculty feedback.\"}, {\"content\": \"Concept presentations to the partner brand.\"}, {\"content\": \"Planning for FASM 430: integrating partner feedback and setting portfolio goals.\"}], \"grading\": [{\"title\": \"Problem definition and research plan\", \"weight\": \"10%\", \"explanation\": \"Team defines the partner's business problem and submits a research plan with questions, methods, and timeline.\", \"outcome\": \"Outcome 1: Analyze market, customer, and sales data to define a fashion business problem and its opportunity.\"}, {\"title\": \"Market and customer analysis\", \"weight\": \"20%\", \"explanation\": \"Individual analysis of competitors, customer segments, and sales data that identifies the opportunity.\", \"outcome\": \"Outcome 1: Analyze market, customer, and sales data to define a fashion business problem and its opportunity.\"}, {\"title\": \"Forecasting model\", \"weight\": \"15%\", \"explanation\": \"Demand forecast built with historical data and AI-assisted tools, with written explanation of assumptions.\", \"outcome\": \"Outcome 2: Develop a strategic concept that addresses the problem, supported by research, forecasting, and AI-assisted analysis.\"}, {\"title\": \"Sustainability and sourcing assessment\", \"weight\": \"15%\", \"explanation\": \"Evaluation of the sourcing options and sustainability impact of the proposed concept.\", \"outcome\": \"Outcome 3: Evaluate the sourcing and sustainability implications of the proposed concept.\"}, {\"title\": \"Concept presentation to partner\", \"weight\": \"25%\", \"explanation\": \"Team presents the strategic concept, supported by research and forecasting, to the partner brand.\", \"outcome\": \"Outcome 2: Develop a strategic concept that addresses the problem, supported by research, forecasting, and AI-assisted analysis.\"}, {\"title\": \"Team leadership log and reflection\", \"weight\": \"15%\", \"explanation\": \"Documentation of team roles, meetings, and decisions, with an individual reflection on leadership.\", \"outcome\": \"Outcome 4: Lead a project team through a research plan, timeline, and partner check-ins.\"}]}}, \"selected\": \"c39\"}", "prog:bi-fashion-marketing-and-management-bfa:feedback": "{\"messages\": [{\"id\": \"m0\", \"author\": \"FASM Department Chair (sample)\", \"role\": \"Department\", \"text\": \"We've loaded the revised sequence into the Stick Figure. FASM 450 is in fall of senior year so FASM 430 can follow in spring. Could you confirm the capstone placement works for scheduling?\", \"ts\": 1790560314363}, {\"id\": \"m1\", \"author\": \"Senior Assessment and Curriculum Specialist (sample)\", \"role\": \"Senior Assessment and Curriculum Specialist\", \"text\": \"The placement works and the hours still total 180. Please make sure the FASM 450 outcomes are each tied to a pillar in Course Content before the January review.\", \"ts\": 1790646714363}, {\"id\": \"m2\", \"author\": \"FASM Department Chair (sample)\", \"role\": \"Department\", \"text\": \"Done. We also confirmed FASM 215 and FASM 310 stay at syllabus-level updates only, as agreed in the Scope of Work.\", \"ts\": 1790733114363}, {\"id\": \"m3\", \"author\": \"Senior Assessment and Curriculum Specialist (sample)\", \"role\": \"Senior Assessment and Curriculum Specialist\", \"text\": \"Thank you. Transition Planning looks complete; I'll share the advising documentation with Student Success and Advising once approvals are in by February 1.\", \"ts\": 1790819514363}]}", "prog:family:bi-fashion-marketing-and-management:undergrad:sow": "{\"fileName\": \"FASM Sc       return res;

    set: (k, v, sh)=>store.set(k, v, sh),
    delete: (k, sh)=>store.delete(k, sh),
    async list(prefix, shared){

      Object.keys(SAMPLE_RECORDS).forEach(k=>{ if(!prefix || k.startsWith(prefix)) keys.add(k); });

  };

const FULL_INSTRUCTIONS = {
  story: `The goal is to describe the finished experience for a student and family, in plain language, before getting into mechanics. Use past tense throughout, as if the change has already launched.

Write a short announcement for admission (250 to 400 words) as if this program has already launched. Write it for the audience who will actually hear it: a prospective student, a parent, or an industry partner.

Include: a headline (one sentence, the hook); the problem this solves for students or the field; what is different about the student experience; a quote from a student or graduate describing the outcome; a quote from a faculty lead or department chair on why this matters; and how a student gets started.`,
  research: `You must conduct thoughtful research to ensure your program delivers the best possible degree for students. This research foundation will inform every decision you make and ensure your program maintains relevance, competitiveness, and student success.

Our commitment to excellence requires understanding three critical areas: industry demands, current student needs, and competitive positioning. If you have any of this information from your intake process, feel free to copy and paste it in.

Level Up Score Interpretation: find language from the previous prospectus.

Higher Education Research Interpretation / Competitive Position: paste links to at least three other higher-education programs similar to SCAD's offering, then in 2–3 sentences explain how these peer programs shaped your thinking, or how your enhancement distinguishes SCAD from them.

Market Trend Data Interpretation / Industry Trend Interpretation: what key industry and market trends are you observing that impact your academic program? Describe significant developments, disruptions, or shifts in your field/industry that have implications for your curriculum. Interpretation should include impacts of AI on the field (utilize the SCADask AI State of Design and Industry Outlook documents).

The ROI Test — address: target jobs (what positions will graduates be qualified for); is there enough demand for these jobs to support the major long-term; and return on investment (do starting salaries justify the cost of the degree)?

Industry Connection: list at least three industry contacts who would provide input on your revision and serve as future mentors of your program.`,
  pillars: `Identify 3–5 core pillars of knowledge/skill that define your program. These pillars should represent the essential competencies that students must develop to be workforce-ready upon program completion.

Note: if your department already has established program outcomes, you may refine them to better align with the pillar structure, or start fresh with new pillars if the current outcomes don't capture the essence of your program.

For each pillar, define: what the pillar means for your program; how it directly prepares students for industry expectations; and what kind of work artifact demonstrates mastery of it.`,
  stickfigure: `This is not for the first iteration of your program, maybe not even the fifth. Create many, think about market fit, feasibility, and innovation, then dig deeper and make another.

Complete the course table for each required course in your planned curriculum. This table showcases the courses all students will be required to take. If it is a directed elective option, display the number of selections students will take, to distinguish that they will not be taking every course in the list.

Now that you have mapped your courses to your program pillars, you understand what skills and knowledge students need to succeed in each class. The next step is to create a logical sequence that ensures students can progress smoothly through their degree while building the necessary foundation for success in each course. If you are incorporating courses owned by other majors, consult their sequence for when the course(s) are typically offered — see catalog.scad.edu.

Assign prerequisites strategically: for each course, ask what specific skills from your pillar mapping a student needs to succeed in it, which previous courses develop those exact skills, and what the minimum prerequisite requirement is that ensures success without creating barriers.

Once sequencing is complete: test the sequence with sample student scenarios; identify any scheduling conflicts or impossible pathways; refine prerequisites based on your analysis. The goal is a pathway that supports student success while ensuring students graduate workforce-ready with all program pillars fully developed.`,
  pillarmap: `The Pillar Mapping deliverable helps you think through skill and knowledge development for your entire program of study. By mapping where students are introduced to new knowledge and skills, where you reinforce that knowledge and skill, and where they showcase synthesis, you scaffold your curriculum, progress rigor throughout, and reveal a proper sequence for traversing the program.

For undergraduate curricula, add your foundation studies and general education courses along with your major curriculum.

For each course, indicate the level of pillar development: I = Introduced (students first encounter this pillar concept); R = Reinforced (students practice and build upon previous pillar knowledge); S = Synthesized (students integrate this pillar with others at an advanced level).

Quality Assurance Check: each pillar is introduced in at least one foundational course; each pillar is reinforced across multiple courses; each pillar reaches mastery level before program completion; all pillars are synthesized together in capstone experience(s); no courses are unmapped; progression is logical (Introduction → Reinforcement → Mastery → Synthesis).

Balance Check: pillars are evenly distributed across the program; no single pillar dominates excessively; synthesis opportunities exist throughout the program, not just at the end.

Industry Alignment Verification: all pillars directly connect to industry expectations; pillar definitions reflect current workforce needs; mastery levels align with entry-level professional competencies.`,
  coursecontent: `Use this template to document all course content for programs currently in development or revision. For each course, complete the Proposed/New columns in full; if the course is a revision of an existing course, also complete the Original columns with the current course information so changes can be clearly tracked.

Each entry should include the course description, proposed learning outcomes, sample session topics, and sample grading opportunities — all information necessary for Curriculum Council review and Banner entry.

Also indicate which pillar each course's outcomes map to (pillars must be defined in Deliverable III first).

If anything changes in one of these entries after the fact, it should inform the rest of the site and prompt a reconciliation — treat this as a decision log: every change gets saved along the way, and a check can be run to see what hasn't yet been reconciled, giving a running log of decisions made.`,
  assessment: `You've created the pillars and defined them. You've created your course outcomes that align to your pillars. You've mapped your pillars across the program. Now you need to draft the criteria to measure them and select the courses/artifacts used for measurement.`,
  transition: `This document will be shared with advising staff alongside the Curriculum Transition Plan. It provides the context and escalation guidance advisers need before supporting students through the change.

Section 1 — What This Is and Why It's Happening: in 2–3 sentences, explain the change or launch in plain language. What is driving this? What will be different for students?

Section 2 — The Three Things Every Adviser Must Know: the most critical facts about this change. Every adviser should be able to confirm these before speaking with a student. If a student question cannot be answered using these three points or the Transition Plan, use the escalation path.

Section 3 — Student Impact by Cohort: what this change means for students currently in the program, students entering under the new curriculum, students mid-sequence in affected courses, and transfer students.

Section 4 — Edge Cases to Watch For: student situations that are not straightforward and should not be advised without checking with Curriculum & Assessment or the department first (e.g. a retired course whose downstream prerequisite hasn't been fulfilled; a returning student under a prior catalog year; double-majors with overlapping old/new coursework).

Section 5 — Questions + Escalation Contacts: primary Curriculum & Assessment contact, Degree Planner contact, and Banner/enrollment contact.`,
  resources: `Use the following tables to analyze your additional faculty, training, hardware, software, space, and major equipment needs. All programs complete the top section on existing faculty. The remaining sections only need to be completed if resources are being requested.

1. Existing Faculty Analysis: list current faculty with the courses they will teach in the new curriculum (go by the new stick figure), their area/specialization, how many classes they're contracted to teach each year, and what capacity they have for additional classes. The aim is to ensure you have the faculty needed to transition seamlessly. Don't forget the number of sections you may need to satisfy demand.

2. Additional Faculty Needs: for each new position — full-time or part-time, course(s) they'd teach, required expertise/specialization, industry experience and educational requirements, and justification (why can't current faculty cover this, how many students would it serve, student-to-faculty ratio impact).

3. Faculty Training Needs: for each training type — expertise/skills needed, number of faculty needing it, and justification (what new content/skills, why essential, how it aligns with revised pillars). Training types include industry certification, software/technology training, conferences/workshops, graduate coursework, industry internships/fellowships, and vendor training.

4. Additional Hardware Needs: type, quantity, program integration (which courses, which outcomes, how many students per quarter), industry alignment (what standard it represents, what certifications it enables), space/special requirements, and timeline.

5. Additional Software Needs: title, license type, quantity/users, program integration, industry alignment, technical requirements, and timeline.

6. Additional Space Needs: space type, student capacity, program integration, industry alignment, special requirements (lighting, power, ventilation, tech, safety, accessibility), and timeline.

7. Additional Major Equipment Needs: type, quantity, program integration, industry alignment, space requirements, and timeline.`,
  syllabus: `Building lecture topics and grading opportunities for each course in the sequence.`
};
function instructionsBlock(key){
  const text = FULL_INSTRUCTIONS[key];
  if(!text) return '';
  return `<div class="instr"><div class="instr-label">Full instructions</div><div class="instr-body">${esc(text)}</div></div>`;
}
